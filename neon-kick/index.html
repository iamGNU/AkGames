  ctx.beginPath(); ctx.arc(30, yb, 4, 0, TAU); ctx.fillStyle = pad ? CFG.color.good : CFG.color.warn; ctx.fill();
  ctx.textAlign = 'left';
  text(!navigator.getGamepads ? 'Controllers unavailable here' : pad ? shortId(pad.id) : 'Connect a controller, press any button',
    42, yb, `600 12px ${SANS}`, CFG.color.dim);
  ctx.textAlign = 'center';
  drawCreditsLink(text, yb, `500 12px ${SANS}`, CFG.color.dim);
  text(`Made with ♥ for ${CREDITS.dedication}`, W / 2, yb - 23, `600 12px ${SANS}`, '#ff9ee0');
  ctx.textAlign = 'right';
  text(`W ${record.w}  ·  D ${record.d}  ·  L ${record.l}`, W - 24, yb, `600 12px ${MONO}`, CFG.color.dim);
  if (!Sfx.ctx || Sfx.ctx.state !== 'running') text(usingTouch() ? 'tap for sound' : 'click for sound', W - 24, 24, `500 11px ${SANS}`, CFG.color.faint);
}

function drawHowTo() {
  ctx.drawImage(pitchCanvas, 0, 0, W, H);
  overlay(0.86);
  const N = padNames();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('HOW TO PLAY', W / 2, 46, `800 32px ${SANS}`, CFG.color.title);
  const rows = [
    ['Move', 'Left stick / D-pad', 'W A S D / arrows', 'Stick (left side)'],
    ['Pass (with the ball)', N.a, 'J', 'PASS'],
    ['Shoot: hold for power', `${N.b} or ${N.x}`, 'K or Space', 'Hold SHOOT'],
    ['Slide tackle (no ball)', `${N.b} or ${N.x}`, 'K or Space', 'TACKLE'],
    ['Switch player (no ball)', `${N.a} or ${N.lb}`, 'J or Q', 'SWITCH'],
    ['Sprint', `${N.rb} or ${N.rt}`, 'Shift or L', 'Stick to the edge'],
    ['Pause', N.start, 'Esc', 'Pause button'],
  ];
  const cols = [300, 470, 640]; // controller, keyboard, touch
  ctx.textAlign = 'left';
  text('CONTROLLER', cols[0], 88, `800 11px ${SANS}`, CFG.color.faint);
  text('KEYBOARD', cols[1], 88, `800 11px ${SANS}`, CFG.color.faint);
  text('TOUCH', cols[2], 88, `800 11px ${SANS}`, CFG.color.faint);
  rows.forEach((r, i) => {
    const y = 112 + i * 23;
    ctx.textAlign = 'right'; text(r[0], cols[0] - 20, y, `600 14px ${SANS}`, CFG.color.dim);
    ctx.textAlign = 'left';
    for (let c = 0; c < 3; c++) text(r[c + 1], cols[c], y, `600 14px ${SANS}`, CFG.color.text);
  });
  ctx.fillStyle = 'rgba(131,144,189,0.2)'; ctx.fillRect(90, 286, W - 180, 1);
  const col = (title, x, lines) => {
    text(title, x, 312, `800 11px ${SANS}`, CFG.color.faint);
    lines.forEach((s, i) => text(s, x, 340 + i * 25, `500 14px ${SANS}`, CFG.color.text));
  };
  col('MATCH', 90, [
    'You control the player with the white ring.',
    'Face away from defenders to shield the ball.',
    'Hold the stick up or down while shooting',
    'to aim for a corner.',
    'A draw can be settled on penalties.',
  ]);
  col('PENALTIES', 520, usingTouch() ? [
    'Kicking: aim with the stick, hold SHOOT',
    'to power up, let go to shoot. Too much',
    'power (red) can sail over the bar.',
    'Keeping: tap DIVE ▲ or DIVE ▼ to dive,',
    'or STAY in the middle.',
  ] : [
    'Kicking: aim with ↑ ↓, hold to power up,',
    'release to shoot. Too much power (red)',
    'can sail over the bar.',
    'Keeping: pick a side with ↑ ↓, press to dive,',
    'or stay in the middle.',
  ]);
  ctx.textAlign = 'center';
  text(usingPad() ? `${N.b}: back` : usingTouch() ? 'Tap to go back' : 'Esc or click: back', W / 2, H - 28, `600 13px ${SANS}`, CFG.color.dim);
}

function drawPause() {
  overlay(0.62);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('PAUSED', W / 2, 180, `800 46px ${SANS}`, CFG.color.text);
  drawMenu(PAUSE_ITEMS, 262);
  const N = padNames();
  text(usingTouch() ? `Tap an option   ·   sound ${Sfx.muted ? 'off' : 'on'} (button at the top right)`
    : `${usingPad() ? N.select : 'M'}: sound ${Sfx.muted ? 'off' : 'on'}`, W / 2, 380, `500 12px ${SANS}`, CFG.color.faint);
}

function drawResult() {
  overlay(Math.min(0.75, stateT * 1.5));
  const r = resultInfo;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const title = r.outcome === 'win' ? 'YOU WIN!' : r.outcome === 'lose' ? 'YOU LOSE' : 'DRAW';
  const color = r.outcome === 'win' ? CFG.color.good : r.outcome === 'lose' ? CFG.color.bad : CFG.color.warn;
  glowText(title, W / 2, 120, `800 56px ${SANS}`, color);
  text(`${TEAM_NAME[0]}  ${r.score[0]}  –  ${r.score[1]}  ${TEAM_NAME[1]}`, W / 2, 186, `800 30px ${MONO}`, CFG.color.text);
  if (r.kind === 'match') {
    text(`Shots ${r.shots[0]} – ${r.shots[1]}   ·   Possession ${r.poss}% – ${100 - r.poss}%`, W / 2, 226, `600 15px ${SANS}`, CFG.color.dim);
  } else {
    text('on penalties', W / 2, 226, `600 15px ${SANS}`, CFG.color.dim);
  }
  drawMenu(resultItems(), 300, stateT > 0.8);
}

function drawToast() {
  if (toast.t <= 0) return;
  ctx.globalAlpha = Math.min(1, toast.t * 3);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  text(toast.text, W / 2, H - 46, `600 14px ${SANS}`, CFG.color.text);
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------
// Touch controls: drawn last, and only when the last input was a touch
// ------------------------------------------------------------
function drawButton(r, icon) { // the small square pause / sound buttons
  rrPath(r.x, r.y, r.w, r.h, 12);
  ctx.fillStyle = 'rgba(8,12,28,0.6)'; ctx.fill();
  ctx.globalAlpha = 0.6; glowStroke(CFG.color.title, 1.2); ctx.globalAlpha = 1;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.fillStyle = CFG.color.text; ctx.strokeStyle = CFG.color.text;
  if (icon === 'pause') { ctx.fillRect(cx - 7, cy - 9, 5, 18); ctx.fillRect(cx + 2, cy - 9, 5, 18); return; }
  ctx.beginPath();
  ctx.moveTo(cx - 11, cy - 4); ctx.lineTo(cx - 6, cy - 4); ctx.lineTo(cx, cy - 10);
  ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 6, cy + 4); ctx.lineTo(cx - 11, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
  if (Sfx.muted) { ctx.moveTo(cx + 4, cy - 5); ctx.lineTo(cx + 12, cy + 5); ctx.moveTo(cx + 12, cy - 5); ctx.lineTo(cx + 4, cy + 5); ctx.stroke(); }
  else { ctx.arc(cx + 2, cy, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 2, cy, 11, -0.9, 0.9); ctx.stroke(); }
  ctx.lineCap = 'butt';
}

// A round action button. `charge` (0..1) draws a power ring around it, since the thumb hides the button.
function drawTouchButton(b, label, color, live, charge, chargeColor) {
  const held = touchHeld(b.id), a = live ? (held ? 0.95 : 0.7) : 0.3;
  ctx.globalAlpha = a * (held ? 0.32 : 0.14);
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fillStyle = color; ctx.fill();
  ctx.globalAlpha = a;
  glowStroke(color, held ? 2.6 : 1.8);
  if (charge > 0) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, charge));
    ctx.strokeStyle = chargeColor; ctx.lineWidth = 5; ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (b.dive) { // DIVE with an arrow on the side it points to
    const s = b.dive, ay = b.y + s * 12;
    ctx.beginPath(); ctx.moveTo(b.x - 10, ay - s * 6); ctx.lineTo(b.x + 10, ay - s * 6); ctx.lineTo(b.x, ay + s * 8); ctx.closePath();
    ctx.fillStyle = CFG.color.text; ctx.fill();
    text(label, b.x, b.y - s * 13, `800 14px ${SANS}`, CFG.color.text);
  } else {
    text(label, b.x, b.y + 1, `800 ${b.r >= 48 ? 17 : 15}px ${SANS}`, CFG.color.text);
  }
  ctx.globalAlpha = 1;
}

function drawTouchControls() {
  if (!usingTouch()) return;
  const playing = state === 'match' || state === 'pens';
  if (!playing && state !== 'paused') return;
  drawButton(SOUND_BTN, 'sound');
  drawButton(PAUSE_BTN, 'pause');
  if (!playing) return;
  const C = CFG.color;
  // Move stick: a faint resting spot until the left thumb lands, then it sits under the thumb.
  const S = Input.stick, on = S.id !== null, R = TOUCH.baseR;
  const bx = on ? clamp(S.ox, R + 4, W - R - 4) : TOUCH.idleX, by = on ? clamp(S.oy, R + 4, H - R - 4) : TOUCH.idleY;
  const kx = on ? bx + S.x - S.ox : bx, ky = on ? by + S.y - S.oy : by;
  const ring = S.sprint ? C.good : C.you;
  ctx.globalAlpha = on ? 0.16 : 0.08;
  ctx.beginPath(); ctx.arc(bx, by, R, 0, TAU); ctx.fillStyle = ring; ctx.fill();
  ctx.globalAlpha = on ? 0.8 : 0.35;
  glowStroke(ring, S.sprint ? 2.6 : 1.6);
  ctx.globalAlpha = on ? 0.35 : 0.15;
  ctx.beginPath(); ctx.arc(kx, ky, TOUCH.knobR, 0, TAU); ctx.fillStyle = C.you; ctx.fill();
  ctx.globalAlpha = on ? 0.95 : 0.4;
  glowStroke(C.you, 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (!on) text('MOVE', bx, by + 1, `800 12px ${SANS}`, C.text);
  else if (S.sprint) text('SPRINT', bx, by - R - 13, `800 12px ${SANS}`, C.good);
  ctx.globalAlpha = 1;
  // Action buttons
  if (state === 'match') {
    const live = M.phase === 'play', mine = !!controlled && ball.owner === controlled;
    const charge = live && mine && M.charging ? M.charge / CFG.shot.charge : 0;
    drawTouchButton(TB.shoot, mine ? 'SHOOT' : 'TACKLE', mine ? C.warn : C.bad, live, charge, charge > 0.85 ? C.warn : C.good);
    drawTouchButton(TB.pass, mine ? 'PASS' : 'SWITCH', C.you, live, 0, '');
  } else if (P.turn === 0) {
    const charge = P.phase === 'aim' && P.charging ? P.power / 1.2 : 0;
    drawTouchButton(TB.shoot, 'SHOOT', C.warn, P.phase === 'aim', charge, P.power > 1 ? C.bad : P.power > 0.7 ? C.good : C.warn);
  } else {
    const live = (P.phase === 'runup' || P.phase === 'flight') && !P.keeper.dived;
    drawTouchButton(TB.up, 'DIVE', C.you, live, 0, '');
    drawTouchButton(TB.stay, 'STAY', C.you, live, 0, '');
    drawTouchButton(TB.down, 'DIVE', C.you, live, 0, '');
  }
}

let fps = 60;
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (state === 'title' || state === 'howto') {
    ctx.setTransform(rs, 0, 0, rs, 0, 0);
    if (state === 'title') drawTitle(); else drawHowTo();
  } else {
    const sx = shake > 0.2 ? rand(-shake, shake) : 0, sy = shake > 0.2 ? rand(-shake, shake) : 0;
    if (scene === 'match') {
      ctx.setTransform(rs, 0, 0, rs, sx * rs, sy * rs);
      renderMatch();
      ctx.setTransform(rs, 0, 0, rs, 0, 0);
      if (state !== 'result') renderMatchHUD();
    } else {
      renderPens();
      if (state !== 'result') renderPensHUD();
    }
    if (state === 'paused') drawPause();
    if (state === 'result') drawResult();
  }
  drawToast();
  drawTouchControls();
  if (SHOW_FPS) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    text(`${Math.round(fps)} fps`, W - 12, H - 6, `600 12px ${MONO}`, CFG.color.good);
  }
}

// ============================================================
// Main loop
// ============================================================
let last = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (SHOW_FPS && dt > 0) fps += (1 / dt - fps) * 0.05;
  if (dt > 0.05) dt = 0.05;
  Input.poll(dt);
  update(dt);
  render();
  Input.endFrame();
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'match' || state === 'pens')) pauseGame();
});
addEventListener('resize', resize);
Input.init();
resize();
requestAnimationFrame(t => { last = t; frame(t); });

// Keep the screen on while someone is playing. The operating system only counts
// keyboard and mouse as activity, so during controller play it would switch the
// display off. After 5 minutes with no input at all the lock is let go, so a
// forgotten tab still lets the screen sleep.
(function () {
  if (typeof navigator === 'undefined' || !navigator.wakeLock) return;
  var IDLE_MS = 5 * 60 * 1000;
  var lock = null, asking = false, last = Date.now(), axes = [];
  function hold() {
    if (lock || asking || document.visibilityState !== 'visible') return;
    asking = true;
    navigator.wakeLock.request('screen').then(function (l) {
      asking = false;
      lock = l;
      l.addEventListener('release', function () { if (lock === l) lock = null; });
    }, function () { asking = false; });
  }
  function active() { last = Date.now(); hold(); }
  ['keydown', 'pointerdown', 'pointermove', 'wheel'].forEach(function (t) {
    addEventListener(t, active, { passive: true });
  });
  // The system drops the lock when the tab is hidden; take it again on return.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') active();
  });
  // Controllers fire no events for buttons or sticks, so look at them directly.
  setInterval(function () {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      if (!p) continue;
      var a = axes[i] || (axes[i] = []);
      for (var b = 0; b < p.buttons.length; b++) if (p.buttons[b].pressed) { active(); break; }
      for (var k = 0; k < p.axes.length; k++) {
        if (Math.abs(p.axes[k] - (a[k] || 0)) > 0.25) active();
        a[k] = p.axes[k];
      }
    }
    if (lock && Date.now() - last > IDLE_MS) {
      var l = lock;
      lock = null;
      l.release().catch(function () {});
    }
  }, 250);
  active();
})();

// The credits link to the developer's LinkedIn profile: "Akash" is underlined with a small "in"
// badge, and a click or tap on the credits line on the title screen opens the profile in a new tab.
let creditsHit = null;
function drawCreditsLink(draw, y, font, color) {
  const LINK = '#7cc4ff', a = 'Developer: ', b = CREDITS.developer, c = `  ·  Co-developer: ${CREDITS.coDeveloper}`;
  ctx.font = font;
  const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, wc = ctx.measureText(c).width;
  const badge = 14, gap = 5, total = wa + wb + gap + badge + wc, x0 = W / 2 - total / 2, align = ctx.textAlign;
  ctx.textAlign = 'left';
  draw(a, x0, y, font, color);
  draw(b, x0 + wa, y, font, LINK);
  ctx.fillStyle = LINK; ctx.fillRect(x0 + wa, y + 7, wb, 1);
  const bx = x0 + wa + wb + gap;
  ctx.fillStyle = '#0a66c2';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, y - badge / 2, badge, badge, 3); ctx.fill(); } else ctx.fillRect(bx, y - badge / 2, badge, badge);
  ctx.font = `800 10px ${SANS}`; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.fillText('in', bx + badge / 2, y + 0.5);
  ctx.textAlign = 'left';
  draw(c, bx + badge, y, font, color);
  ctx.textAlign = align;
  creditsHit = { x: x0 - 8, y: y - 13, w: total + 16, h: 26, t: Date.now() };
}
(function () {
  var cv = typeof document !== 'undefined' && document.getElementById('game');
  if (!cv || !cv.getBoundingClientRect || typeof addEventListener === 'undefined') return;
  function over(e) { // on the credits line, while the title screen is showing
    var h = creditsHit;
    if (!h || Date.now() - h.t > 300) return false;
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    var x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
    return x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h;
  }
  addEventListener('pointerup', function (e) {
    if (e.button > 0 || !over(e)) return;
    try { window.open(CREDITS.profile, '_blank', 'noopener'); } catch (err) { /* pop-ups blocked */ }
  });
  var hovering = false, saved = '';
  addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var on = over(e);
    if (on === hovering) return;
    hovering = on;
    if (on) { saved = cv.style.cursor; cv.style.cursor = 'pointer'; } else cv.style.cursor = saved;
  }, { passive: true });
})();

// Full screen on phones and tablets. Browsers only allow it after a tap, so the first tap in the
// game hides the address bar and the system bars, and turns the game sideways where the phone
// allows it. Swiping back leaves full screen; the next tap returns to it. Mouse players keep their window.
(function () {
  var el = typeof document !== 'undefined' && document.documentElement;
  if (!el || typeof addEventListener === 'undefined') return;
  var request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!request) return;
  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement) ||
      !!(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
  }
  addEventListener('pointerup', function (e) {
    if (e.pointerType === 'mouse' || isFull()) return;
    try {
      var p = request.call(el, { navigationUI: 'hide' });
      if (p && p.then) {
        p.then(function () {
          var o = screen.orientation;
          if (o && o.lock) o.lock('landscape').catch(function () {});
        }, function () {});
      }
    } catch (err) { /* not allowed here: the game still works in the window */ }
  }, { passive: true });
})();

// Offline play: Zuzu's service worker saves every game. It needs http(s), so it is skipped
// when the file is opened straight from disk.
if (typeof navigator !== 'undefined' && navigator.serviceWorker && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
}
