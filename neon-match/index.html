<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Match</title>
<meta name="author" content="Akash (developer), Claude Code (co-developer)">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #turn { display: none; position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px; text-align: center;
    font: 600 15px system-ui, sans-serif; color: #e8f0ff; background: rgba(10, 14, 32, 0.88); pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: block; } }
</style>
</head>
<body>
<div id="turn">↻ Turn your phone sideways for a bigger view</div>
<canvas id="game" width="960" height="540"></canvas>
<script>
'use strict';

// ============================================================
// 1. Settings (tweak these to change how the game feels)
// ============================================================
const CREDITS = { developer: 'Akash', coDeveloper: 'Claude Code' };
const W = 960, H = 540, TAU = Math.PI * 2;
const N = 8;                                   // the board is N x N cells
const CELL = 56;                               // cell size
const BW = N * CELL;                           // board width and height
const BX = (W - BW) / 2, BY = (H - BW) / 2;    // board top-left corner
const SPR = CELL + 16;                         // gem sprite size (room for the glow)
const QS = new URLSearchParams(location.search);
const SHOW_FPS = QS.has('fps');
const LOW_RES = QS.has('low');
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif';
const MONO = 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace';

const CFG = {
  moves: 30,                          // moves per game in Moves mode
  hintDelay: 6,                       // seconds without input before a hint glows
  points: 10,                         // points per gem, times the cascade step
  level: { first: 1000, grow: 500 },  // Zen: level 2 at 1000 points; each later level needs 500 more than the last
  // Animation times in seconds at Normal pace
  anim: { swap: 0.17, back: 0.3, pop: 0.3, wave: 0.035, fallBase: 0.2, fallCell: 0.05, stagger: 0.012, shuffle: 0.5, born: 0.4 },
  color: {
    text: '#e8f0ff', dim: '#8390bd', faint: '#56608a', title: '#8fd8ff', good: '#7dffc0', warn: '#ffd88a',
  },
};
// Six gem kinds. Each has its own colour AND shape, so they're easy to tell apart.
const GEMS = [
  { shape: 'circle',   color: '#4fe3ff' },
  { shape: 'diamond',  color: '#ff6fcf' },
  { shape: 'triangle', color: '#ffe066' },
  { shape: 'square',   color: '#6dff9e' },
  { shape: 'hexagon',  color: '#a68bff' },
  { shape: 'star',     color: '#ff9a5c' },
];
const TYPES = GEMS.length;
const NONE = 0, LINE_H = 1, LINE_V = 2, NOVA = 3;   // special gems
const NOVA_T = -1;                                   // a nova has no colour of its own
const PACES = ['relaxed', 'normal', 'quick'];
const PACE_LABEL = { relaxed: 'Relaxed', normal: 'Normal', quick: 'Quick' };
const PACE_MUL = { relaxed: 0.72, normal: 1, quick: 1.4 };
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98]; // C major pentatonic
const CHAIN_WORDS = ['', '', 'Nice', 'Lovely', 'Wonderful', 'Dreamy', 'Sublime'];
const LEVEL_WORDS = ['Breathe in, breathe out', 'Nicely done', 'Calm and steady', 'Lovely rhythm', 'Keep floating', 'Easy does it'];
const LEVEL_TINTS = ['#8fd8ff', '#a68bff', '#6dff9e', '#ff6fcf', '#ffe066', '#4fe3ff'];

// ============================================================
// Helpers
// ============================================================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function radial(x, y, dz, out) {
  const m = Math.hypot(x, y);
  if (m < dz) { out.x = 0; out.y = 0; out.m = 0; return out; }
  const n = Math.min(1, (m - dz) / (1 - dz));
  out.x = (x / m) * n; out.y = (y / m) * n; out.m = n;
  return out;
}
function load(key, def) { try { const v = localStorage.getItem(key); return v == null ? def : v; } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) { /* storage blocked: ignore */ } }
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);  // smooth in and out
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const backOut = t => { const s = 1.6, u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const rowOf = k => (k / N) | 0, colOf = k => k % N;
const cellX = k => BX + (colOf(k) + 0.5) * CELL, cellY = k => BY + (rowOf(k) + 0.5) * CELL;
const cellDist = (a, b) => Math.hypot(rowOf(a) - rowOf(b), colOf(a) - colOf(b));
const adjacent = (a, b) => Math.abs(rowOf(a) - rowOf(b)) + Math.abs(colOf(a) - colOf(b)) === 1;
function cellAt(x, y) {
  const c = Math.floor((x - BX) / CELL), r = Math.floor((y - BY) / CELL);
  return r >= 0 && r < N && c >= 0 && c < N ? r * N + c : -1;
}

class Pool {
  constructor(n, make) {
    this.items = [];
    for (let i = 0; i < n; i++) { const o = make(); o.active = false; this.items.push(o); }
    this.next = 0;
  }
  get() {
    const a = this.items, n = a.length;
    for (let k = 0; k < n; k++) {
      const i = (this.next + k) % n;
      if (!a[i].active) { this.next = (i + 1) % n; a[i].active = true; return a[i]; }
    }
    return null;
  }
  clear() { for (const o of this.items) o.active = false; }
}

// ============================================================
// Canvas + art (gems, board and background are drawn once into caches)
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let rs = 1;
let bgCanvas = null, boardCanvas = null, novaSprite = null;
let gemSprites = [], dotSprites = [];   // gemSprites[t * 3 + special]; dotSprites[0..5] gem colours, [6] white

function layer(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * rs); c.height = Math.ceil(h * rs);
  const g = c.getContext('2d');
  g.setTransform(rs, 0, 0, rs, 0, 0);
  return { c, g };
}

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  const dpr = window.devicePixelRatio || 1;
  rs = LOW_RES ? 1 : clamp(s * dpr, 1, 1.5);
  canvas.width = Math.round(W * rs);
  canvas.height = Math.round(H * rs);
  buildArt();
}

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function gemPath(g, t, R) {
  g.beginPath();
  switch (GEMS[t].shape) {
    case 'circle': g.arc(0, 0, R * 0.98, 0, TAU); break;
    case 'diamond':
      g.moveTo(0, -R * 1.14); g.lineTo(R * 0.86, 0); g.lineTo(0, R * 1.14); g.lineTo(-R * 0.86, 0); g.closePath();
      break;
    case 'triangle':
      g.moveTo(0, -R * 1.18); g.lineTo(R * 1.08, R * 0.74); g.lineTo(-R * 1.08, R * 0.74); g.closePath();
      break;
    case 'square': rr(g, -R * 0.84, -R * 0.84, R * 1.68, R * 1.68, R * 0.3); break;
    case 'hexagon':
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6, x = Math.cos(a) * R * 1.03, y = Math.sin(a) * R * 1.03;
        if (i) g.lineTo(x, y); else g.moveTo(x, y);
      }
      g.closePath();
      break;
    case 'star':
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? R * 0.52 : R * 1.16;
        if (i) g.lineTo(Math.cos(a) * d, Math.sin(a) * d); else g.moveTo(Math.cos(a) * d, Math.sin(a) * d);
      }
      g.closePath();
      break;
  }
}

function drawGemSprite(t, sp) {
  const { c, g } = layer(SPR, SPR), col = GEMS[t].color, R = CELL * 0.33;
  g.translate(SPR / 2, SPR / 2);
  const halo = g.createRadialGradient(0, 0, R * 0.2, 0, 0, SPR / 2);
  halo.addColorStop(0, hexA(col, 0.2)); halo.addColorStop(1, hexA(col, 0));
  g.fillStyle = halo; g.fillRect(-SPR / 2, -SPR / 2, SPR, SPR);
  gemPath(g, t, R);
  const body = g.createLinearGradient(0, -R, 0, R);
  body.addColorStop(0, hexA(col, 0.6)); body.addColorStop(1, hexA(col, 0.16));
  g.fillStyle = body; g.fill();
  // Neon edge: wide faint strokes under a thin bright one
  g.lineJoin = 'round'; g.strokeStyle = col;
  g.globalAlpha = 0.12; g.lineWidth = 9; g.stroke();
  g.globalAlpha = 0.28; g.lineWidth = 4.5; g.stroke();
  g.globalAlpha = 1; g.lineWidth = 2.2; g.stroke();
  gemPath(g, t, R * 0.52);
  g.globalAlpha = 0.25; g.strokeStyle = '#ffffff'; g.lineWidth = 1.2; g.stroke();
  g.globalAlpha = 0.6; g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(-R * 0.3, -R * 0.42, R * 0.2, R * 0.11, -0.6, 0, TAU); g.fill();
  g.globalAlpha = 1;
  if (sp === LINE_H || sp === LINE_V) { // a white double arrow shows which way it clears
    if (sp === LINE_V) g.rotate(Math.PI / 2);
    const e = R * 1.25;
    g.beginPath();
    g.moveTo(-e, 0); g.lineTo(e, 0);
    g.moveTo(-e + 6, -5); g.lineTo(-e, 0); g.lineTo(-e + 6, 5);
    g.moveTo(e - 6, -5); g.lineTo(e, 0); g.lineTo(e - 6, 5);
    g.lineCap = 'round'; g.strokeStyle = '#ffffff';
    g.globalAlpha = 0.25; g.lineWidth = 7; g.stroke();
    g.globalAlpha = 1; g.lineWidth = 2.2; g.stroke();
  }
  return c;
}

function drawNovaSprite() {
  const { c, g } = layer(SPR, SPR), R = CELL * 0.33;
  g.translate(SPR / 2, SPR / 2);
  const halo = g.createRadialGradient(0, 0, R * 0.2, 0, 0, SPR / 2);
  halo.addColorStop(0, 'rgba(255,255,255,0.22)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = halo; g.fillRect(-SPR / 2, -SPR / 2, SPR, SPR);
  g.lineCap = 'round';
  for (let i = 0; i < TYPES; i++) { // a ring made of every gem colour
    const a0 = i * TAU / TYPES - Math.PI / 2;
    g.beginPath(); g.arc(0, 0, R, a0 + 0.1, a0 + TAU / TYPES - 0.1);
    g.strokeStyle = GEMS[i].color;
    g.globalAlpha = 0.25; g.lineWidth = 8; g.stroke();
    g.globalAlpha = 1; g.lineWidth = 3; g.stroke();
  }
  const core = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.78);
  core.addColorStop(0, 'rgba(255,255,255,0.95)'); core.addColorStop(0.45, 'rgba(220,235,255,0.45)'); core.addColorStop(1, 'rgba(200,220,255,0)');
  g.fillStyle = core; g.beginPath(); g.arc(0, 0, R * 0.78, 0, TAU); g.fill();
  g.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, d = i % 2 ? R * 0.13 : R * 0.56;
    if (i) g.lineTo(Math.cos(a) * d, Math.sin(a) * d); else g.moveTo(Math.cos(a) * d, Math.sin(a) * d);
  }
  g.closePath(); g.fillStyle = '#ffffff'; g.fill();
  return c;
}

function drawDot(col) {
  const { c, g } = layer(24, 24);
  const rg = g.createRadialGradient(12, 12, 0, 12, 12, 12);
  rg.addColorStop(0, 'rgba(255,255,255,0.95)'); rg.addColorStop(0.25, hexA(col, 0.85)); rg.addColorStop(1, hexA(col, 0));
  g.fillStyle = rg; g.fillRect(0, 0, 24, 24);
  return c;
}

function buildArt() {
  // Background: deep blue gradient with a few soft colour clouds
  let L = layer(W, H), g = L.g;
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#05070f'); grad.addColorStop(1, '#0a0d1c');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (const [x, y, r, col, a] of [[140, 110, 300, '#3a5cff', 0.1], [830, 440, 320, '#a64dff', 0.08], [880, 70, 220, '#20c0d0', 0.06], [80, 480, 240, '#ff4fa8', 0.05]]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, hexA(col, a)); rg.addColorStop(1, hexA(col, 0));
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  bgCanvas = L.c;
  // Board: a dark rounded panel with softly checkered cells
  L = layer(BW + 40, BW + 40); g = L.g;
  g.translate(20, 20);
  rr(g, -10, -10, BW + 20, BW + 20, 16); g.fillStyle = 'rgba(8,11,26,0.88)'; g.fill();
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      rr(g, c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4, 10);
      g.fillStyle = (r + c) % 2 ? 'rgba(120,150,255,0.045)' : 'rgba(120,150,255,0.08)'; g.fill();
    }
  }
  boardCanvas = L.c;
  gemSprites = [];
  for (let t = 0; t < TYPES; t++) for (let sp = 0; sp < 3; sp++) gemSprites.push(drawGemSprite(t, sp));
  novaSprite = drawNovaSprite();
  dotSprites = [...GEMS.map(m => m.color), '#ffffff'].map(drawDot);
}

// ============================================================
// Sound: tiny WebAudio synth, no audio files. Soft sine bells only.
// ============================================================
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: false, last: {},
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.3;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.6);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (e) { /* no audio: game still works */ }
  },
  ok(key, gap) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return false;
    if (key) {
      const now = this.ctx.currentTime;
      if (now - (this.last[key] || 0) < gap) return false;
      this.last[key] = now;
    }
    return true;
  },
  // A note with a soft attack and a gentle fade (no clicks)
  tone(f1, f2, dur, type, vol, delay = 0, attack = 0.012) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, delay = 0) { // a soft airy swell
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  bell(f, vol, delay = 0, dur = 0.5) {
    this.tone(f, f, dur, 'sine', vol, delay);
    this.tone(f * 2, f * 2, dur * 0.45, 'sine', vol * 0.22, delay);
  },
  pop(chain) {
    if (!this.ok('pop', 0.05)) return;
    const f = NOTES[clamp(chain - 1, 0, NOTES.length - 1)];
    this.bell(f, 0.11, 0, 0.5);
    this.tone(f / 2, f / 2, 0.3, 'triangle', 0.035);
  },
  tink()    { if (this.ok('tink', 0.07)) { const f = NOTES[(Math.random() * NOTES.length) | 0] * 2; this.tone(f, f, 0.25, 'sine', 0.025); } },
  swap()    { if (this.ok('swap', 0.05)) this.tone(330, 440, 0.13, 'sine', 0.05); },
  nope()    { if (this.ok('nope', 0.1)) { this.tone(392, 392, 0.14, 'sine', 0.04, 0.08); this.tone(330, 330, 0.2, 'sine', 0.035, 0.2); } },
  grab()    { if (this.ok('grab', 0.04)) this.tone(660, 740, 0.09, 'sine', 0.04); },
  drop()    { if (this.ok('grab', 0.04)) this.tone(600, 520, 0.09, 'sine', 0.035); },
  line()    { if (this.ok('line', 0.08)) { this.tone(440, 1320, 0.42, 'sine', 0.045); this.noise(0.45, 0.03, 2200); } },
  nova()    { if (this.ok('nova', 0.1)) [0, 2, 4, 5, 7].forEach((n, i) => this.bell(NOTES[n], 0.055, i * 0.06, 0.7)); },
  make()    { if (this.ok('make', 0.1)) { this.bell(1046.5, 0.05, 0.05, 0.5); this.bell(1567.98, 0.035, 0.13, 0.5); } },
  levelUp() { if (this.ok('level', 0.5)) [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.bell(f, 0.065, i * 0.13, 1.1)); },
  shuffle() { if (this.ok('shuffle', 0.3)) { this.tone(330, 660, 0.5, 'sine', 0.04); this.tone(660, 440, 0.5, 'sine', 0.03, 0.45); } },
  finish()  { if (this.ok()) [261.63, 329.63, 392, 493.88, 523.25].forEach((f, i) => this.bell(f, 0.06, i * 0.11, 1.5)); },
  tick()    { if (this.ok('tick', 0.03)) this.tone(880, 880, 0.05, 'sine', 0.03); },
  select()  { if (this.ok()) { this.tone(660, 660, 0.09, 'sine', 0.05); this.tone(990, 990, 0.13, 'sine', 0.045, 0.06); } },
  blip()    { if (this.ok()) this.tone(600, 600, 0.08, 'sine', 0.04); },
  toggle() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.3;
  },
};

// ============================================================
// Input: gamepad + keyboard + mouse/touch merged into one state
// ============================================================
const NAV_CODES = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);
const Input = {
  keys: new Set(), pressed: new Set(), navKeys: new Set(),
  // One pointer (mouse, pen or finger) in world coordinates
  mouse: { x: W / 2, y: H / 2, clicked: false, released: false, moved: false, down: false, id: null, type: 'mouse' },
  pad: null, padIndex: null, prev: [], stickDir: 0, stickHold: 0,
  device: 'kb',     // 'kb', 'pad', 'mouse' or 'touch': whatever was used last
  ls: { x: 0, y: 0, m: 0 },
  act: false, pause: false, mute: false, select: false, back: false,
  navUp: false, navDown: false, navLeft: false, navRight: false,

  init() {
    addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (!e.repeat) this.pressed.add(e.code);
      if (NAV_CODES.has(e.code)) this.navKeys.add(e.code);
      this.keys.add(e.code);
      this.device = 'kb';
      Sfx.init();
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; this.mouse.id = null; });
    canvas.addEventListener('pointerdown', e => {
      const m = this.mouse;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (m.down && m.id !== e.pointerId) return; // ignore a second finger
      e.preventDefault();
      this.toWorld(e);
      m.down = true; m.id = e.pointerId; m.clicked = true; m.moved = true;
      m.type = e.pointerType === 'mouse' ? 'mouse' : 'touch';
      this.device = m.type;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture not supported */ }
      Sfx.init();
    });
    canvas.addEventListener('pointermove', e => {
      const m = this.mouse;
      if (m.down && m.id !== e.pointerId) return;
      this.toWorld(e); m.moved = true;
    });
    const up = e => {
      const m = this.mouse;
      if (!m.down || m.id !== e.pointerId) return;
      this.toWorld(e);
      m.down = false; m.id = null; m.released = true;
      Sfx.init(); // touch only unlocks audio on release
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('gamepadconnected', e => {
      this.padIndex = e.gamepad.index; this.prev.length = 0; this.device = 'pad';
      showToast('Controller connected');
    });
    addEventListener('gamepaddisconnected', e => {
      if (this.padIndex === e.gamepad.index) this.padIndex = null;
      showToast('Controller disconnected');
      if (state === 'play') pauseGame();
    });
  },

  // Map a pointer event to the 960x540 world
  toWorld(e) {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.mouse.x = ((e.clientX - r.left) / r.width) * W;
    this.mouse.y = ((e.clientY - r.top) / r.height) * H;
  },

  getPad() {
    if (!navigator.getGamepads) return null;
    let pads;
    try { pads = navigator.getGamepads(); } catch (e) { return null; }
    if (!pads) return null;
    const cur = this.padIndex != null ? pads[this.padIndex] : null;
    if (cur && cur.connected) return cur;
    for (const p of pads) {
      if (p && p.connected) { this.padIndex = p.index; this.prev.length = 0; return p; }
    }
    this.padIndex = null;
    return null;
  },

  poll(dt) {
    const P = this.pressed, K = this.navKeys;
    let act = P.has('Space') || P.has('Enter');
    let pause = P.has('Escape') || P.has('KeyP');
    let mute = P.has('KeyM');
    let select = P.has('Enter') || P.has('Space');
    let back = P.has('Escape') || P.has('Backspace');
    let up = K.has('ArrowUp') || K.has('KeyW'), down = K.has('ArrowDown') || K.has('KeyS');
    let left = K.has('ArrowLeft') || K.has('KeyA'), right = K.has('ArrowRight') || K.has('KeyD');

    const pad = this.getPad();
    this.pad = pad;
    if (pad) {
      const prev = this.prev, btns = pad.buttons;
      const on = i => { const b = btns[i]; return !!b && (b.pressed || b.value > 0.5); };
      // First frame with this pad: buttons already held (e.g. A from the game picker) are not new presses.
      const fresh = !prev.length;
      if (fresh) for (let i = 0; i < btns.length; i++) prev[i] = on(i);
      const tap = i => on(i) && !prev[i];
      radial(pad.axes[0] || 0, pad.axes[1] || 0, 0.2, this.ls);
      if (tap(0)) act = true;
      if (tap(9)) pause = true;
      if (tap(8)) mute = true;
      if (tap(0) || tap(9)) select = true;
      if (tap(1)) back = true;
      // D-pad or left stick as a cursor: one step per push, auto-repeat when held.
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      let dir = 0;
      if (on(12)) dir = 1; else if (on(13)) dir = 2; else if (on(14)) dir = 3; else if (on(15)) dir = 4;
      else if (Math.abs(ay) > 0.6 && Math.abs(ay) >= Math.abs(ax)) dir = ay < 0 ? 1 : 2;
      else if (Math.abs(ax) > 0.6) dir = ax < 0 ? 3 : 4;
      let step = 0;
      if (fresh) { this.stickDir = dir; this.stickHold = 0; }
      else if (dir !== this.stickDir) { this.stickDir = dir; this.stickHold = 0; step = dir; }
      else if (dir) { this.stickHold += dt; if (this.stickHold > 0.35) { this.stickHold = 0.22; step = dir; } }
      if (step === 1) up = true; else if (step === 2) down = true; else if (step === 3) left = true; else if (step === 4) right = true;

      let any = false;
      for (let i = 0; i < btns.length; i++) { const v = on(i); if (v && !prev[i]) any = true; prev[i] = v; }
      if (any || this.ls.m > 0) this.device = 'pad';
      if (any) Sfx.init();
    }
    this.act = act; this.pause = pause; this.mute = mute; this.select = select; this.back = back;
    this.navUp = up; this.navDown = down; this.navLeft = left; this.navRight = right;
  },

  endFrame() {
    this.pressed.clear(); this.navKeys.clear();
    this.mouse.clicked = false; this.mouse.released = false; this.mouse.moved = false;
  },
};

function usingPad() { return !!Input.pad && Input.device === 'pad'; }
function padNames() {
  const id = ((Input.pad && Input.pad.id) || '').toLowerCase();
  const ps = /054c|sony|dualshock|dualsense|playstation/.test(id);
  return ps
    ? { a: '✕', b: '○', start: 'Options', select: 'Create' }
    : { a: 'A', b: 'B', start: 'Start', select: 'Back' };
}
function shortId(id) {
  const s = String(id || '').replace(/\(.*$/, '').replace(/^[0-9a-f]{4}-[0-9a-f]{4}-/i, '').trim();
  return (s || 'Gamepad').slice(0, 32);
}

// ============================================================
// Game state
// ============================================================
let state = 'title', stateT = 0, time = 0;
let pausedFrom = 'play';
let mode = 'zen';                                  // 'zen' or 'moves'
let pace = PACES.includes(load('neonMatch.pace', 'normal')) ? load('neonMatch.pace', 'normal') : 'normal';
let best = Number(load('neonMatch.best', 0)) || 0;          // best Moves score
let zenBest = Number(load('neonMatch.zenBest', 0)) || 0;    // highest Zen score
let totalGems = Number(load('neonMatch.gems', 0)) || 0;     // gems matched, all time
Sfx.muted = load('neonMatch.muted', '0') === '1';
const toast = { text: '', t: 0 };
let resultInfo = null;

function showToast(text) { toast.text = text; toast.t = 2; }

let menuSel = 0;
const menuRects = [];
function setState(s) { state = s; stateT = 0; menuSel = 0; menuRects.length = 0; }
function pauseGame() { pausedFrom = state; setState('paused'); G.drag = null; Sfx.blip(); }
function resumeGame() { state = pausedFrom; Sfx.blip(); }
function toTitle() { saveProgress(); clearFx(); setState('title'); }
function toggleSound() {
  Sfx.toggle();
  save('neonMatch.muted', Sfx.muted ? 1 : 0);
  showToast(Sfx.muted ? 'Sound off' : 'Sound on');
}
function cyclePace(d) {
  pace = PACES[(PACES.indexOf(pace) + d + PACES.length) % PACES.length];
  save('neonMatch.pace', pace);
}

// ============================================================
// 2. Board logic: grid[r][c] holds a gem object (or null for a moment while clearing)
// ============================================================
let grid = [];
let gemSeq = 0;

function newGem(t, sp = NONE) {
  return { id: ++gemSeq, t, sp, ox: 0, oy: 0, fall: 0, fallT: 0, fallDur: 0, popping: false, pop: 0, popDelay: 0, burst: false, born: 0, land: 0 };
}
const randomType = () => (Math.random() * TYPES) | 0;
const gemAtK = k => grid[rowOf(k)][colOf(k)];
function colorAt(g, r, c) { const m = g[r][c]; return m && m.sp !== NOVA ? m.t : -1; }
const colorAtK = (g, k) => colorAt(g, rowOf(k), colOf(k));
function swapCells(g, a, b) {
  const ar = rowOf(a), ac = colOf(a), br = rowOf(b), bc = colOf(b);
  const t = g[ar][ac]; g[ar][ac] = g[br][bc]; g[br][bc] = t;
}

// Every straight line of 3 or more same-coloured gems
function findRuns(g) {
  const runs = [];
  for (let pass = 0; pass < 2; pass++) {
    const horiz = pass === 0;
    for (let a = 0; a < N; a++) {
      let b = 0;
      while (b < N) {
        const at = i => (horiz ? colorAt(g, a, i) : colorAt(g, i, a));
        const t = at(b);
        let e = b + 1;
        if (t >= 0) while (e < N && at(e) === t) e++;
        if (t >= 0 && e - b >= 3) {
          const cells = [];
          for (let i = b; i < e; i++) cells.push(horiz ? a * N + i : i * N + a);
          runs.push({ dir: horiz ? 'h' : 'v', t, cells });
        }
        b = e;
      }
    }
  }
  return runs;
}

// Joins runs that share a cell (L, T and + shapes) into groups and decides which special each group makes.
// `prefer` lists cells where a new special should appear if the group covers them (the swapped cells).
function findGroups(g, prefer) {
  const runs = findRuns(g);
  if (!runs.length) return [];
  const parent = runs.map((_, i) => i);
  const find = i => { while (parent[i] !== i) i = parent[i] = parent[parent[i]]; return i; };
  const owner = new Array(N * N).fill(-1);
  runs.forEach((run, i) => {
    for (const k of run.cells) {
      if (owner[k] >= 0) parent[find(i)] = find(owner[k]);
      else owner[k] = i;
    }
  });
  const byRoot = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    let gr = byRoot.get(root);
    if (!gr) { gr = { t: run.t, runs: [], set: new Set() }; byRoot.set(root, gr); }
    gr.runs.push(run);
    for (const k of run.cells) gr.set.add(k);
  });
  const groups = [];
  for (const gr of byRoot.values()) {
    let longest = gr.runs[0], hasH = false, hasV = false;
    for (const run of gr.runs) {
      if (run.cells.length > longest.cells.length) longest = run;
      if (run.dir === 'h') hasH = true; else hasV = true;
    }
    const len = longest.cells.length;
    let sp = NONE;
    if (len >= 5) sp = NOVA;
    else if (len === 4 || (hasH && hasV)) sp = longest.dir === 'h' ? LINE_H : LINE_V;
    let at = -1;
    if (sp !== NONE) {
      if (prefer) for (const k of prefer) if (gr.set.has(k)) { at = k; break; }
      if (at < 0 && hasH && hasV) { // the crossing cell of an L / T
        const seen = new Set();
        for (const run of gr.runs) for (const k of run.cells) { if (seen.has(k)) { at = k; break; } seen.add(k); }
      }
      if (at < 0) at = longest.cells[(len - 1) >> 1];
    }
    groups.push({ t: gr.t, cells: [...gr.set], runs: gr.runs, sp, at });
  }
  return groups;
}

// Would the gem at (r, c) be part of a line of 3?
function matchAt(g, r, c) {
  const t = colorAt(g, r, c);
  if (t < 0) return false;
  let n = 1;
  for (let i = c - 1; i >= 0 && colorAt(g, r, i) === t; i--) n++;
  for (let i = c + 1; i < N && colorAt(g, r, i) === t; i++) n++;
  if (n >= 3) return true;
  n = 1;
  for (let i = r - 1; i >= 0 && colorAt(g, i, c) === t; i--) n++;
  for (let i = r + 1; i < N && colorAt(g, i, c) === t; i++) n++;
  return n >= 3;
}

// Every swap that does something: [a, b] cell pairs
function findMoves(g) {
  const out = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      for (let d = 0; d < 2; d++) {
        const r2 = r + d, c2 = c + 1 - d;
        if (r2 >= N || c2 >= N) continue;
        const A = g[r][c], B = g[r2][c2];
        if (!A || !B) continue;
        const a = r * N + c, b = r2 * N + c2;
        if (A.sp === NOVA || B.sp === NOVA) { out.push([a, b]); continue; }
        if (A.t === B.t) continue;
        swapCells(g, a, b);
        const ok = matchAt(g, r, c) || matchAt(g, r2, c2);
        swapCells(g, a, b);
        if (ok) out.push([a, b]);
      }
    }
  }
  return out;
}

// A fresh board with no matches and a few moves to make
function genBoard() {
  for (let tries = 0; ; tries++) {
    const g = [];
    for (let r = 0; r < N; r++) {
      const row = [];
      g.push(row);
      for (let c = 0; c < N; c++) {
        let t, guard = 0;
        do { t = randomType(); } while (guard++ < 60 &&
          ((c >= 2 && row[c - 1].t === t && row[c - 2].t === t) || (r >= 2 && g[r - 1][c].t === t && g[r - 2][c].t === t)));
        row.push(newGem(t));
      }
    }
    if (!findGroups(g).length && findMoves(g).length >= (tries < 50 ? 3 : 1)) return g;
  }
}

function commonColor(g, skip) {
  const count = new Array(TYPES).fill(0);
  for (let k = 0; k < N * N; k++) { const t = colorAtK(g, k); if (t >= 0 && !skip.has(k)) count[t]++; }
  let bestT = -1, n = 0;
  for (let t = 0; t < TYPES; t++) if (count[t] > n) { n = count[t]; bestT = t; }
  return bestT;
}

// Grows the set of cells to clear by firing every special gem inside it (which can set off others).
// `delays` (cell -> seconds) makes blasts ripple outward. Returns the blasts to draw.
function expandClear(g, set, fired, delays) {
  const blasts = [], queue = [...set];
  for (let qi = 0; qi < queue.length; qi++) {
    const k = queue[qi], m = g[rowOf(k)][colOf(k)];
    if (!m || m.sp === NONE || fired.has(m.id)) continue;
    fired.add(m.id);
    const d0 = delays ? delays.get(k) || 0 : 0;
    const add = j => {
      if (set.has(j)) return;
      set.add(j); queue.push(j);
      if (delays) delays.set(j, d0 + CFG.anim.wave * cellDist(k, j));
    };
    const r = rowOf(k), c = colOf(k);
    if (m.sp === LINE_H) { for (let i = 0; i < N; i++) add(r * N + i); blasts.push({ kind: 'h', k, t: m.t }); }
    else if (m.sp === LINE_V) { for (let i = 0; i < N; i++) add(i * N + c); blasts.push({ kind: 'v', k, t: m.t }); }
    else if (m.sp === NOVA) { // caught in a blast: takes the most common colour with it
      const t = commonColor(g, set);
      if (t >= 0) for (let j = 0; j < N * N; j++) if (colorAtK(g, j) === t) add(j);
      blasts.push({ kind: 'nova', k, t });
    }
  }
  return blasts;
}

// Drops gems into the holes below them and fills each column from the top.
// Sets gem.fall (cells to fall). Returns how many new gems were added.
function collapse(g) {
  let added = 0;
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const m = g[r][c];
      if (!m) continue;
      m.fall = w - r;
      if (w !== r) { g[w][c] = m; g[r][c] = null; }
      w--;
    }
    const holes = w + 1;
    for (let r = w; r >= 0; r--) { const m = newGem(randomType()); m.fall = holes; g[r][c] = m; added++; }
  }
  return added;
}

// Rearranges the gems (specials too) so there are moves and no ready-made matches.
function reshuffle(g) {
  const gems = [];
  for (const row of g) for (const m of row) gems.push(m);
  for (let tries = 0; tries < 300; tries++) {
    for (let i = gems.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = gems[i]; gems[i] = gems[j]; gems[j] = t; }
    for (let k = 0; k < N * N; k++) g[rowOf(k)][colOf(k)] = gems[k];
    if (!findGroups(g).length && findMoves(g).length) return true;
  }
  const fresh = genBoard();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) g[r][c] = fresh[r][c];
  return false;
}

// ============================================================
// 3. Play: swaps, clears, falls and the two modes
// ============================================================
const G = {
  score: 0, shown: 0, moves: 0, movesLeft: 0, level: 1, prevAt: 0, nextAt: 0,
  chain: 0, bestChain: 0, specials: 0, cleared: 0, shuffles: 0,
  phase: 'idle', phaseT: 0, a: -1, b: -1, clearSet: null, make: [],
  idleT: 0, hint: null, moveList: [], endT: 0, shuf: 1,
  cursor: 27, sel: -1, drag: null, tapAgain: false,
  banner: '', bannerSub: '', bannerColor: '#fff', bannerT: 0, bannerMax: 1,
  chainT: 0, chainShow: 0, chainWord: '', levelGlow: 0,
};

function startGame(m) {
  saveProgress();
  mode = m;
  Sfx.init();
  clearFx();
  grid = genBoard();
  Object.assign(G, {
    score: 0, shown: 0, moves: 0, movesLeft: CFG.moves, level: 1, prevAt: 0, nextAt: CFG.level.first,
    chain: 0, bestChain: 0, specials: 0, cleared: 0, shuffles: 0,
    phase: 'fall', phaseT: 0, a: -1, b: -1, clearSet: null, make: [],
    idleT: 0, hint: null, moveList: [], endT: 0, shuf: 1,
    cursor: 3 * N + 3, sel: -1, drag: null, tapAgain: false,
    bannerT: 0, chainT: 0, levelGlow: 0,
  });
  // Intro: the whole board drifts down into place, row by row
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const g = grid[r][c];
      g.fall = N; g.fallDur = CFG.anim.fallBase + CFG.anim.fallCell * N;
      g.fallT = -((N - 1 - r) * 0.045 + c * 0.012);
    }
  }
  setState('play');
}

function banner(title, sub, color, t = 2.4) {
  G.banner = title; G.bannerSub = sub; G.bannerColor = color; G.bannerT = G.bannerMax = t;
}
const boardTint = () => (mode === 'zen' ? LEVEL_TINTS[(G.level - 1) % LEVEL_TINTS.length] : CFG.color.title);

function trySwap(a, b) {
  if (G.phase !== 'idle' || (mode === 'moves' && G.movesLeft <= 0) || !adjacent(a, b)) return false;
  G.a = a; G.b = b; G.phase = 'swap'; G.phaseT = 0;
  G.sel = -1; G.drag = null; G.tapAgain = false; G.hint = null; G.idleT = 0;
  Sfx.swap();
  return true;
}

function setSwapOffsets(e) {
  const A = gemAtK(G.a), B = gemAtK(G.b);
  const dc = colOf(G.b) - colOf(G.a), dr = rowOf(G.b) - rowOf(G.a);
  A.ox = dc * e; A.oy = dr * e; B.ox = -dc * e; B.oy = -dr * e;
}

function useMove() { G.moves++; if (mode === 'moves') G.movesLeft--; }

function finishSwap() {
  setSwapOffsets(0);
  const a = G.a, b = G.b;
  swapCells(grid, a, b);
  const moved = gemAtK(b), other = gemAtK(a);   // `moved` is the gem the player picked up
  if (moved.sp === NOVA || other.sp === NOVA) {
    // Nova: clears every gem of its partner's colour (two novas clear the whole board)
    useMove();
    const set = new Set(), fired = new Set(), delays = new Map(), blasts = [];
    const novaK = moved.sp === NOVA ? b : a, partnerK = novaK === b ? a : b;
    const partner = gemAtK(partnerK);
    fired.add(gemAtK(novaK).id); set.add(novaK); delays.set(novaK, 0);
    if (partner.sp === NOVA) {
      fired.add(partner.id);
      for (let k = 0; k < N * N; k++) { set.add(k); delays.set(k, CFG.anim.wave * cellDist(novaK, k)); }
      blasts.push({ kind: 'nova', k: novaK, t: -1 });
    } else {
      for (let k = 0; k < N * N; k++) {
        if (colorAtK(grid, k) === partner.t) { set.add(k); delays.set(k, CFG.anim.wave * cellDist(novaK, k)); }
      }
      blasts.push({ kind: 'nova', k: novaK, t: partner.t });
    }
    G.chain = 1;
    blasts.push(...expandClear(grid, set, fired, delays));
    startClear(set, [], blasts, delays);
    return;
  }
  const groups = findGroups(grid, [b, a]);
  if (groups.length) { useMove(); G.chain = 1; resolveGroups(groups); return; }
  swapCells(grid, a, b);   // no match: the gems drift back home
  G.phase = 'back'; G.phaseT = 0;
  Sfx.nope();
}

function resolveGroups(groups) {
  const set = new Set(), fired = new Set(), delays = new Map(), make = [];
  for (const gr of groups) {
    for (const k of gr.cells) { set.add(k); delays.set(k, 0); }
    if (gr.sp !== NONE) make.push({ k: gr.at, t: gr.sp === NOVA ? NOVA_T : gr.t, sp: gr.sp });
  }
  const blasts = expandClear(grid, set, fired, delays);
  startClear(set, make, blasts, delays);
}

function startClear(set, make, blasts, delays) {
  let sx = 0, sy = 0, col = '#ffffff';
  for (const k of set) {
    const m = gemAtK(k);
    m.popping = true; m.pop = 0; m.burst = false; m.popDelay = delays.get(k) || 0; m.ox = m.oy = 0;
    sx += cellX(k); sy += cellY(k);
    if (m.sp !== NOVA) col = GEMS[m.t].color;
  }
  const n = set.size, pts = n * CFG.points * G.chain;
  addScore(pts);
  G.cleared += n; totalGems += n;
  floater('+' + fmt(pts), sx / n, sy / n, col, G.chain > 1 ? 24 : 20);
  for (const b of blasts) {
    if (b.kind === 'nova') { ring(cellX(b.k), cellY(b.k), 10, BW * 0.85, 1.0, b.t >= 0 ? GEMS[b.t].color : '#ffffff', 3); Sfx.nova(); }
    else { beam(b.kind, b.k, GEMS[b.t].color); Sfx.line(); }
  }
  if (make.length) { G.specials += make.length; Sfx.make(); }
  Sfx.pop(G.chain);
  if (G.chain > G.bestChain) G.bestChain = G.chain;
  if (G.chain >= 2) { G.chainT = 1.8; G.chainShow = G.chain; G.chainWord = CHAIN_WORDS[Math.min(G.chain, CHAIN_WORDS.length - 1)]; }
  G.clearSet = set; G.make = make;
  G.phase = 'clear'; G.phaseT = 0;
}

function addScore(pts) {
  G.score += pts;
  if (mode !== 'zen') return;
  if (G.score > zenBest) zenBest = G.score;
  while (G.score >= G.nextAt) {
    G.level++;
    G.prevAt = G.nextAt;
    G.nextAt += CFG.level.first + CFG.level.grow * (G.level - 1);
    banner(`Level ${G.level}`, LEVEL_WORDS[(G.level - 2) % LEVEL_WORDS.length], boardTint());
    G.levelGlow = 1;
    Sfx.levelUp();
  }
}

function finishClear() {
  for (const k of G.clearSet) grid[rowOf(k)][colOf(k)] = null;
  for (const mk of G.make) {
    const m = newGem(mk.t, mk.sp);
    m.born = 1;
    grid[rowOf(mk.k)][colOf(mk.k)] = m;
    ring(cellX(mk.k), cellY(mk.k), 6, CELL, 0.6, '#ffffff', 2);
  }
  G.clearSet = null; G.make = [];
  collapse(grid);
  const A = CFG.anim;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const m = grid[r][c];
      if (m.fall > 0) { m.fallT = -c * A.stagger; m.fallDur = A.fallBase + A.fallCell * m.fall; }
      else { m.fallT = 0; m.fallDur = 0; }
    }
  }
  G.phase = 'fall'; G.phaseT = 0;
}

// Called when every gem has landed: cascade, or wait for the player
function settle() {
  const groups = findGroups(grid, null);
  if (groups.length) { G.chain++; resolveGroups(groups); return; }
  G.chain = 0;
  saveProgress();
  G.phase = 'idle'; G.phaseT = 0; G.idleT = 0; G.hint = null; G.endT = 0;
  G.moveList = findMoves(grid);
  if (mode === 'moves' && G.movesLeft <= 0) return; // the round ends from the idle phase
  if (!G.moveList.length) startShuffle();
}

function startShuffle() {
  G.phase = 'shuffleOut'; G.phaseT = 0; G.shuffles++;
  G.sel = -1; G.drag = null;
  banner('No more moves', 'Shuffling the gems gently…', CFG.color.title, 2.2);
  Sfx.shuffle();
}

function finishMoves() {
  const isBest = G.score > best;
  if (isBest) { best = G.score; save('neonMatch.best', best); }
  resultInfo = { score: G.score, best, isBest, bestChain: G.bestChain, specials: G.specials, cleared: G.cleared };
  saveProgress();
  setState('result');
  Sfx.finish();
}

function saveProgress() {
  save('neonMatch.zenBest', zenBest);
  save('neonMatch.gems', totalGems);
}

// Animation and flow for the board. `dt` is real time; animations scale with the Pace setting.
function stepBoard(dt) {
  const A = CFG.anim, adt = dt * PACE_MUL[pace];
  G.phaseT += adt;
  for (const row of grid) {
    for (const m of row) {
      if (!m) continue;
      if (m.born > 0) m.born = Math.max(0, m.born - adt / A.born);
      if (m.land > 0) m.land = Math.max(0, m.land - adt / 0.16);
    }
  }
  switch (G.phase) {
    case 'swap':
      setSwapOffsets(ease(Math.min(1, G.phaseT / A.swap)));
      if (G.phaseT >= A.swap) finishSwap();
      break;
    case 'back': { // a short rest on the neighbour's spot, then softly home
      const p = G.phaseT / A.back;
      setSwapOffsets(p < 0.2 ? 1 : 1 - ease(Math.min(1, (p - 0.2) / 0.8)));
      if (p >= 1) { setSwapOffsets(0); G.phase = 'idle'; G.phaseT = 0; }
      break;
    }
    case 'clear': {
      let done = true;
      for (const k of G.clearSet) {
        const m = gemAtK(k);
        m.pop = (G.phaseT - m.popDelay) / A.pop;
        if (m.pop >= 0 && !m.burst) { m.burst = true; popFx(m, k); }
        if (m.pop < 1) done = false;
      }
      if (done) finishClear();
      break;
    }
    case 'fall': {
      let busy = false;
      for (const row of grid) {
        for (const m of row) {
          if (m.fall <= 0) continue;
          m.fallT += adt;
          if (m.fallT >= m.fallDur) { m.fall = 0; m.land = 1; } else busy = true;
        }
      }
      if (!busy) settle();
      break;
    }
    case 'shuffleOut':
      G.shuf = 1 - ease(Math.min(1, G.phaseT / A.shuffle));
      if (G.phaseT >= A.shuffle) { reshuffle(grid); G.phase = 'shuffleIn'; G.phaseT = 0; }
      break;
    case 'shuffleIn':
      G.shuf = ease(Math.min(1, G.phaseT / A.shuffle));
      if (G.phaseT >= A.shuffle) { G.shuf = 1; settle(); }
      break;
    case 'idle':
      if (mode === 'moves' && G.movesLeft <= 0) { G.endT += dt; if (G.endT > 0.8) finishMoves(); break; }
      G.idleT += dt;
      if (!G.hint && G.idleT > CFG.hintDelay && G.moveList.length) G.hint = G.moveList[(Math.random() * G.moveList.length) | 0];
      break;
  }
}

const SOUND_BTN = { x: W - 112, y: 14, w: 44, h: 44 };
const PAUSE_BTN = { x: W - 60, y: 14, w: 44, h: 44 };

// Cursor (keyboard / controller), click-click, and drag / swipe
function boardInput() {
  const I = Input, m = I.mouse;
  if (m.clicked && inRect(m, PAUSE_BTN)) { pauseGame(); return; }
  if (m.clicked && inRect(m, SOUND_BTN)) { toggleSound(); return; }
  const ready = G.phase === 'idle' && !(mode === 'moves' && G.movesLeft <= 0);
  let acted = false;

  const dr = I.navUp ? -1 : I.navDown ? 1 : 0, dc = dr ? 0 : I.navLeft ? -1 : I.navRight ? 1 : 0;
  if (dr || dc) {
    acted = true;
    if (G.sel >= 0) { // holding a gem: a direction swaps it
      const r = rowOf(G.sel) + dr, c = colOf(G.sel) + dc;
      if (r < 0 || r >= N || c < 0 || c >= N) Sfx.tick();
      else if (ready) trySwap(G.sel, r * N + c);
    } else {
      const r = clamp(rowOf(G.cursor) + dr, 0, N - 1), c = clamp(colOf(G.cursor) + dc, 0, N - 1);
      if (r * N + c !== G.cursor) { G.cursor = r * N + c; Sfx.tick(); }
    }
  }
  if (I.act) {
    acted = true;
    if (G.sel === G.cursor) { G.sel = -1; Sfx.drop(); } else { G.sel = G.cursor; Sfx.grab(); }
  }
  if (I.back && G.sel >= 0) { acted = true; G.sel = -1; G.drag = null; Sfx.drop(); }

  if (m.clicked) {
    acted = true;
    const k = cellAt(m.x, m.y);
    if (k < 0) { G.sel = -1; G.drag = null; }
    else {
      G.cursor = k;
      if (G.sel >= 0 && G.sel !== k && adjacent(G.sel, k) && ready) trySwap(G.sel, k);
      else {
        G.tapAgain = G.sel === k;
        if (!G.tapAgain) Sfx.grab();
        G.sel = k; G.drag = { k, x: m.x, y: m.y };
      }
    }
  }
  if (G.drag && m.down && ready) {
    const dx = m.x - G.drag.x, dy = m.y - G.drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > CELL * 0.35) {
      const k = G.drag.k, horiz = Math.abs(dx) > Math.abs(dy);
      const r = rowOf(k) + (horiz ? 0 : Math.sign(dy)), c = colOf(k) + (horiz ? Math.sign(dx) : 0);
      G.drag = null; G.tapAgain = false; acted = true;
      if (r >= 0 && r < N && c >= 0 && c < N) trySwap(k, r * N + c);
      else G.sel = -1;
    }
  }
  if (m.released) {
    if (G.drag && G.tapAgain) { G.sel = -1; Sfx.drop(); }
    G.drag = null; G.tapAgain = false;
  }
  if (acted) { G.idleT = 0; G.hint = null; }
}

function updatePlay(dt) {
  boardInput();
  if (state !== 'play') return; // paused from the on-screen button
  stepBoard(dt);
  G.shown += (G.score - G.shown) * Math.min(1, dt * 8);
  if (Math.abs(G.score - G.shown) < 1) G.shown = G.score;
  if (G.bannerT > 0) G.bannerT = Math.max(0, G.bannerT - dt);
  if (G.chainT > 0) G.chainT = Math.max(0, G.chainT - dt);
  if (G.levelGlow > 0) G.levelGlow = Math.max(0, G.levelGlow - dt * 0.6);
}

// ============================================================
// Effects
// ============================================================
const parts = new Pool(LOW_RES ? 160 : 360, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, ci: 0, size: 6 }));
const rings = new Pool(48, () => ({ x: 0, y: 0, r0: 0, r1: 0, life: 0, max: 1, color: '#fff', w: 2 }));
const beams = new Pool(24, () => ({ kind: 'h', x: 0, y: 0, life: 0, max: 1, color: '#fff' }));
const floaters = new Pool(24, () => ({ x: 0, y: 0, text: '', color: '#fff', life: 0, max: 1, size: 20 }));
const motes = [];
for (let i = 0; i < (LOW_RES ? 10 : 26); i++) {
  motes.push({ x: Math.random() * W, y: Math.random() * H, vx: rand(-6, 6), vy: rand(-12, -4), s: rand(6, 16), ph: Math.random() * TAU, ci: i % TYPES });
}

function burst(x, y, ci, n, speed, life = 0.7, size = 7) {
  for (let i = 0; i < n; i++) {
    const p = parts.get();
    if (!p) return;
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.max = p.life = life * (0.5 + Math.random() * 0.5);
    p.ci = ci; p.size = size * (0.6 + Math.random() * 0.8);
  }
}
function ring(x, y, r0, r1, life, color, w = 2) {
  const o = rings.get();
  if (!o) return;
  o.x = x; o.y = y; o.r0 = r0; o.r1 = r1; o.life = o.max = life; o.color = color; o.w = w;
}
function beam(kind, k, color) {
  const o = beams.get();
  if (!o) return;
  o.kind = kind; o.x = cellX(k); o.y = cellY(k); o.life = o.max = 0.6; o.color = color;
}
function floater(text, x, y, color, size = 20) {
  const o = floaters.get();
  if (!o) return;
  o.text = text; o.x = x; o.y = y; o.color = color; o.size = size; o.life = o.max = 1.1;
}
function popFx(m, k) {
  const ci = m.sp === NOVA ? TYPES : m.t;
  burst(cellX(k), cellY(k), ci, LOW_RES ? 4 : 8, 150, 0.7, 7);
  ring(cellX(k), cellY(k), 8, CELL * 0.6, 0.35, m.sp === NOVA ? '#ffffff' : GEMS[m.t].color, 1.5);
  if (m.popDelay > 0) Sfx.tink();
}
function clearFx() { parts.clear(); rings.clear(); beams.clear(); floaters.clear(); }

function updateFx(dt) {
  const drag = Math.pow(0.08, dt);
  for (const p of parts.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.vx *= drag; p.vy = p.vy * drag + 40 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (const pool of [rings, beams, floaters]) {
    for (const o of pool.items) {
      if (!o.active) continue;
      o.life -= dt;
      if (o.life <= 0) o.active = false;
    }
  }
  for (const f of floaters.items) if (f.active) f.y -= 28 * dt;
  for (const m of motes) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; }
    if (m.x < -20) m.x = W + 20; else if (m.x > W + 20) m.x = -20;
  }
}

// ============================================================
// Menus
// ============================================================
function soundItem() {
  return { id: 'sound', label: 'Sound', value: Sfx.muted ? 'Off' : 'On', cycle: () => toggleSound(), hint: 'Soft chimes on or off.' };
}
function titleItems() {
  return [
    { id: 'zen', label: 'Zen', hint: totalGems > 0 ? `Endless and unhurried. ${fmt(totalGems)} gems matched so far.` : 'Endless and unhurried: no move limit, nothing to lose.' },
    { id: 'moves', label: 'Moves', hint: `${CFG.moves} moves to make your best score.` },
    { id: 'pace', label: 'Pace', value: PACE_LABEL[pace], cycle: d => cyclePace(d), hint: 'How quickly gems swap, pop and fall.' },
    soundItem(),
    { id: 'howto', label: 'How to Play', hint: 'Controls, special gems and tips.' },
    { id: 'games', label: 'All Games', hint: 'Back to the game picker.' },
  ];
}
function pauseItems() {
  return [{ id: 'resume', label: 'Resume' }, { id: 'new', label: 'New board' }, soundItem(), { id: 'quit', label: 'Quit to menu' }];
}
function resultItems() { return [{ id: 'again', label: 'Play again' }, { id: 'menu', label: 'Main menu' }]; }

function menuInput(items) {
  const I = Input, m = I.mouse, n = items.length;
  if (menuSel >= n) menuSel = 0;
  if (I.navUp) { menuSel = (menuSel + n - 1) % n; Sfx.tick(); }
  if (I.navDown) { menuSel = (menuSel + 1) % n; Sfx.tick(); }
  if (m.moved || m.clicked) {
    for (let i = 0; i < n; i++) {
      const r = menuRects[i];
      if (r && inRect(m, r) && menuSel !== i) { menuSel = i; if (!m.clicked) Sfx.tick(); }
    }
  }
  const it = items[menuSel], r = menuRects[menuSel];
  const clickedItem = m.clicked && r && inRect(m, r);
  if (it.value !== undefined) {
    const d = (I.navRight ? 1 : 0) - (I.navLeft ? 1 : 0) || (I.select || clickedItem ? 1 : 0);
    if (d) { it.cycle(d); Sfx.tick(); return null; }
  }
  if (I.select || clickedItem) { Sfx.select(); return it.id; }
  return null;
}

// ============================================================
// Main update
// ============================================================
function update(dt) {
  time += dt; stateT += dt;
  if (toast.t > 0) toast.t -= dt;
  if (Input.mute) toggleSound();
  updateFx(dt);

  switch (state) {
    case 'title': {
      const id = menuInput(titleItems());
      if (id === 'zen' || id === 'moves') startGame(id);
      else if (id === 'howto') setState('howto');
      else if (id === 'games') location.href = '../index.html';
      break;
    }
    case 'howto':
      if (Input.back || Input.select || Input.mouse.clicked) { setState('title'); menuSel = 4; Sfx.blip(); }
      break;
    case 'play':
      // Esc puts down a held gem first; a second Esc pauses
      if (Input.pause && !(Input.back && G.sel >= 0)) { pauseGame(); break; }
      updatePlay(dt);
      break;
    case 'paused': {
      if (Input.pause || Input.back) { resumeGame(); break; }
      const id = menuInput(pauseItems());
      if (id === 'resume') resumeGame();
      else if (id === 'new') startGame(mode);
      else if (id === 'quit') toTitle();
      break;
    }
    case 'result':
      if (stateT > 0.8) {
        const id = menuInput(resultItems());
        if (id === 'again') startGame(mode);
        else if (id === 'menu' || Input.back) toTitle();
      }
      break;
  }
}

// ============================================================
// Rendering
// ============================================================
function rrPath(x, y, w, h, r) { rr(ctx, x, y, w, h, r); }
function glowStroke(color, w) {
  const a = ctx.globalAlpha;
  ctx.strokeStyle = color;
  ctx.globalAlpha = a * 0.22; ctx.lineWidth = w * 3.5; ctx.stroke();
  ctx.globalAlpha = a; ctx.lineWidth = w; ctx.stroke();
}
function text(s, x, y, font, color) { ctx.font = font; ctx.fillStyle = color; ctx.fillText(s, x, y); }
function glowText(s, x, y, font, color) {
  const a = ctx.globalAlpha;
  ctx.font = font; ctx.lineJoin = 'round';
  ctx.globalAlpha = a * 0.22; ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.strokeText(s, x, y);
  ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function overlay(alpha) { ctx.fillStyle = `rgba(3,5,10,${alpha})`; ctx.fillRect(0, 0, W, H); }

function drawMotes() {
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    ctx.globalAlpha = 0.13 + 0.1 * Math.sin(time * 0.9 + m.ph);
    ctx.drawImage(dotSprites[m.ci], m.x - m.s / 2, m.y - m.s / 2, m.s, m.s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function fallOffset(m) {
  if (m.fall <= 0) return 0;
  return -m.fall * (1 - ease(clamp(m.fallT / m.fallDur, 0, 1)));
}

function drawGem(m, k, scale, nx, ny) {
  const x = BX + (colOf(k) + m.ox + nx + 0.5) * CELL;
  let y = BY + (rowOf(k) + m.oy + ny + fallOffset(m) + 0.5) * CELL;
  let s = scale, a = 1;
  const p = m.popping ? clamp(m.pop, 0, 1) : 0;
  if (p > 0) { s *= p < 0.3 ? 1 + 0.25 * (p / 0.3) : 1.25 * (1 - (p - 0.3) / 0.7); a = 1 - p * p; }
  if (m.born > 0) s *= 0.3 + 0.7 * backOut(1 - m.born);
  if (s <= 0.02 || a <= 0.01) return;
  const sq = m.land > 0 ? Math.sin(m.land * Math.PI) * 0.08 : 0; // a little squash on landing
  const w = SPR * s * (1 + sq), h = SPR * s * (1 - sq);
  y += (SPR * s - h) * 0.3;
  ctx.globalAlpha = a;
  if (m.sp === NOVA) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(time * 0.7);
    ctx.drawImage(novaSprite, -w / 2, -h / 2, w, h);
    ctx.restore();
  } else ctx.drawImage(gemSprites[m.t * 3 + m.sp], x - w / 2, y - h / 2, w, h);
  if (p > 0 && p < 0.6) { // a soft white flash as it pops
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - p / 0.6) * 0.6;
    const d = CELL * (0.8 + p);
    ctx.drawImage(dotSprites[TYPES], x - d / 2, y - d / 2, d, d);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}

function renderBoard() {
  ctx.drawImage(boardCanvas, BX - 20, BY - 20, BW + 40, BW + 40);
  const tint = boardTint();
  rrPath(BX - 10, BY - 10, BW + 20, BW + 20, 16);
  ctx.globalAlpha = 0.45 + 0.12 * Math.sin(time * 0.8) + G.levelGlow * 0.4;
  glowStroke(tint, 1.5 + G.levelGlow * 1.5);
  ctx.globalAlpha = 1;

  // Hint: both gems of a good swap glow softly and lean toward each other
  const hint = G.phase === 'idle' ? G.hint : null;
  let hx = 0, hy = 0;
  if (hint) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 3), d = CELL * 1.5;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.18 + 0.22 * pulse;
    for (const k of hint) ctx.drawImage(dotSprites[TYPES], cellX(k) - d / 2, cellY(k) - d / 2, d, d);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const lean = Math.max(0, Math.sin(time * 4)) * 0.08;
    hx = (colOf(hint[1]) - colOf(hint[0])) * lean; hy = (rowOf(hint[1]) - rowOf(hint[0])) * lean;
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(BX - 8, BY - 6, BW + 16, BW + 14); ctx.clip();
  const moving = G.phase === 'swap' || G.phase === 'back';
  const selPulse = 1.08 + 0.03 * Math.sin(time * 5);
  for (let k = 0; k < N * N; k++) {
    const m = gemAtK(k);
    if (!m || (moving && (k === G.a || k === G.b))) continue;
    let nx = 0, ny = 0;
    if (hint) { if (k === hint[0]) { nx = hx; ny = hy; } else if (k === hint[1]) { nx = -hx; ny = -hy; } }
    drawGem(m, k, (k === G.sel ? selPulse : 1) * G.shuf, nx, ny);
  }
  if (moving) { // the gem the player moved is drawn on top
    drawGem(gemAtK(G.b), G.b, 1, 0, 0);
    drawGem(gemAtK(G.a), G.a, 1.06, 0, 0);
  }
  ctx.restore();
}

function cellPath(k, inset) {
  rrPath(BX + colOf(k) * CELL + inset, BY + rowOf(k) * CELL + inset, CELL - inset * 2, CELL - inset * 2, 12);
}

function renderMarks() {
  const dev = Input.device, keyish = dev === 'kb' || dev === 'pad';
  if (dev === 'mouse' && G.phase === 'idle' && G.sel < 0 && !Input.mouse.down) {
    const k = cellAt(Input.mouse.x, Input.mouse.y);
    if (k >= 0) { cellPath(k, 3); ctx.globalAlpha = 0.3; glowStroke('#ffffff', 1.2); ctx.globalAlpha = 1; }
  }
  if (G.sel >= 0) {
    cellPath(G.sel, 2);
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(time * 5);
    glowStroke(CFG.color.warn, 2);
    if (keyish) { // small arrows show where it can go
      const cx = cellX(G.sel), cy = cellY(G.sel), r = rowOf(G.sel), c = colOf(G.sel);
      ctx.fillStyle = CFG.color.warn;
      for (const [dx, dy, ok] of [[0, -1, r > 0], [0, 1, r < N - 1], [-1, 0, c > 0], [1, 0, c < N - 1]]) {
        if (!ok) continue;
        const tx = cx + dx * (CELL / 2 + 1), ty = cy + dy * (CELL / 2 + 1);
        ctx.beginPath();
        ctx.moveTo(tx + dx * 7, ty + dy * 7);
        ctx.lineTo(tx - dy * 6, ty + dx * 6);
        ctx.lineTo(tx + dy * 6, ty - dx * 6);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  if (keyish && G.sel !== G.cursor) {
    cellPath(G.cursor, 1);
    ctx.globalAlpha = 0.65 + 0.3 * Math.sin(time * 4);
    glowStroke('#ffffff', 2);
    ctx.globalAlpha = 1;
  }
}

function drawFx() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of beams.items) {
    if (!b.active) continue;
    const a = b.life / b.max, th = CELL * 0.8 * a;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = a * 0.25;
    if (b.kind === 'h') ctx.fillRect(BX, b.y - th / 2, BW, th); else ctx.fillRect(b.x - th / 2, BY, th, BW);
    ctx.globalAlpha = a * 0.9; ctx.fillStyle = '#ffffff';
    if (b.kind === 'h') ctx.fillRect(BX, b.y - 1.5, BW, 3); else ctx.fillRect(b.x - 1.5, BY, 3, BW);
  }
  for (const o of rings.items) {
    if (!o.active) continue;
    const p = 1 - o.life / o.max;
    ctx.globalAlpha = (1 - p) * 0.85;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r0 + (o.r1 - o.r0) * easeOut(p), 0, TAU);
    glowStroke(o.color, o.w);
  }
  for (const p of parts.items) {
    if (!p.active) continue;
    ctx.globalAlpha = p.life / p.max;
    ctx.drawImage(dotSprites[p.ci], p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawFloaters() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters.items) {
    if (!f.active) continue;
    const a = Math.min(1, (f.life / f.max) * 2.5);
    ctx.font = `800 ${f.size}px ${SANS}`; ctx.lineJoin = 'round';
    ctx.globalAlpha = a * 0.8; ctx.strokeStyle = '#05070f'; ctx.lineWidth = 6; ctx.strokeText(f.text, f.x, f.y); // dark edge so it reads over bright gems
    ctx.globalAlpha = a;
    glowText(f.text, f.x, f.y, `800 ${f.size}px ${SANS}`, f.color);
  }
  ctx.globalAlpha = 1;
}

function drawButton(r, icon) {
  const hover = Input.device === 'mouse' && inRect(Input.mouse, r);
  rrPath(r.x, r.y, r.w, r.h, 12);
  ctx.fillStyle = hover ? 'rgba(143,216,255,0.16)' : 'rgba(20,26,52,0.6)'; ctx.fill();
  ctx.globalAlpha = hover ? 1 : 0.55; glowStroke(CFG.color.title, 1.2); ctx.globalAlpha = 1;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.fillStyle = CFG.color.text; ctx.strokeStyle = CFG.color.text;
  if (icon === 'pause') { ctx.fillRect(cx - 7, cy - 9, 5, 18); ctx.fillRect(cx + 2, cy - 9, 5, 18); return; }
  ctx.beginPath(); // speaker
  ctx.moveTo(cx - 11, cy - 4); ctx.lineTo(cx - 6, cy - 4); ctx.lineTo(cx, cy - 10);
  ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 6, cy + 4); ctx.lineTo(cx - 11, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
  if (Sfx.muted) { ctx.moveTo(cx + 4, cy - 5); ctx.lineTo(cx + 12, cy + 5); ctx.moveTo(cx + 12, cy - 5); ctx.lineTo(cx + 4, cy + 5); ctx.stroke(); }
  else { ctx.arc(cx + 2, cy, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 2, cy, 11, -0.9, 0.9); ctx.stroke(); }
  ctx.lineCap = 'butt';
}

function controlLines() {
  const NN = padNames();
  switch (Input.device) {
    case 'pad': return [`D-pad: move  ·  ${NN.a}: pick up`, 'then push a direction to swap', `${NN.b}: put down  ·  ${NN.start}: pause`];
    case 'mouse': return ['Drag a gem onto a neighbour,', 'or click one, then the other', 'Esc or the ‖ button: pause'];
    case 'touch': return ['Swipe a gem toward a neighbour,', 'or tap one, then the other', '‖ button (top right): pause'];
    default: return ['Arrows: move  ·  Space: pick up', 'then an arrow to swap', 'Esc: put down, or pause'];
  }
}

function drawHUD() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const LX = BX / 2, RX = W - BX / 2, tint = boardTint(), C = CFG.color;
  // Left: mode, score, level or moves, best
  glowText(mode === 'zen' ? 'ZEN' : 'MOVES', LX, 72, `800 26px ${SANS}`, tint);
  text(mode === 'zen' ? 'endless  ·  no pressure' : `${CFG.moves} moves  ·  best score`, LX, 100, `500 12px ${SANS}`, C.dim);
  text('SCORE', LX, 146, `800 11px ${SANS}`, C.faint);
  text(fmt(G.shown), LX, 176, `800 34px ${MONO}`, C.text);
  if (mode === 'zen') {
    text('LEVEL', LX, 236, `800 11px ${SANS}`, C.faint);
    text(String(G.level), LX, 266, `800 30px ${SANS}`, tint);
    const p = clamp((G.score - G.prevAt) / (G.nextAt - G.prevAt), 0, 1);
    rrPath(LX - 80, 292, 160, 8, 4); ctx.fillStyle = 'rgba(131,144,189,0.18)'; ctx.fill();
    if (p > 0.03) { rrPath(LX - 80, 292, 160 * p, 8, 4); ctx.fillStyle = tint; ctx.fill(); }
    text(`next level at ${fmt(G.nextAt)}`, LX, 318, `500 12px ${SANS}`, C.dim);
    text('BEST', LX, 376, `800 11px ${SANS}`, C.faint);
    text(fmt(zenBest), LX, 400, `700 18px ${MONO}`, C.dim);
  } else {
    text('MOVES LEFT', LX, 236, `800 11px ${SANS}`, C.faint);
    text(String(G.movesLeft), LX, 272, `800 42px ${SANS}`, G.movesLeft <= 5 ? C.warn : C.text);
    for (let i = 0; i < CFG.moves; i++) { // one soft dot per move
      ctx.beginPath(); ctx.arc(LX - 67.5 + (i % 10) * 15, 310 + Math.floor(i / 10) * 15, 4, 0, TAU);
      ctx.fillStyle = i < G.movesLeft ? tint : 'rgba(131,144,189,0.18)'; ctx.fill();
    }
    text('BEST', LX, 376, `800 11px ${SANS}`, C.faint);
    text(fmt(Math.max(best, G.score)), LX, 400, `700 18px ${MONO}`, C.dim);
  }
  // Right: buttons, cascade words, special-gem key, controls
  drawButton(SOUND_BTN, 'sound');
  drawButton(PAUSE_BTN, 'pause');
  if (G.chainT > 0) {
    ctx.globalAlpha = Math.min(1, G.chainT * 2);
    const rise = (1.8 - G.chainT) * 6;
    glowText(G.chainWord, RX, 160 - rise, `800 30px ${SANS}`, C.warn);
    text(`chain ×${G.chainShow}`, RX, 196 - rise, `600 14px ${SANS}`, C.dim);
    ctx.globalAlpha = 1;
  }
  text('SPECIAL GEMS', RX, 258, `800 11px ${SANS}`, C.faint);
  ctx.drawImage(gemSprites[LINE_H], RX - 122, 278, 44, 44);
  ctx.save(); ctx.translate(RX - 100, 356); ctx.rotate(time * 0.7); ctx.drawImage(novaSprite, -22, -22, 44, 44); ctx.restore();
  ctx.textAlign = 'left';
  text('Line: clears its', RX - 70, 291, `600 13px ${SANS}`, C.text);
  text('row or column', RX - 70, 309, `500 13px ${SANS}`, C.dim);
  text('Nova: swap it to', RX - 70, 347, `600 13px ${SANS}`, C.text);
  text('clear one colour', RX - 70, 365, `500 13px ${SANS}`, C.dim);
  ctx.textAlign = 'center';
  controlLines().forEach((s, i) => text(s, RX, 440 + i * 19, `500 12px ${SANS}`, i === 0 ? C.dim : C.faint));
}

function drawBanner() {
  if (G.bannerT <= 0) return;
  const a = Math.min(1, G.bannerT * 2, (G.bannerMax - G.bannerT) * 5);
  ctx.globalAlpha = a;
  rrPath(W / 2 - 180, H / 2 - 46, 360, 92, 20);
  ctx.fillStyle = 'rgba(6,9,22,0.85)'; ctx.fill();
  glowStroke(G.bannerColor, 1.5);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText(G.banner, W / 2, H / 2 - 12, `800 30px ${SANS}`, G.bannerColor);
  text(G.bannerSub, W / 2, H / 2 + 22, `500 14px ${SANS}`, CFG.color.dim);
  ctx.globalAlpha = 1;
}

function renderPlay() {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawMotes();
  renderBoard();
  drawFx();
  if (state === 'play') renderMarks();
  drawHUD();
  drawFloaters();
  drawBanner();
}

function drawMenu(items, y0, enabled = true, gap = 52) {
  menuRects.length = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = 330, h = 40;
  items.forEach((it, i) => {
    const y = y0 + i * gap, x = W / 2 - w / 2, sel = enabled && i === menuSel;
    menuRects.push({ x, y: y - h / 2, w, h });
    if (sel) {
      rrPath(x, y - h / 2, w, h, h / 2);
      ctx.fillStyle = 'rgba(143,216,255,0.10)'; ctx.fill();
      glowStroke(CFG.color.title, 1.5);
    }
    ctx.globalAlpha = enabled ? 1 : 0.4;
    const col = sel ? CFG.color.text : CFG.color.dim;
    if (it.value !== undefined) {
      text(it.label, W / 2 - 44, y, `700 20px ${SANS}`, col);
      text(sel ? `‹ ${it.value} ›` : it.value, W / 2 + 100, y, `700 15px ${SANS}`, sel ? CFG.color.warn : CFG.color.faint);
    } else {
      text(it.label, W / 2, y, `700 20px ${SANS}`, col);
    }
    ctx.globalAlpha = 1;
  });
}

function drawTitle() {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawMotes();
  // Big gems drifting slowly behind the menu
  for (let i = 0; i < 10; i++) {
    const x = ((i * 131 + time * (9 + (i % 3) * 5)) % (W + 160)) - 80;
    const y = 60 + ((i * 197) % 420) + Math.sin(time * 0.6 + i) * 16;
    const s = 64 + (i % 3) * 14;
    ctx.globalAlpha = 0.16 + (i % 3) * 0.05;
    if (i === 7) ctx.drawImage(novaSprite, x - s / 2, y - s / 2, s, s);
    else ctx.drawImage(gemSprites[(i % TYPES) * 3], x - s / 2, y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  const shade = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 380);
  shade.addColorStop(0, 'rgba(5,7,15,0.82)'); shade.addColorStop(1, 'rgba(5,7,15,0)');
  ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('NEON MATCH', W / 2, 78, `800 64px ${SANS}`, CFG.color.title);
  text('a calm gem-matching game', W / 2, 122, `500 15px ${SANS}`, CFG.color.dim);
  const items = titleItems(), y0 = 176, gap = 44;
  drawMenu(items, y0, true, gap);
  const it = items[menuSel] || items[0], NN = padNames();
  text(it.hint, W / 2, y0 + items.length * gap + 2, `500 14px ${SANS}`, CFG.color.dim);
  const side = it.value !== undefined ? '   ·   ← → change' : '';
  const keys = Input.device === 'touch' ? 'Tap to choose'
    : Input.device === 'mouse' ? 'Click to choose'
    : usingPad() || Input.pad ? `↑ ↓ choose   ·   ${NN.a} select${side}` : `↑ ↓ choose   ·   Enter select${side}`;
  text(keys, W / 2, y0 + items.length * gap + 26, `500 12px ${SANS}`, CFG.color.faint);

  const yb = H - 26, pad = Input.pad;
  ctx.beginPath(); ctx.arc(30, yb, 4, 0, TAU); ctx.fillStyle = pad ? CFG.color.good : CFG.color.warn; ctx.fill();
  ctx.textAlign = 'left';
  text(!navigator.getGamepads ? 'Controllers unavailable here' : pad ? shortId(pad.id) : 'Connect a controller, press any button',
    42, yb, `600 12px ${SANS}`, CFG.color.dim);
  ctx.textAlign = 'center';
  text(`Developer: ${CREDITS.developer}  ·  Co-developer: ${CREDITS.coDeveloper}`, W / 2, yb, `500 12px ${SANS}`, CFG.color.dim);
  ctx.textAlign = 'right';
  text(`Best ${fmt(best)}  ·  Zen ${fmt(zenBest)}`, W - 24, yb, `600 12px ${MONO}`, CFG.color.dim);
  if (!Sfx.muted && (!Sfx.ctx || Sfx.ctx.state !== 'running')) {
    text(Input.device === 'touch' ? 'tap for sound' : 'click for sound', W - 24, 24, `500 11px ${SANS}`, CFG.color.faint);
  }
}

function drawHowTo() {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawMotes();
  overlay(0.45);
  const NN = padNames(), C = CFG.color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('HOW TO PLAY', W / 2, 40, `800 30px ${SANS}`, C.title);
  const rows = [
    ['Move the cursor', 'D-pad / left stick', 'Arrows / W A S D', '–'],
    ['Pick up a gem', NN.a, 'Space or Enter', 'Click or tap it'],
    ['Swap it', 'Push a direction', 'Press an arrow', 'Drag it, or tap a neighbour'],
    ['Put it down', NN.b, 'Esc', 'Tap it again'],
    ['Pause', NN.start, 'Esc or P', '‖ button, top right'],
    ['Sound on / off', NN.select, 'M', 'Speaker button'],
  ];
  const cx = [232, 252, 442, 622];
  ctx.textAlign = 'left';
  text('CONTROLLER', cx[1], 80, `800 11px ${SANS}`, C.faint);
  text('KEYBOARD', cx[2], 80, `800 11px ${SANS}`, C.faint);
  text('MOUSE / TOUCH', cx[3], 80, `800 11px ${SANS}`, C.faint);
  rows.forEach((r, i) => {
    const y = 104 + i * 22;
    ctx.textAlign = 'right'; text(r[0], cx[0], y, `600 14px ${SANS}`, C.dim);
    ctx.textAlign = 'left';
    for (let j = 1; j < 4; j++) text(r[j], cx[j], y, `600 14px ${SANS}`, C.text);
  });
  ctx.fillStyle = 'rgba(131,144,189,0.2)'; ctx.fillRect(70, 238, W - 140, 1);
  const col = (title, x, lines, y0 = 290) => {
    text(title, x, 264, `800 11px ${SANS}`, C.faint);
    lines.forEach((s, i) => text(s, x, y0 + i * 22, `500 14px ${SANS}`, C.text));
  };
  col('MATCHING', 70, [
    'Swap two gems side by side',
    'to line up 3 or more of a kind.',
    'New gems drift down and can',
    'set off gentle cascades.',
    'Stuck? The board reshuffles.',
    'Rest a moment for a hint.',
  ]);
  text('SPECIAL GEMS', 370, 264, `800 11px ${SANS}`, C.faint);
  ctx.drawImage(gemSprites[LINE_V], 362, 292, 44, 44);
  ctx.drawImage(novaSprite, 362, 380, 44, 44);
  [['Match 4, or an L or T shape:', C.text], ['a Line gem. Match it to clear', C.text], ['its whole row or column.', C.dim]]
    .forEach(([s, c], i) => text(s, 414, 292 + i * 22, `500 14px ${SANS}`, c));
  [['Match 5 in a row: a Nova.', C.text], ['Swap it with any gem to clear', C.text], ['every gem of that colour.', C.dim]]
    .forEach(([s, c], i) => text(s, 414, 380 + i * 22, `500 14px ${SANS}`, c));
  col('MODES', 690, [
    'Zen: endless, no limits,',
    'nothing to lose.',
    `Moves: ${CFG.moves} moves to make`,
    'your best score.',
    'Pace (on the menu) sets',
    'how fast gems move.',
  ]);
  ctx.textAlign = 'center';
  text(usingPad() ? `${NN.b}: back` : Input.device === 'touch' ? 'Tap to go back' : 'Esc or click: back', W / 2, H - 28, `600 13px ${SANS}`, C.dim);
}

// A calm card behind a menu so it never competes with the board
function card(x, y, w, h) {
  rrPath(x, y, w, h, 24);
  ctx.fillStyle = 'rgba(7,10,24,0.94)'; ctx.fill();
  const a = ctx.globalAlpha;
  ctx.globalAlpha = a * 0.6; glowStroke(CFG.color.title, 1.2); ctx.globalAlpha = a;
}

function drawPause() {
  overlay(0.5);
  card(W / 2 - 240, 70, 480, 400);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('PAUSED', W / 2, 132, `800 46px ${SANS}`, CFG.color.text);
  text('Take your time.', W / 2, 174, `500 14px ${SANS}`, CFG.color.dim);
  drawMenu(pauseItems(), 236, true, 50);
  const NN = padNames();
  text(usingPad() ? `${NN.start}: resume   ·   ${NN.select}: sound` : Input.device === 'touch' ? 'Tap an option' : 'Esc: resume   ·   M: sound',
    W / 2, 438, `500 12px ${SANS}`, CFG.color.faint);
}

function drawResult() {
  overlay(Math.min(0.6, stateT * 1.5));
  const r = resultInfo, C = CFG.color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = Math.min(1, stateT * 3);
  card(W / 2 - 240, 58, 480, 420);
  glowText(r.isBest ? 'New best!' : 'Well played', W / 2, 106, `800 50px ${SANS}`, r.isBest ? C.warn : C.title);
  text('SCORE', W / 2, 164, `800 11px ${SANS}`, C.faint);
  text(fmt(r.score), W / 2, 200, `800 46px ${MONO}`, C.text);
  text(`Best ${fmt(r.best)}`, W / 2, 244, `600 16px ${SANS}`, C.dim);
  text(`Biggest chain ×${r.bestChain}   ·   Specials made ${r.specials}   ·   Gems matched ${fmt(r.cleared)}`, W / 2, 278, `500 14px ${SANS}`, C.faint);
  drawMenu(resultItems(), 346, stateT > 0.8);
  ctx.globalAlpha = 1;
}

function drawToast() {
  if (toast.t <= 0) return;
  ctx.globalAlpha = Math.min(1, toast.t * 3);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `600 14px ${SANS}`;
  const y = state === 'play' ? H - 21 : H - 50, w = ctx.measureText(toast.text).width + 32;
  rrPath(W / 2 - w / 2, y - 13, w, 26, 13);
  ctx.fillStyle = 'rgba(10,14,32,0.9)'; ctx.fill();
  text(toast.text, W / 2, y, `600 14px ${SANS}`, CFG.color.text);
  ctx.globalAlpha = 1;
}

let fps = 60;
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(rs, 0, 0, rs, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'howto') drawHowTo();
  else {
    renderPlay();
    if (state === 'paused') drawPause();
    if (state === 'result') drawResult();
  }
  drawToast();
  if (SHOW_FPS) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    text(`${Math.round(fps)} fps`, W - 12, H - 6, `600 12px ${MONO}`, CFG.color.good);
  }
}

// ============================================================
// Main loop
// ============================================================
let last = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (SHOW_FPS && dt > 0) fps += (1 / dt - fps) * 0.05;
  if (dt > 0.05) dt = 0.05;
  Input.poll(dt);
  update(dt);
  render();
  Input.endFrame();
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') pauseGame();
});
addEventListener('resize', resize);
Input.init();
resize();
requestAnimationFrame(t => { last = t; frame(t); });

// Keep the screen on while someone is playing. The operating system only counts
// keyboard and mouse as activity, so during controller play it would switch the
// display off. After 5 minutes with no input at all the lock is let go, so a
// forgotten tab still lets the screen sleep.
(function () {
  if (typeof navigator === 'undefined' || !navigator.wakeLock) return;
  var IDLE_MS = 5 * 60 * 1000;
  var lock = null, asking = false, last = Date.now(), axes = [];
  function hold() {
    if (lock || asking || document.visibilityState !== 'visible') return;
    asking = true;
    navigator.wakeLock.request('screen').then(function (l) {
      asking = false;
      lock = l;
      l.addEventListener('release', function () { if (lock === l) lock = null; });
    }, function () { asking = false; });
  }
  function active() { last = Date.now(); hold(); }
  ['keydown', 'pointerdown', 'pointermove', 'wheel'].forEach(function (t) {
    addEventListener(t, active, { passive: true });
  });
  // The system drops the lock when the tab is hidden; take it again on return.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') active();
  });
  // Controllers fire no events for buttons or sticks, so look at them directly.
  setInterval(function () {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      if (!p) continue;
      var a = axes[i] || (axes[i] = []);
      for (var b = 0; b < p.buttons.length; b++) if (p.buttons[b].pressed) { active(); break; }
      for (var k = 0; k < p.axes.length; k++) {
        if (Math.abs(p.axes[k] - (a[k] || 0)) > 0.25) active();
        a[k] = p.axes[k];
      }
    }
    if (lock && Date.now() - last > IDLE_MS) {
      var l = lock;
      lock = null;
      l.release().catch(function () {});
    }
  }, 250);
  active();
})();

// Offline play: the AK Games service worker saves every game. It needs http(s), so it is skipped
// when the file is opened straight from disk.
if (typeof navigator !== 'undefined' && navigator.serviceWorker && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
}
