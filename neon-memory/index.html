// Card faces: 20 neon icons, each with its own colour AND its own shape.
// draw(g, R, body, line, col) builds paths around (0, 0) with radius about R:
// body() fills the current path softly and outlines it in neon, line() only outlines it.
function poly(g, pts, R) {
  g.beginPath();
  for (let i = 0; i < pts.length; i += 2) { const x = pts[i] * R, y = pts[i + 1] * R; if (i) g.lineTo(x, y); else g.moveTo(x, y); }
  g.closePath();
}
const ICONS = [
  { name: 'moon', color: '#fff1b8', draw(g, R, body) {
    g.translate(R * 0.2, -R * 0.02); g.rotate(-0.5);
    const o = R * 0.96, d = o * 0.42, r2 = o * 0.9;
    const x = (d * d + o * o - r2 * r2) / (2 * d), y = Math.sqrt(Math.max(0, o * o - x * x)), a = Math.atan2(y, x);
    g.beginPath(); g.arc(0, 0, o, a, TAU - a); g.arc(d, 0, r2, Math.atan2(-y, x - d), Math.atan2(y, x - d), true); g.closePath(); body();
  } },
  { name: 'sun', color: '#ffa04d', draw(g, R, body, line) {
    g.beginPath(); g.arc(0, 0, R * 0.5, 0, TAU); body();
    g.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8, c = Math.cos(a), s = Math.sin(a); g.moveTo(c * R * 0.72, s * R * 0.72); g.lineTo(c * R, s * R); }
    line();
  } },
  { name: 'star', color: '#ffd84d', draw(g, R, body) {
    g.translate(0, R * 0.08); g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? R * 0.44 : R * 1.02;

    }

  } },
  { name: 'lightning', color: '#f2ff5a', draw(g, R, body) { poly(g, [0.22, -1, -0.5, 0.14, -0.04, 0.14, -0.2, 1, 0.52, -0.16, 0.06, -0.16], R); body(); } },
  { name: 'bell', color: '#ffc25a', draw(g, R, body, line) {

  { name: 'crown', color: '#c8ff5a', draw(g, R, body, line) {

    g.beginPath(); g.moveTo(-R * 0.86, R * 0.3); g.lineTo(R * 0.86, R * 0.3); line(0.7);

  { name: 'leaf', color: '#6dff7a', draw(g, R, body, line) {

  { name: 'gem', color: '#2dffd8', draw(g, R, body, line) {
    poly(g, [-0.5, -0.58, 0.5, -0.58, 0.92, -0.12, 0, 0.86, -0.92, -0.12], R); body();

  { name: 'cloud', color: '#9db0ff', draw(g, R, body) {

  { name: 'umbrella', color: '#ff7ab8', draw(g, R, body, line) {

    g.beginPath(); g.moveTo(-R * 0.95, 0); g.arc(0, 0, R * 0.95, Math.PI, TAU);

  { name: 'heart', color: '#ff5f7f', draw(g, R, body) {

    g.beginPath(); g.moveTo(0, R * 0.82);

  { name: 'kite', color: '#ff8a6a', draw(g, R, body, line) {
    g.translate(-R * 0.08, -R * 0.06); g.rotate(0.18);
    poly(g, [0, -0.95, 0.62, -0.28, 0, 0.5, -0.62, -0.28], R); body();
    g.beginPath(); g.moveTo(0, -0.95 * R); g.lineTo(0, 0.5 * R); g.moveTo(-0.62 * R, -0.28 * R); g.lineTo(0.62 * R, -0.28 * R); line(0.6);

// Helpers
// ============================================================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function radial(x, y, dz, out) {
  const m = Math.hypot(x, y);
  if (m < dz) { out.x = 0; out.y = 0; out.m = 0; return out; }
  const n = Math.min(1, (m - dz) / (1 - dz));
  out.x = (x / m) * n; out.y = (y / m) * n; out.m = n;
  return out;
}
function load(key, def) { try { const v = localStorage.getItem(key); return v == null ? def : v; } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) { /* storage blocked: ignore */ } }
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);  // smooth in and out
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const backOut = t => { const s = 1.6, u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function fmtTime(s) { s = Math.floor(Math.max(0, s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

class Pool {
  constructor(n, make) {
    this.items = [];
    for (let i = 0; i < n; i++) { const o = make(); o.active = false; this.items.push(o); }
    this.next = 0;
  }
  get() {
    const a = this.items, n = a.length;
    for (let k = 0; k < n; k++) {
      const i = (this.next + k) % n;
      if (!a[i].active) { this.next = (i + 1) % n; a[i].active = true; return a[i]; }
    }
    return null;
  }
  clear() { for (const o of this.items) o.active = false; }
}

// ============================================================
// Canvas + art (icons, cards and background are drawn once into caches)
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let rs = 1;
let bgCanvas = null, backSprite = null;
let iconSprites = [], faceSprites = [], haloSprites = [], dotSprites = [], sparkSprites = [];
const CARD_PAD = 8;   // room around a card sprite for its edge glow

function layer(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * rs); c.height = Math.ceil(h * rs);
  const g = c.getContext('2d');
  g.setTransform(rs, 0, 0, rs, 0, 0);
  return { c, g };
}

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  const dpr = window.devicePixelRatio || 1;
  rs = LOW_RES ? 1 : clamp(s * dpr, 1, 1.5);
  canvas.width = Math.round(W * rs);
  canvas.height = Math.round(H * rs);
  buildArt();
}

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// Neon look: a soft fill, then wide faint strokes under a thin bright one, then a hot white core
function neonFill(g, col, R) {
  const gr = g.createLinearGradient(0, -R, 0, R);
  gr.addColorStop(0, hexA(col, 0.42)); gr.addColorStop(1, hexA(col, 0.12));
  g.fillStyle = gr; g.fill();
}
function neonStroke(g, col, lw) {
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = col;
  g.globalAlpha = 0.12; g.lineWidth = lw * 4.4; g.stroke();
  g.globalAlpha = 0.3; g.lineWidth = lw * 2.2; g.stroke();
  g.globalAlpha = 1; g.lineWidth = lw; g.stroke();
  g.globalAlpha = 0.35; g.strokeStyle = '#ffffff'; g.lineWidth = lw * 0.4; g.stroke();
  g.globalAlpha = 1;
}
function drawIcon(g, i, R) {
  const ic = ICONS[i], col = ic.color, lw = Math.max(1.6, R * 0.075);
  const body = (k = 1) => { neonFill(g, col, R); neonStroke(g, col, lw * k); };
  const line = (k = 1) => neonStroke(g, col, lw * k);
  g.save(); ic.draw(g, R, body, line, col); g.restore();

// ============================================================
// Sound: tiny WebAudio synth, no audio files. Soft sine bells only.
// ============================================================
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: false, last: {},
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.3;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.6);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (e) { /* no audio: game still works */ }
  },
  ok(key, gap) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return false;
    if (key) {
      const now = this.ctx.currentTime;
      if (now - (this.last[key] || 0) < gap) return false;
      this.last[key] = now;
    }
    return true;
  },
  // A note with a soft attack and a gentle fade (no clicks)
  tone(f1, f2, dur, type, vol, delay = 0, attack = 0.012) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, delay = 0) { // a soft airy puff
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  bell(f, vol, delay = 0, dur = 0.5) {
    this.tone(f, f, dur, 'sine', vol, delay);
    this.tone(f * 2, f * 2, dur * 0.45, 'sine', vol * 0.22, delay);
  },
  flip()    { if (this.ok('flip', 0.04)) { this.tone(520, 640, 0.09, 'sine', 0.045); this.noise(0.08, 0.012, 1600); } },
  back()    { if (this.ok('back', 0.06)) this.tone(560, 430, 0.13, 'sine', 0.03); },
  // Each pair found rings the next note up the scale, so a whole board plays a little tune
  match(n)  { if (this.ok('match', 0.05)) { const f = NOTES[n % NOTES.length]; this.bell(f, 0.09, 0, 0.9); this.bell(f * 1.5, 0.035, 0.09, 0.8); } },
  miss()    { if (this.ok('miss', 0.1)) { this.tone(392, 392, 0.18, 'sine', 0.032); this.tone(330, 330, 0.24, 'sine', 0.028, 0.12); } },
  turn(p)   { if (this.ok('turn', 0.1)) { const f = p ? 659.25 : 523.25; this.tone(f, f, 0.14, 'triangle', 0.035); this.tone(f * 1.25, f * 1.25, 0.18, 'sine', 0.03, 0.08); } },
  peek()    { if (this.ok('peek', 0.3)) { this.tone(440, 880, 0.6, 'sine', 0.03); this.noise(0.6, 0.015, 2400); } },
  nope()    { if (this.ok('nope', 0.12)) this.tone(300, 300, 0.08, 'sine', 0.025); },
  finish()  { if (this.ok()) [261.63, 329.63, 392, 493.88, 523.25].forEach((f, i) => this.bell(f, 0.06, i * 0.11, 1.5)); },
  tick()    { if (this.ok('tick', 0.03)) this.tone(880, 880, 0.05, 'sine', 0.03); },
  select()  { if (this.ok()) { this.tone(660, 660, 0.09, 'sine', 0.05); this.tone(990, 990, 0.13, 'sine', 0.045, 0.06); } },
  blip()    { if (this.ok()) this.tone(600, 600, 0.08, 'sine', 0.04); },
  toggle() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.3;
  },
};

// ============================================================
// Input: gamepad + keyboard + mouse/touch merged into one state
// ============================================================
const NAV_CODES = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);
const Input = {
  keys: new Set(), pressed: new Set(), navKeys: new Set(),
  // One pointer (mouse, pen or finger) in world coordinates
  mouse: { x: W / 2, y: H / 2, clicked: false, released: false, moved: false, down: false, id: null, type: 'mouse' },
  pad: null, padIndex: null, prev: [], stickDir: 0, stickHold: 0,
  device: 'kb',     // 'kb', 'pad', 'mouse' or 'touch': whatever was used last
  ls: { x: 0, y: 0, m: 0 },
  act: false, pause: false, mute: false, select: false, back: false,
  navUp: false, navDown: false, navLeft: false, navRight: false,

  init() {
    addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (!e.repeat) this.pressed.add(e.code);
      if (NAV_CODES.has(e.code)) this.navKeys.add(e.code);
      this.keys.add(e.code);
      this.device = 'kb';
      Sfx.init();
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; this.mouse.id = null; });
    canvas.addEventListener('pointerdown', e => {
      const m = this.mouse;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (m.down && m.id !== e.pointerId) return; // ignore a second finger
      e.preventDefault();
      this.toWorld(e);
      m.down = true; m.id = e.pointerId; m.clicked = true; m.moved = true;
      m.type = e.pointerType === 'mouse' ? 'mouse' : 'touch';
      this.device = m.type;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture not supported */ }
      Sfx.init();
    });
    canvas.addEventListener('pointermove', e => {
      const m = this.mouse;
      if (m.down && m.id !== e.pointerId) return;
      this.toWorld(e); m.moved = true;
      if (e.pointerType === 'mouse' && this.device === 'touch' && !m.down) this.device = 'mouse';
    });
    const up = e => {
      const m = this.mouse;
      if (!m.down || m.id !== e.pointerId) return;
      this.toWorld(e);
      m.down = false; m.id = null; m.released = true;
      Sfx.init(); // touch only unlocks audio on release
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    addEventListener('gamepadconnected', e => {
      this.padIndex = e.gamepad.index; this.prev.length = 0; this.device = 'pad';
      showToast('Controller connected');
    });
    addEventListener('gamepaddisconnected', e => {
      if (this.padIndex === e.gamepad.index) this.padIndex = null;
      showToast('Controller disconnected');
      if (state === 'play') pauseGame();
    });
  },

  // Map a pointer event to the 960x540 world
  toWorld(e) {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.mouse.x = ((e.clientX - r.left) / r.width) * W;
    this.mouse.y = ((e.clientY - r.top) / r.height) * H;
  },

  getPad() {
    if (!navigator.getGamepads) return null;
    let pads;
    try { pads = navigator.getGamepads(); } catch (e) { return null; }
    if (!pads) return null;
    const cur = this.padIndex != null ? pads[this.padIndex] : null;
    if (cur && cur.connected) return cur;
    for (const p of pads) {
      if (p && p.connected) { this.padIndex = p.index; this.prev.length = 0; return p; }
    }
    this.padIndex = null;
    return null;
  },

  poll(dt) {
    const P = this.pressed, K = this.navKeys;
    let act = P.has('Space') || P.has('Enter');
    let pause = P.has('Escape') || P.has('KeyP');
    let mute = P.has('KeyM');
    let select = P.has('Enter') || P.has('Space');
    let back = P.has('Escape') || P.has('Backspace');
    let up = K.has('ArrowUp') || K.has('KeyW'), down = K.has('ArrowDown') || K.has('KeyS');
    let left = K.has('ArrowLeft') || K.has('KeyA'), right = K.has('ArrowRight') || K.has('KeyD');

    const pad = this.getPad();

      // First frame with this pad: buttons already held (e.g. A from the game picker) are not new presses.
      const fresh = !prev.length;
      if (fresh) for (let i = 0; i < btns.length; i++) prev[i] = on(i);
      const tap = i => on(i) && !prev[i];
      radial(pad.axes[0] || 0, pad.axes[1] || 0, 0.2, this.ls);
      if (tap(0)) act = true;
      if (tap(9)) pause = true;
      if (tap(8)) mute = true;
      if (tap(0) || tap(9)) select = true;
      if (tap(1)) back = true;
      // D-pad or left stick as a cursor: one step per push, auto-repeat when held.
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      let dir = 0;
      if (on(12)) dir = 1; else if (on(13)) dir = 2; else if (on(14)) dir = 3; else if (on(15)) dir = 4;
      else if (Math.abs(ay) > 0.6 && Math.abs(ay) >= Math.abs(ax)) dir = ay < 0 ? 1 : 2;
      else if (Math.abs(ax) > 0.6) dir = ax < 0 ? 3 : 4;
      let step = 0;
      if (fresh) { this.stickDir = dir; this.stickHold = 0; }
      else if (dir !== this.stickDir) { this.stickDir = dir; this.stickHold = 0; step = dir; }
      else if (dir) { this.stickHold += dt; if (this.stickHold > 0.35) { this.stickHold = 0.22; step = dir; } }
      if (step === 1) up = true; else if (step === 2) down = true; else if (step === 3) left = true; else if (step === 4) right = true;

      let any = false;
      for (let i = 0; i < btns.length; i++) { const v = on(i); if (v && !prev[i]) any = true; prev[i] = v; }
      if (any || this.ls.m > 0) this.device = 'pad';
      if (any) Sfx.init();
    }
    this.act = act; this.pause = pause; this.mute = mute; this.select = select; this.back = back;
    this.navUp = up; this.navDown = down; this.navLeft = left; this.navRight = right;
  },

  endFrame() {
    this.pressed.clear(); this.navKeys.clear();
    this.mouse.clicked = false; this.mouse.released = false; this.mouse.moved = false;
  },
};

  const s = String(id || '').replace(/\(.*$/, '').replace(/^[0-9a-f]{4}-[0-9a-f]{4}-/i, '').trim();

if (sizeIdx < 0) sizeIdx = 1;

}

let menuSel = 0;
const menuRects = [];

// ============================================================
// 2. Deck and board layout
// ============================================================
// Fisher-Yates: every order is equally likely
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
// `pairs` different icons, two of each, shuffled
function makeDeck(pairs) {
  const pick = shuffle(ICONS.map((_, i) => i)).slice(0, pairs);
  return shuffle([...pick, ...pick]);
}
function layoutFor(si) {
  const s = SIZES[si], B = CFG.board;
  const pitch = Math.min((B.x1 - B.x0) / s.cols, (B.y1 - B.y0) / s.rows, B.maxPitch);
  return {
    cols: s.cols, rows: s.rows, n: s.cols * s.rows, pitch, cs: Math.round(pitch * (1 - B.gap)),
    BX: (W - s.cols * pitch) / 2, BY: (H - s.rows * pitch) / 2,
  };
}

// ============================================================
// 3. Play: flipping, matching and turns
// ============================================================
const G = {
  size: SIZES[1], cols: 4, rows: 4, n: 16, pitch: 100, cs: 90, BX: 0, BY: 0, total: 8,
  cards: [], open: [], phase: 'idle', phaseT: 0, missT: 0, matchFx: [],
  moves: 0, pairs: 0, players: 1, turn: 0, scores: [0, 0], timer: false, peek: false, time: 0,
  cursor: 0, peekUp: 0, peekLeft: 0,
};
const cardX = k => G.BX + ((k % G.cols) + 0.5) * G.pitch;
const cardY = k => G.BY + (((k / G.cols) | 0) + 0.5) * G.pitch;
// The card under a point. The whole cell counts (gaps too), so taps are forgiving.
function cardAt(x, y) {
  const c = Math.floor((x - G.BX) / G.pitch), r = Math.floor((y - G.BY) / G.pitch);
  return r >= 0 && r < G.rows && c >= 0 && c < G.cols ? r * G.cols + c : -1;
}
const ripple = k => ((k % G.cols) + ((k / G.cols) | 0)) * 0.04;   // a diagonal wave across the board

function startGame() {
  Sfx.init();
  clearFx();
  const L = layoutFor(sizeIdx);
  Object.assign(G, L, {
    size: SIZES[sizeIdx], total: L.n / 2, open: [], phase: 'deal', phaseT: 0, missT: 0, matchFx: [],
    moves: 0, pairs: 0, players, turn: 0, scores: [0, 0], timer: timerOn, peek: peekOn, time: 0,
    cursor: 0, peekUp: 0, peekLeft: 0,
  });
  const stagger = Math.min(0.03, 0.7 / L.n);
  G.cards = makeDeck(G.total).map((icon, k) => ({
    icon, up: false, matched: false, owner: -1, flip: 0, target: 0, wait: 0,
    deal: -(k * stagger) / CFG.deal, glowT: 0,
  }));
  buildCardArt();
  setState('play');
}

function startPeek() {
  G.phase = 'peek'; G.phaseT = 0; G.peekLeft = 1;
  let maxWait = 0;
  G.cards.forEach((c, k) => { c.target = 1; c.wait = ripple(k); maxWait = Math.max(maxWait, c.wait); });
  G.peekUp = CFG.flip + maxWait;
  Sfx.peek();
}
function endPeek() {
  G.phase = 'unpeek'; G.phaseT = 0; G.peekLeft = 0;
  G.cards.forEach((c, k) => { c.target = 0; c.wait = ripple(k); });
  Sfx.back();
}

// Flip the card at k. Returns what happened (handy for tests):
// 'first', 'match', 'miss', 'hurry', 'hurry+flip' or 'ignored'.
function flipCard(k) {
  if (G.phase === 'miss') {
    // A tap while a missed pair waits turns them back at once; a tap on another card also flips it.
    const wasOpen = G.open.includes(k);
    resolveMiss();
    if (wasOpen || k < 0 || k >= G.n || G.cards[k].matched) return 'hurry';
    return flipCard(k) === 'first' ? 'hurry+flip' : 'hurry';
  }
  if (G.phase !== 'idle' || k < 0 || k >= G.n) return 'ignored';
  const c = G.cards[k];
  if (c.matched || c.up) { Sfx.nope(); return 'ignored'; }
  c.up = true; c.target = 1; c.wait = 0;
  Sfx.flip();
  G.open.push(k);
  if (G.open.length === 1) return 'first';
  G.moves++;
  const [a, b] = G.open, A = G.cards[a], B = G.cards[b];
  if (A.icon === B.icon) {
    G.open = [];
    A.matched = B.matched = true;
    A.owner = B.owner = G.turn;
    A.glowT = B.glowT = -CFG.flip;            // the glow and chime land when the card has turned
    G.pairs++; G.scores[G.turn]++;
    G.matchFx.push({ t: CFG.flip, a, b, n: G.pairs - 1, p: G.turn });
    if (G.pairs === G.total) { G.phase = 'won'; G.phaseT = 0; }
    return 'match';
  }
  G.phase = 'miss'; G.missT = 0;
  return 'miss';
}

function resolveMiss() {
  for (const k of G.open) { const c = G.cards[k]; c.up = false; c.target = 0; c.wait = 0; }
  G.open = [];
  G.phase = 'idle'; G.phaseT = 0;
  Sfx.back();
  if (G.players === 2) {
    G.turn = 1 - G.turn;
    Sfx.turn(G.turn);
    floater(`${PLAYER_NAMES[G.turn]}'s turn`, W / 2, H / 2, G.turn ? CFG.color.p2 : CFG.color.p1, 30);
  }
}

function matchFx(f) {
  const col = ICONS[G.cards[f.a].icon].color, ci = G.cards[f.a].icon;
  for (const k of [f.a, f.b]) {
    burst(cardX(k), cardY(k), ci, LOW_RES ? 5 : 10, 170, 0.8, 8);
    ring(cardX(k), cardY(k), G.cs * 0.3, G.cs * 0.85, 0.6, col, 2);
  }
  Sfx.match(f.n);
  if (G.players === 2) floater('+1', cardX(f.b), cardY(f.b) - G.cs * 0.45, f.p ? CFG.color.p2 : CFG.color.p1, 26);
}

function finishGame() {
  const id = G.size.id, prevBest = bestMoves[id];
  let isBest = false, isBestTime = false;
  if (G.players === 1) {
    isBest = !bestMoves[id] || G.moves < bestMoves[id];
    if (isBest) { bestMoves[id] = G.moves; save('neonMemory.best.' + id, G.moves); }
    if (G.timer) {
      const t = Math.round(G.time * 10) / 10;
      isBestTime = !bestTime[id] || t < bestTime[id];
      if (isBestTime) { bestTime[id] = t; save('neonMemory.time.' + id, t); }
    }
  }
  cleared++; save('neonMemory.cleared', cleared);
  const s = G.scores;
  resultInfo = {
    size: G.size, moves: G.moves, pairs: G.total, best: bestMoves[id], prevBest, isBest, perfect: G.moves === G.total,
    timer: G.timer, time: G.time, bestTime: bestTime[id], isBestTime,
    players: G.players, scores: s.slice(), winner: s[0] > s[1] ? 0 : s[1] > s[0] ? 1 : -1,
    word: KIND_WORDS[(Math.random() * KIND_WORDS.length) | 0],
  };
  setState('result');
  Sfx.finish();
  for (let i = 0; i < (LOW_RES ? 16 : 44); i++) spawnSpark(rand(0, W), rand(-30, H));
}

// Animation and flow for the board
function stepBoard(dt) {
  G.phaseT += dt;
  for (const c of G.cards) {
    if (c.deal < 1) c.deal = Math.min(1, c.deal + dt / CFG.deal);
    if (c.wait > 0) c.wait = Math.max(0, c.wait - dt);
    else if (c.flip !== c.target) {
      const s = dt / CFG.flip;
      c.flip = c.target > c.flip ? Math.min(c.target, c.flip + s) : Math.max(c.target, c.flip - s);
    }
    if (c.matched && c.glowT < 1) c.glowT = Math.min(1, c.glowT + dt / 0.9);
  }
  for (let i = G.matchFx.length - 1; i >= 0; i--) {
    const f = G.matchFx[i];
    f.t -= dt;
    if (f.t <= 0) { G.matchFx.splice(i, 1); matchFx(f); }
  }
  switch (G.phase) {
    case 'deal':
      if (G.cards.every(c => c.deal >= 1)) { if (G.peek) startPeek(); else { G.phase = 'idle'; G.phaseT = 0; } }
      break;
    case 'peek':
      G.peekLeft = clamp(1 - (G.phaseT - G.peekUp) / CFG.peekTime, 0, 1);
      if (G.phaseT >= G.peekUp + CFG.peekTime) endPeek();
      break;
    case 'unpeek':
      if (G.cards.every(c => c.wait <= 0 && c.flip === c.target)) { G.phase = 'idle'; G.phaseT = 0; }
      break;
    case 'miss': {
      const before = G.missT;
      G.missT += dt;
      if (before < CFG.flip && G.missT >= CFG.flip) Sfx.miss();
      if (G.missT >= CFG.flip + CFG.missPause) resolveMiss();
      break;
    }
    case 'won':
      if (G.phaseT >= CFG.flip + CFG.winDelay) finishGame();
      break;
  }
  if (G.phase === 'idle' || G.phase === 'miss') G.time += dt;
}

const SOUND_BTN = { x: W - 124, y: 12, w: 50, h: 50 };
const PAUSE_BTN = { x: W - 64, y: 12, w: 50, h: 50 };

// Cursor (keyboard / controller) and taps / clicks
function boardInput() {
  const I = Input, m = I.mouse;
  if (m.clicked && inRect(m, PAUSE_BTN)) { pauseGame(); return; }
  if (m.clicked && inRect(m, SOUND_BTN)) { toggleSound(); return; }
  const dr = I.navUp ? -1 : I.navDown ? 1 : 0, dc = dr ? 0 : I.navLeft ? -1 : I.navRight ? 1 : 0;
  if (dr || dc) {
    const r = clamp(((G.cursor / G.cols) | 0) + dr, 0, G.rows - 1), c = clamp((G.cursor % G.cols) + dc, 0, G.cols - 1);
    if (r * G.cols + c !== G.cursor) { G.cursor = r * G.cols + c; Sfx.tick(); }
  }
  if (I.act) flipCard(G.cursor);
  if (m.clicked) {
    const k = cardAt(m.x, m.y);
    if (k >= 0) G.cursor = k;
    if (k >= 0 || G.phase === 'miss') flipCard(k);   // a tap anywhere hurries a missed pair
  }
}

function updatePlay(dt) {
  boardInput();
  if (state !== 'play') return; // paused from the on-screen button
  stepBoard(dt);
}

// ============================================================
// Effects
// ============================================================
const parts = new Pool(LOW_RES ? 120 : 260, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, ci: 0, size: 6 }));
const rings = new Pool(32, () => ({ x: 0, y: 0, r0: 0, r1: 0, life: 0, max: 1, color: '#fff', w: 2 }));
const floaters = new Pool(16, () => ({ x: 0, y: 0, text: '', color: '#fff', life: 0, max: 1, size: 20 }));
const sparks = new Pool(LOW_RES ? 40 : 110, () => ({ x: 0, y: 0, vx: 0, vy: 0, ph: 0, s: 10, ci: 0 }));
let sparkAcc = 0;
const motes = [];
for (let i = 0; i < (LOW_RES ? 10 : 24); i++) {
  motes.push({ x: Math.random() * W, y: Math.random() * H, vx: rand(-6, 6), vy: rand(-12, -4), s: rand(6, 16), ph: Math.random() * TAU, ci: i % ICONS.length });
}

function burst(x, y, ci, n, speed, life = 0.7, size = 7) {
  for (let i = 0; i < n; i++) {
    const p = parts.get();
    if (!p) return;
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.max = p.life = life * (0.5 + Math.random() * 0.5);
    p.ci = ci; p.size = size * (0.6 + Math.random() * 0.8);
  }
}
function ring(x, y, r0, r1, life, color, w = 2) {
  const o = rings.get();
  if (!o) return;
  o.x = x; o.y = y; o.r0 = r0; o.r1 = r1; o.life = o.max = life; o.color = color; o.w = w;
}
function floater(text, x, y, color, size = 20) {
  const o = floaters.get();
  if (!o) return;
  o.text = text; o.x = x; o.y = y; o.color = color; o.size = size; o.life = o.max = 1.3;
}
function spawnSpark(x, y) {
  const o = sparks.get();
  if (!o) return;
  o.x = x; o.y = y; o.vx = rand(-10, 10); o.vy = rand(28, 62); o.ph = Math.random() * TAU; o.s = rand(10, 22);
  o.ci = (Math.random() * ICONS.length) | 0;
}
function clearFx() { parts.clear(); rings.clear(); floaters.clear(); sparks.clear(); sparkAcc = 0; }

function updateFx(dt) {
  const drag = Math.pow(0.08, dt);
  for (const p of parts.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.vx *= drag; p.vy = p.vy * drag + 40 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (const pool of [rings, floaters]) {
    for (const o of pool.items) {
      if (!o.active) continue;
      o.life -= dt;
      if (o.life <= 0) o.active = false;
    }
  }
  for (const f of floaters.items) if (f.active) f.y -= 26 * dt;
  // Win card: sparkles drift down like slow confetti
  if (state === 'result') {
    sparkAcc += dt * (LOW_RES ? 5 : 12);
    while (sparkAcc >= 1) { sparkAcc--; spawnSpark(rand(0, W), -16); }
  }
  for (const o of sparks.items) {
    if (!o.active) continue;
    o.x += (o.vx + Math.sin(time * 1.3 + o.ph) * 18) * dt; o.y += o.vy * dt;
    if (o.y > H + 20) o.active = false;
  }
  for (const m of motes) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; }
    if (m.x < -20) m.x = W + 20; else if (m.x > W + 20) m.x = -20;
  }
}

// ============================================================
// Menus
// ============================================================
function soundItem() {
  return { id: 'sound', label: 'Sound', value: Sfx.muted ? 'Off' : 'On', cycle: () => toggleSound(), hint: 'Soft chimes on or off.' };
}
function titleItems() {
  const s = SIZES[sizeIdx], pairs = (s.cols * s.rows) / 2;
  return [
    { id: 'play', label: 'Play', hint: players === 2 ? `Take turns to find ${pairs} pairs together.`
      : cleared > 0 ? `Find all ${pairs} pairs. ${cleared} ${cleared === 1 ? 'board' : 'boards'} cleared so far.` : `Find all ${pairs} pairs. No timer, no rush.` },
    { id: 'size', label: 'Size', value: `${s.label} ${s.name}`, cycle: d => cycleSize(d), hint: s.hint },
    { id: 'players', label: 'Players', value: players === 2 ? '2 players' : '1 player', cycle: () => cyclePlayers(),
      hint: players === 2 ? 'Take turns on one device. Find a pair, go again.' : 'Just you, at your own pace.' },
    { id: 'peek', label: 'Peek', value: peekOn ? 'On' : 'Off', cycle: () => togglePeek(), hint: 'See every card for 3 seconds at the start.' },
    { id: 'timer', label: 'Timer', value: timerOn ? 'On' : 'Off', cycle: () => toggleTimer(), hint: 'Show a clock while you play. It never runs out.' },
    soundItem(),
    { id: 'howto', label: 'How to Play', hint: 'Controls, rules and the two-player mode.' },
    { id: 'games', label: 'All Games', hint: 'Back to the game picker.' },
  ];
}
function pauseItems() {
  return [{ id: 'resume', label: 'Resume' }, { id: 'restart', label: 'Restart' }, soundItem(), { id: 'quit', label: 'Quit to menu' }];
}
function resultItems() { return [{ id: 'again', label: 'Play again' }, { id: 'menu', label: 'Main menu' }]; }

function menuInput(items) {
  const I = Input, m = I.mouse, n = items.length;
  if (menuSel >= n) menuSel = 0;
  if (I.navUp) { menuSel = (menuSel + n - 1) % n; Sfx.tick(); }
  if (I.navDown) { menuSel = (menuSel + 1) % n; Sfx.tick(); }
  if (m.moved || m.clicked) {
    for (let i = 0; i < n; i++) {
      const r = menuRects[i];
      if (r && inRect(m, r) && menuSel !== i) { menuSel = i; if (!m.clicked) Sfx.tick(); }
    }
  }
  const it = items[menuSel], r = menuRects[menuSel];
  const clickedItem = m.clicked && r && inRect(m, r);
  if (it.value !== undefined) {
    const d = (I.navRight ? 1 : 0) - (I.navLeft ? 1 : 0) || (I.select || clickedItem ? 1 : 0);
    if (d) { it.cycle(d); Sfx.tick(); return null; }
  }
  if (I.select || clickedItem) { Sfx.select(); return it.id; }
  return null;
}

// ============================================================
// Main update
// ============================================================
function update(dt) {
  time += dt; stateT += dt;
  if (toast.t > 0) toast.t -= dt;
  if (Input.mute) toggleSound();
  updateFx(dt);

  switch (state) {
    case 'title': {
      const id = menuInput(titleItems());
      if (id === 'play') startGame();
      else if (id === 'howto') setState('howto');
      else if (id === 'games') location.href = '../index.html';
      break;
    }
    case 'howto':
      if (Input.back || Input.select || Input.mouse.clicked) { setState('title'); menuSel = 6; Sfx.blip(); }
      break;
    case 'play':
      if (Input.pause) { pauseGame(); break; }
      updatePlay(dt);
      break;
    case 'paused': {
      if (Input.pause || Input.back) { resumeGame(); break; }
      const id = menuInput(pauseItems());
      if (id === 'resume') resumeGame();
      else if (id === 'restart') startGame();
      else if (id === 'quit') toTitle();
      break;
    }
    case 'result':
      if (stateT > 0.8) {
        const id = menuInput(resultItems());
        if (id === 'again') startGame();
        else if (id === 'menu' || Input.back) toTitle();
      }
      break;
  }
}

// ============================================================
// Rendering
// ============================================================
function rrPath(x, y, w, h, r) { rr(ctx, x, y, w, h, r); }
function glowStroke(color, w) {
  const a = ctx.globalAlpha;
  ctx.strokeStyle = color;
  ctx.globalAlpha = a * 0.22; ctx.lineWidth = w * 3.5; ctx.stroke();
  ctx.globalAlpha = a; ctx.lineWidth = w; ctx.stroke();
}
function text(s, x, y, font, color) { ctx.font = font; ctx.fillStyle = color; ctx.fillText(s, x, y); }
function glowText(s, x, y, font, color) {
  const a = ctx.globalAlpha;
  ctx.font = font; ctx.lineJoin = 'round';
  ctx.globalAlpha = a * 0.22; ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.strokeText(s, x, y);
  ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function overlay(alpha) { ctx.fillStyle = `rgba(3,5,10,${alpha})`; ctx.fillRect(0, 0, W, H); }

function drawMotes() {
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    ctx.globalAlpha = 0.13 + 0.1 * Math.sin(time * 0.9 + m.ph);
    ctx.drawImage(dotSprites[m.ci], m.x - m.s / 2, m.y - m.s / 2, m.s, m.s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

const playerColor = p => (p ? CFG.color.p2 : CFG.color.p1);
const frameColor = () => (G.players === 2 && G.phase !== 'won' && state !== 'result' ? playerColor(G.turn) : CFG.color.title);

// One card: dealt in, turned over with a horizontal squeeze, lifted a little mid-turn
function drawCard(k) {
  const c = G.cards[k], cs = G.cs, x = cardX(k);
  let y = cardY(k), s = 1, a = 1;
  if (c.deal < 1) {
    const d = clamp(c.deal, 0, 1);
    if (d <= 0) return;
    s = 0.6 + 0.4 * backOut(d); a = d;
  }
  const p = ease(clamp(c.flip, 0, 1)), sx = Math.abs(Math.cos(p * Math.PI)), lift = Math.sin(p * Math.PI);
  s *= 1 + 0.07 * lift;
  if (G.phase === 'won' || state === 'result') { // a ripple of joy across the board
    const t = G.phaseT - CFG.flip - Math.hypot((k % G.cols) - (G.cols - 1) / 2, ((k / G.cols) | 0) - (G.rows - 1) / 2) * 0.09;
    if (state === 'play' && t > 0 && t < 0.5) s *= 1 + 0.08 * Math.sin((t / 0.5) * Math.PI);
  }
  const face = p >= 0.5, size = (cs + CARD_PAD * 2) * s, ch = cs * s;
  y -= lift * 4;
  ctx.globalAlpha = a;
  if (c.matched && face && c.glowT > 0) { // a soft glow around a found pair (brighter just after the match)
    const g = c.glowT, d = cs * (1.5 + 0.25 * (1 - g));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * (0.2 + 0.05 * Math.sin(time * 1.6 + k) + 0.45 * (1 - g));
    ctx.drawImage(haloSprites[c.icon], x - d / 2, y - d / 2, d, d);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;
  }
  if (lift > 0.02) {
    const cw = ch * Math.max(sx, 0.05);
    rrPath(x - cw / 2 + 2, y - ch / 2 + 7, cw, ch, cs * 0.13);
    ctx.fillStyle = `rgba(0,0,0,${0.3 * lift})`; ctx.fill();
  }
  ctx.drawImage(face ? faceSprites[c.icon] : backSprite, x - (size * sx) / 2, y - size / 2, size * sx, size);
  if (c.matched && face && c.glowT > 0) {
    rrPath(x - (ch * sx) / 2, y - ch / 2, ch * sx, ch, cs * 0.13 * s);
    ctx.globalAlpha = a * Math.min(1, c.glowT * 3) * (0.6 + 0.15 * Math.sin(time * 1.6 + k));
    glowStroke(ICONS[c.icon].color, 1.8);
  }
  if (sx < 0.12) { // the card's thin edge as it turns
    ctx.globalAlpha = a * (1 - sx / 0.12) * 0.8;
    ctx.fillStyle = face ? ICONS[c.icon].color : CFG.color.title;
    ctx.fillRect(x - 1, y - ch / 2, 2, ch);
  }
  if (c.matched && face && G.players === 2 && c.owner >= 0) { // whose pair it is
    ctx.globalAlpha = a * Math.min(1, Math.max(0, c.glowT) * 3);
    rrPath(x - cs * 0.22 * sx, y + ch / 2 - cs * 0.1, cs * 0.44 * sx, cs * 0.05, cs * 0.025);
    ctx.fillStyle = playerColor(c.owner); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function renderBoard() {
  const bw = G.cols * G.pitch, bh = G.rows * G.pitch;
  rrPath(G.BX - 6, G.BY - 6, bw + 12, bh + 12, 18);
  ctx.fillStyle = 'rgba(8,11,26,0.55)'; ctx.fill();
  ctx.globalAlpha = 0.4 + 0.12 * Math.sin(time * 0.8);
  glowStroke(frameColor(), 1.5);
  ctx.globalAlpha = 1;
  for (let k = 0; k < G.n; k++) if (G.cards[k].flip === 0 || G.cards[k].flip === 1) drawCard(k);
  for (let k = 0; k < G.n; k++) if (G.cards[k].flip > 0 && G.cards[k].flip < 1) drawCard(k); // turning cards on top
}

function cardOutline(k, out) {
  const cs = G.cs;
  rrPath(cardX(k) - cs / 2 - out, cardY(k) - cs / 2 - out, cs + out * 2, cs + out * 2, cs * 0.13 + out);
}
function renderMarks() {
  const dev = Input.device;
  if (dev === 'kb' || dev === 'pad') {
    cardOutline(G.cursor, 4);
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 4);
    glowStroke('#ffffff', 2.4);
    ctx.globalAlpha = 1;
  } else if (dev === 'mouse' && (G.phase === 'idle' || G.phase === 'miss')) {
    const k = cardAt(Input.mouse.x, Input.mouse.y);
    if (k >= 0 && !G.cards[k].up && !G.cards[k].matched) {
      cardOutline(k, 3); ctx.globalAlpha = 0.45; glowStroke('#ffffff', 1.6); ctx.globalAlpha = 1;
    }
  }
}

function drawFx() {
  ctx.globalCompositeOperation = 'lighter';
  for (const o of rings.items) {
    if (!o.active) continue;
    const p = 1 - o.life / o.max;
    ctx.globalAlpha = (1 - p) * 0.85;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r0 + (o.r1 - o.r0) * easeOut(p), 0, TAU);
    glowStroke(o.color, o.w);
  }
  for (const p of parts.items) {
    if (!p.active) continue;
    ctx.globalAlpha = p.life / p.max;
    ctx.drawImage(dotSprites[p.ci], p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawSparks() {
  ctx.globalCompositeOperation = 'lighter';
  for (const o of sparks.items) {
    if (!o.active) continue;
    const tw = 0.75 + 0.25 * Math.sin(time * 4 + o.ph), s = o.s * tw;

// ============================================================
// Main loop
// ============================================================
let last = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (SHOW_FPS && dt > 0) fps += (1 / dt - fps) * 0.05;
  if (dt > 0.05) dt = 0.05;
  Input.poll(dt);
  update(dt);
  render();
  Input.endFrame();
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {

});
addEventListener('resize', resize);
Input.init();
resize();
requestAnimationFrame(t => { last = t; frame(t); });

// Keep the screen on while someone is playing. The operating system only counts
// keyboard and mouse as activity, so during controller play it would switch the
// display off. After 5 minutes with no input at all the lock is let go, so a
// forgotten tab still lets the screen sleep.
(function () {
  if (typeof navigator === 'undefined' || !navigator.wakeLock) return;
  var IDLE_MS = 5 * 60 * 1000;
  var lock = null, asking = false, last = Date.now(), axes = [];
  function hold() {
    if (lock || asking || document.visibilityState !== 'visible') return;
    asking = true;
    navigator.wakeLock.request('screen').then(function (l) {
      asking = false;
      lock = l;
      l.addEventListener('release', function () { if (lock === l) lock = null; });
    }, function () { asking = false; });
  }
  function active() { last = Date.now(); hold(); }
  ['keydown', 'pointerdown', 'pointermove', 'wheel'].forEach(function (t) {
    addEventListener(t, active, { passive: true });
  });
  // The system drops the lock when the tab is hidden; take it again on return.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') active();
  });
  // Controllers fire no events for buttons or sticks, so look at them directly.
  setInterval(function () {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      if (!p) continue;
      var a = axes[i] || (axes[i] = []);
      for (var b = 0; b < p.buttons.length; b++) if (p.buttons[b].pressed) { active(); break; }
      for (var k = 0; k < p.axes.length; k++) {
        if (Math.abs(p.axes[k] - (a[k] || 0)) > 0.25) active();
        a[k] = p.axes[k];
      }
    }
    if (lock && Date.now() - last > IDLE_MS) {
      var l = lock;
      lock = null;
      l.release().catch(function () {});
    }
  }, 250);
  active();
})();

let creditsHit = null;
function drawCreditsLink(draw, y, font, color) {

  ctx.font = font;

  const badge = 14, gap = 5, total = wa + wb + gap + badge + wc, x0 = W / 2 - total / 2, align = ctx.textAlign;
  ctx.textAlign = 'left';
  draw(a, x0, y, font, color);
  draw(b, x0 + wa, y, font, LINK);
  ctx.fillStyle = LINK; ctx.fillRect(x0 + wa, y + 7, wb, 1);
  const bx = x0 + wa + wb + gap;
  ctx.fillStyle = '#0a66c2';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, y - badge / 2, badge, badge, 3); ctx.fill(); } else ctx.fillRect(bx, y - badge / 2, badge, badge);
  ctx.font = `800 10px ${SANS}`; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.fillText('in', bx + badge / 2, y + 0.5);
  ctx.textAlign = 'left';

}
(function () {
  var cv = typeof document !== 'undefined' && document.getElementById('game');
  if (!cv || !cv.getBoundingClientRect || typeof addEventListener === 'undefined') return;
  function over(e) { // on the credits line, while the title screen is showing
    var h = creditsHit;
    if (!h || Date.now() - h.t > 300) return false;
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    var x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
    return x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h;

  addEventListener('pointerup', function (e) {
    if (e.button > 0 || !over(e)) return;
    try { window.open(CREDITS.profile, '_blank', 'noopener'); } catch (err) { /* pop-ups blocked */ }
  });
  var hovering = false, saved = '';
  addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var on = over(e);
    if (on === hovering) return;
    hovering = on;
    if (on) { saved = cv.style.cursor; cv.style.cursor = 'pointer'; } else cv.style.cursor = saved;
  }, { passive: true });
})();

// Full screen on phones and tablets. Browsers only allow it after a tap, so the first tap in the
// game hides the address bar and the system bars, and turns the game sideways where the phone
// allows it. Swiping back leaves full screen; the next tap returns to it. Mouse players keep their window.
(function () {
  var el = typeof document !== 'undefined' && document.documentElement;
  if (!el || typeof addEventListener === 'undefined') return;
  var request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!request) return;
  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement) ||
      !!(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
  }
  addEventListener('pointerup', function (e) {
    if (e.pointerType === 'mouse' || isFull()) return;
    try {
      var p = request.call(el, { navigationUI: 'hide' });
      if (p && p.then) {
        p.then(function () {
          var o = screen.orientation;
          if (o && o.lock) o.lock('landscape').catch(function () {});
        }, function () {});
      }
    } catch (err) { /* not allowed here: the game still works in the window */ }
  }, { passive: true });
})();

// Offline play: Zuzu's service worker saves every game. It needs http(s), so it is skipped
// when the file is opened straight from disk.
if (typeof navigator !== 'undefined' && navigator.serviceWorker && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
}
</script>
