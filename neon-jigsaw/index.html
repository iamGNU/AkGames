<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Jigsaw</title>
<meta name="author" content="Akash (developer), Claude Code (co-developer)">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #turn { display: none; position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px; text-align: center;
    font: 600 15px system-ui, sans-serif; color: #e8f0ff; background: rgba(10, 14, 32, 0.88); pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: block; } }
</style>
</head>
<body>
<div id="turn">↻ Turn your phone sideways for a bigger view</div>
<canvas id="game" width="960" height="540"></canvas>
<script>
'use strict';

// ============================================================
// 1. Settings (tweak these to change how the game feels)
// ============================================================
const CREDITS = { developer: 'Akash', coDeveloper: 'Claude Code', dedication: 'Shubu, Tuktuk and Aryan', profile: 'https://www.linkedin.com/in/iamGnu/' };
const W = 960, H = 540, TAU = Math.PI * 2;
const TOP = 56;                                          // height of the HUD band at the top
const BW = 544, BH = 306;                                // the board (and every picture) is 544 x 306
const BX = (W - BW) / 2, BY = Math.round(TOP + (H - TOP - BH) / 2);
const QS = new URLSearchParams(location.search);
const SHOW_FPS = QS.has('fps');
const LOW_RES = QS.has('low');
const SANS = 'system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif';
const MONO = 'ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace';
const SAVE_KEY = 'neonJigsaw.save';

const CFG = {
  snap: { frac: 0.35, min: 16 },    // a dropped piece locks within 35% of its short side (at least 16 px) of its spot
  near: 2.2,                         // its spot starts to glow within this many snap distances
  ghost: [0, 0.22, 0.42],            // ghost picture opacity: Off, Faint, Clear
  cursor: { stick: 640, keys: 240, keysMax: 560, ramp: 0.6 }, // controller / keyboard cursor speed in px per second
  lift: 0.12,                        // seconds for a touched piece to rise above the finger
  glide: 16,                         // how quickly moved pieces glide into place (higher is snappier)
  finale: { fade: 1.2, card: 2.8 },  // seconds: the seams fade, then the card appears
  color: {
    text: '#e8f0ff', dim: '#8390bd', faint: '#56608a', title: '#ff8f9c', good: '#7dffc0', warn: '#ffd88a', cool: '#8fd8ff',
  },
};
const C = CFG.color;
// Piece counts. Every size keeps the 16:9 board, so pieces stay close to square.
const SIZES = [
  { n: 12, cols: 4, rows: 3 },
  { n: 24, cols: 6, rows: 4 },
  { n: 48, cols: 8, rows: 6 },
  { n: 70, cols: 10, rows: 7 },
];
// Picture kinds. Each is painted fresh from a seed (see section 3); accent is the glow on loose pieces.
const THEMES = [
  { name: 'Aurora', accent: '#6dffc0', paint: paintAurora },
  { name: 'Mandala', accent: '#ffb86b', paint: paintMandala },
  { name: 'Night city', accent: '#ff7ad9', paint: paintCity },
  { name: 'Ocean sunset', accent: '#ff9f6b', paint: paintOcean },
  { name: 'Koi pond', accent: '#5ff2e0', paint: paintKoi },
  { name: 'Flower field', accent: '#ffd166', paint: paintFlowers },
];
const GHOST_LABEL = ['Off', 'Faint', 'Clear'];
const PALETTE = ['#ff8f9c', '#8fd8ff', '#ffd166', '#7dffb0', '#c38bff', '#ffffff'];   // sparkle colours ([6] = theme accent)
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98]; // C major pentatonic

// ============================================================
// Helpers
// ============================================================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function radial(x, y, dz, out) {
  const m = Math.hypot(x, y);
  if (m < dz) { out.x = 0; out.y = 0; out.m = 0; return out; }
  const n = Math.min(1, (m - dz) / (1 - dz));
  out.x = (x / m) * n; out.y = (y / m) * n; out.m = n;
  return out;
}
function load(key, def) { try { const v = localStorage.getItem(key); return v == null ? def : v; } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) { /* storage blocked: ignore */ } }
function forget(key) { try { localStorage.removeItem(key); } catch (e) { /* storage blocked: ignore */ } }
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);  // smooth in and out
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function hsl(h, s, l, a = 1) { return `hsla(${(((h % 360) + 360) % 360).toFixed(1)},${s}%,${l}%,${a})`; }
const nowMs = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
// Seeded random numbers, so the same seed always paints the same picture and cuts the same pieces
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rf = (rnd, a, b) => a + rnd() * (b - a);
const pick = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
const newSeed = old => { let s; do { s = 1 + Math.floor(Math.random() * 99999); } while (s === old); return s; };

class Pool {
  constructor(n, make) {
    this.items = [];
    for (let i = 0; i < n; i++) { const o = make(); o.active = false; this.items.push(o); }
    this.next = 0;
  }
  get() {
    const a = this.items, n = a.length;
    for (let k = 0; k < n; k++) {
      const i = (this.next + k) % n;
      if (!a[i].active) { this.next = (i + 1) % n; a[i].active = true; return a[i]; }
    }
    return null;
  }
  clear() { for (const o of this.items) o.active = false; }
}

// ============================================================
// Canvas + art (background, sparkles and decorations are drawn once into caches)
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let rs = 1;
let bgCanvas = null, sweepSprite = null, seamsSprite = null;
let dotSprites = [], decorSprites = [];
const PREV = { x: 516, y: 136, w: 384, h: 216 };      // title screen picture preview

function layer(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * rs); c.height = Math.ceil(h * rs);
  const g = c.getContext('2d');
  g.setTransform(rs, 0, 0, rs, 0, 0);
  return { c, g };
}

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  const dpr = window.devicePixelRatio || 1;
  const nrs = LOW_RES ? 1 : clamp(s * dpr, 1, 1.5);
  const changed = nrs !== rs || !bgCanvas;
  rs = nrs;
  canvas.width = Math.round(W * rs);
  canvas.height = Math.round(H * rs);
  if (changed) buildArt();
}

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function drawDot(col) {
  const { c, g } = layer(24, 24);
  const rg = g.createRadialGradient(12, 12, 0, 12, 12, 12);
  rg.addColorStop(0, 'rgba(255,255,255,0.95)'); rg.addColorStop(0.25, hexA(col, 0.85)); rg.addColorStop(1, hexA(col, 0));
  g.fillStyle = rg; g.fillRect(0, 0, 24, 24);
  return c;
}

function buildArt() {
  // Background: deep blue gradient with a few soft colour clouds
  let L = layer(W, H), g = L.g;
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#05070f'); grad.addColorStop(1, '#0a0d1c');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (const [x, y, r, col, a] of [[120, 120, 300, '#3a5cff', 0.09], [850, 430, 320, '#ff5f7a', 0.06], [880, 70, 220, '#20c0d0', 0.06], [80, 480, 240, '#a64dff', 0.06]]) {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, hexA(col, a)); rg.addColorStop(1, hexA(col, 0));
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  bgCanvas = L.c;
  dotSprites = [...PALETTE, puz ? puz.accent : '#ffffff'].map(drawDot);
  // A soft band of light that sweeps across a finished picture
  L = layer(140, 8); g = L.g;
  const sw = g.createLinearGradient(0, 0, 140, 0);
  sw.addColorStop(0, 'rgba(255,255,255,0)'); sw.addColorStop(0.5, 'rgba(255,245,230,0.75)'); sw.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sw; g.fillRect(0, 0, 140, 8);
  sweepSprite = L.c;
  // Glowing piece outlines that drift behind the title menu
  decorSprites = [];
  for (let i = 0; i < 6; i++) {
    const geo = makeGeometry(3, 3, 60, 60, mulberry32(i * 17 + 3)), p = geo.pieces[4];
    L = layer(120, 120); g = L.g;
    tracePiece(g, p, 30, 30);
    g.fillStyle = hexA(PALETTE[i], 0.07); g.fill();
    g.lineJoin = 'round'; g.strokeStyle = PALETTE[i];
    g.globalAlpha = 0.22; g.lineWidth = 6; g.stroke();
    g.globalAlpha = 1; g.lineWidth = 1.8; g.stroke();
    decorSprites.push(L.c);
  }
  // Jigsaw seams laid over the title preview
  const geo = makeGeometry(6, 4, PREV.w / 6, PREV.h / 4, mulberry32(99));
  L = layer(PREV.w, PREV.h); g = L.g;
  g.beginPath();
  for (const row of geo.hE) for (const e of row) traceEdge(g, e);
  for (const row of geo.vE) for (const e of row) traceEdge(g, e);
  g.strokeStyle = 'rgba(5,7,15,0.5)'; g.lineWidth = 2.4; g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.32)'; g.lineWidth = 1; g.stroke();
  seamsSprite = L.c;
  picCache.clear();
  if (puz) rebuildPuzzleArt(puz);
}

// ============================================================
// 2. Piece shapes: classic tabs and blanks made of bezier curves
// ============================================================
// One shared edge from (x0,y0) to (x1,y1), bulging along the normal (nx,ny). Returns 10 points (20 numbers) in
// world space: the start, then three cubic curves. Both neighbours trace these exact points (one of them backwards),
// so a tab always fits its blank perfectly.
function makeEdge(rnd, x0, y0, x1, y1, nx, ny, m) {
  const L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L;
  const X = L * rf(rnd, 0.44, 0.56), t = m * 0.1 * rf(rnd, 0.9, 1.08);
  const j = () => rf(rnd, -0.02, 0.02) * m;
  const a = j(), c = j(), d = j(), e = j();
  const P = [0, 0, L * 0.22, a, X + d, -t + c, X - t, t + c, X - 2 * t - d, 3 * t + c,
    X + 2 * t - d, 3 * t + c, X + t, t + c, X + d, -t + c, L * 0.78, e, L, 0];
  const out = new Float64Array(20);
  for (let i = 0; i < 10; i++) {
    const u = P[i * 2], v = P[i * 2 + 1];
    out[i * 2] = x0 + ux * u + nx * v;
    out[i * 2 + 1] = y0 + uy * u + ny * v;
  }
  out[0] = x0; out[1] = y0; out[18] = x1; out[19] = y1;
  return out;
}

// Appends one curved side (relative to the piece's top-left corner) to a command list
function sideCmds(out, e, rev, ox, oy) {
  out.push(1);
  if (!rev) for (let k = 1; k < 10; k++) out.push(e[k * 2] - ox, e[k * 2 + 1] - oy);
  else for (let k = 8; k >= 0; k--) out.push(e[k * 2] - ox, e[k * 2 + 1] - oy);
}

// A piece outline as a polygon (for hit tests)
function flatten(a) {
  const pts = [0, 0];
  let x = 0, y = 0, i = 0;
  while (i < a.length) {
    if (a[i] === 0) { x = a[i + 1]; y = a[i + 2]; pts.push(x, y); i += 3; continue; }
    for (let k = 0; k < 3; k++) {
      const q = i + 1 + k * 6;
      const c1x = a[q], c1y = a[q + 1], c2x = a[q + 2], c2y = a[q + 3], ex = a[q + 4], ey = a[q + 5];
      for (let s = 1; s <= 6; s++) {
        const t = s / 6, u = 1 - t;
        pts.push(u * u * u * x + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * ex,
          u * u * u * y + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * ey);
      }
      x = ex; y = ey;
    }
    i += 19;
  }
  pts.length -= 2; // the last point is the start again
  return new Float32Array(pts);
}

function pointInPoly(poly, x, y) {
  let inside = false;
  for (let i = 0, j = poly.length - 2; i < poly.length; j = i, i += 2) {
    const xi = poly[i], yi = poly[i + 1], xj = poly[j], yj = poly[j + 1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// Cuts a cols x rows grid. sides = [top, right, bottom, left]: 0 flat, 1 tab (sticks out), -1 blank (cut in).
function makeGeometry(cols, rows, cw, ch, rnd) {
  const m = Math.min(cw, ch);
  const hs = [], vs = [], hE = [], vE = [];
  for (let r = 0; r < rows - 1; r++) {     // edges between row r and r + 1 (s = 1: the tab points down)
    hs.push([]); hE.push([]);
    for (let c = 0; c < cols; c++) {
      const s = rnd() < 0.5 ? 1 : -1;
      hs[r].push(s);
      hE[r].push(makeEdge(rnd, c * cw, (r + 1) * ch, (c + 1) * cw, (r + 1) * ch, 0, s, m));
    }
  }
  for (let r = 0; r < rows; r++) {         // edges between column c and c + 1 (s = 1: the tab points right)
    vs.push([]); vE.push([]);
    for (let c = 0; c < cols - 1; c++) {
      const s = rnd() < 0.5 ? 1 : -1;
      vs[r].push(s);
      vE[r].push(makeEdge(rnd, (c + 1) * cw, r * ch, (c + 1) * cw, (r + 1) * ch, s, 0, m));
    }
  }
  const pieces = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ox = c * cw, oy = r * ch, cmds = [];
      const sides = [r === 0 ? 0 : -hs[r - 1][c], c === cols - 1 ? 0 : vs[r][c], r === rows - 1 ? 0 : hs[r][c], c === 0 ? 0 : -vs[r][c - 1]];
      if (r === 0) cmds.push(0, cw, 0); else sideCmds(cmds, hE[r - 1][c], false, ox, oy);
      if (c === cols - 1) cmds.push(0, cw, ch); else sideCmds(cmds, vE[r][c], false, ox, oy);
      if (r === rows - 1) cmds.push(0, 0, ch); else sideCmds(cmds, hE[r][c], true, ox, oy);
      if (c === 0) cmds.push(0, 0, 0); else sideCmds(cmds, vE[r][c - 1], true, ox, oy);
      const poly = flatten(cmds);
      let bx0 = 0, by0 = 0, bx1 = cw, by1 = ch;
      for (let i = 0; i < poly.length; i += 2) {
        bx0 = Math.min(bx0, poly[i]); bx1 = Math.max(bx1, poly[i]);
        by0 = Math.min(by0, poly[i + 1]); by1 = Math.max(by1, poly[i + 1]);
      }
      pieces.push({ id: r * cols + c, r, c, sides, edge: sides.includes(0), cmds, poly, bx0, by0, bx1, by1 });
    }
  }
  return { cols, rows, cw, ch, m, hs, vs, hE, vE, pieces };
}

function tracePiece(g, p, x, y) {
  const a = p.cmds;
  g.beginPath();
  g.moveTo(x, y);
  let i = 0;
  while (i < a.length) {
    if (a[i] === 0) { g.lineTo(x + a[i + 1], y + a[i + 2]); i += 3; continue; }
    for (let k = 0; k < 3; k++) {
      const q = i + 1 + k * 6;
      g.bezierCurveTo(x + a[q], y + a[q + 1], x + a[q + 2], y + a[q + 3], x + a[q + 4], y + a[q + 5]);
    }
    i += 19;
  }
  g.closePath();
}
function traceEdge(g, e) {
  g.moveTo(e[0], e[1]);
  for (let k = 0; k < 3; k++) { const q = 2 + k * 6; g.bezierCurveTo(e[q], e[q + 1], e[q + 2], e[q + 3], e[q + 4], e[q + 5]); }
}

// ============================================================
// 3. Pictures: each one is painted from a seed into an offscreen canvas (BW x BH)
// ============================================================
function vgrad(g, y0, y1, stops) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  return gr;
}
function glow(g, x, y, r, c0, c1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function neon(g, col, w, a = 1) { // the painters' glow stroke: a wide faint line under a thin bright one
  g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = col;
  g.globalAlpha = a * 0.22; g.lineWidth = w * 3.5; g.stroke();
  g.globalAlpha = a; g.lineWidth = w; g.stroke();
  g.globalAlpha = 1;
}
function stars(g, rnd, n, y1, a0, a1) {
  g.fillStyle = '#e6eeff';
  for (let i = 0; i < n; i++) {
    const s = rnd() < 0.1 ? 1.7 : rf(rnd, 0.6, 1.2);
    g.globalAlpha = rf(rnd, a0, a1);
    g.fillRect(rnd() * BW, rnd() * y1, s, s);
  }
  g.globalAlpha = 1;
}
// A mountain range: alternating peaks and valleys with a little jitter between them. Returns [x, y, x, y, ...].
function peaks(rnd, base, hi, step) {
  const key = [];
  let x = -rf(rnd, 0, step), up = rnd() < 0.5;
  while (x < BW + step) {
    key.push(x, base - (up ? hi * rf(rnd, 0.5, 1) : hi * rf(rnd, 0.05, 0.35)));
    x += rf(rnd, step * 0.55, step * 1.3); up = !up;
  }
  const pts = [];
  for (let i = 0; i < key.length - 2; i += 2) {
    const x0 = key[i], y0 = key[i + 1], x1 = key[i + 2], y1 = key[i + 3];
    pts.push(x0, y0);
    for (let k = 1; k < 4; k++) { const t = k / 4; pts.push(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + rf(rnd, -2.5, 2.5)); }
  }
  pts.push(key[key.length - 2], key[key.length - 1]);
  return pts;
}

function paintAurora(g, rnd, cv) {
  const w = BW, h = BH, hz = Math.round(h * rf(rnd, 0.7, 0.75));
  const sky = vgrad(g, 0, hz, [[0, '#030716'], [0.5, '#071a38'], [1, '#0e3a52']]);
  g.fillStyle = sky; g.fillRect(0, 0, w, hz);
  stars(g, rnd, 170, hz * 0.85, 0.25, 0.9);
  for (let i = 0; i < 6; i++) {
    const x = rnd() * w, y = rnd() * hz * 0.6;
    glow(g, x, y, 7, 'rgba(207,224,255,0.5)', 'rgba(207,224,255,0)');
    g.fillStyle = '#ffffff'; g.fillRect(x - 0.9, y - 0.9, 1.8, 1.8);
  }
  // a crescent moon
  const left = rnd() < 0.5, mx = left ? rf(rnd, 40, 110) : rf(rnd, w - 110, w - 40), my = rf(rnd, 34, 58);
  glow(g, mx, my, 54, 'rgba(188,214,255,0.2)', 'rgba(188,214,255,0)');
  g.fillStyle = '#f1f6ff'; g.beginPath(); g.arc(mx, my, 14, 0, TAU); g.fill();
  g.fillStyle = sky; g.beginPath(); g.arc(mx + (left ? 6 : -6), my - 4, 12.5, 0, TAU); g.fill();
  // aurora curtains: thin vertical strips that wave across the sky
  g.globalCompositeOperation = 'lighter';
  const sets = [['#4dffb0', '#3a8bff'], ['#7dff8a', '#b07dff'], ['#38f0e0', '#ff6fcf']];
  for (let k = 0; k < 3; k++) {

// Paints a picture, then a soft left-to-right tint so every part of it has its own tone
function paintPicture(themeI, seed) {
  const { c, g } = layer(BW, BH);
  const rnd = mulberry32(seed * 131 + themeI * 977 + 1);
  g.save();
  THEMES[themeI].paint(g, rnd, c);
  g.restore();
  const hue = rnd() * 360, gr = g.createLinearGradient(0, 0, BW, 0);
  gr.addColorStop(0, hsl(hue, 90, 60, 0.07)); gr.addColorStop(0.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, hsl(hue + 140, 90, 60, 0.07));
  g.fillStyle = gr; g.fillRect(0, 0, BW, BH);

}
const picCache = new Map();   // a few recent pictures (title preview, saved puzzle, current puzzle)
function getPicture(themeI, seed) {
  const key = themeI + ':' + seed + ':' + rs;
  let c = picCache.get(key);
  if (!c) {
    c = paintPicture(themeI, seed);
    picCache.set(key, c);
    if (picCache.size > 3) picCache.delete(picCache.keys().next().value);
  }
  return c;
}

// ============================================================
// 4. The puzzle: pieces, their sprites and the board
// ============================================================
let puz = null;

function buildPuzzle(themeI, seed, n, picture) {
  const sz = SIZES.find(s => s.n === n) || SIZES[1];
  const t0 = nowMs();
  picture = picture || getPicture(themeI, seed);
  const t1 = nowMs();
  const geo = makeGeometry(sz.cols, sz.rows, BW / sz.cols, BH / sz.rows, mulberry32(seed * 7919 + sz.n));
  const P = {
    theme: themeI, seed, n: sz.n, cols: sz.cols, rows: sz.rows, cw: geo.cw, ch: geo.ch, m: geo.m, geo,
    pieces: geo.pieces, picture, pad: Math.ceil(geo.m * 0.32 + 10), tol: Math.max(CFG.snap.min, CFG.snap.frac * geo.m),
    order: [], settling: [], placed: 0, complete: false, board: null, boardG: null, accent: THEMES[themeI].accent, timing: null,
  };
  for (const p of P.pieces) {
    p.tx = BX + p.c * P.cw; p.ty = BY + p.r * P.ch;
    p.x = p.tx; p.y = p.ty; p.ox = 0; p.oy = 0; p.locked = false;
    p.sprite = renderSprite(P, p);
  }
  P.order = P.pieces.slice();
  P.timing = { picture: t1 - t0, pieces: nowMs() - t1 };
  dotSprites[6] = drawDot(P.accent);
  return P;
}

// The picture inside a piece's outline, with a soft bevel and a rim
function drawPieceBody(g, P, p, x, y, loose) {
  const pad = P.pad, cw = P.cw, ch = P.ch, k = P.picture.width / BW;
  const sx0 = Math.max(0, p.c * cw - pad), sy0 = Math.max(0, p.r * ch - pad);
  const sx1 = Math.min(BW, (p.c + 1) * cw + pad), sy1 = Math.min(BH, (p.r + 1) * ch + pad);
  g.save();
  tracePiece(g, p, x, y); g.clip();
  g.drawImage(P.picture, sx0 * k, sy0 * k, (sx1 - sx0) * k, (sy1 - sy0) * k, x - p.c * cw + sx0, y - p.r * ch + sy0, sx1 - sx0, sy1 - sy0);

  g.translate(1.4, 1.4); tracePiece(g, p, x, y); g.strokeStyle = loose ? 'rgba(255,255,255,0.34)' : 'rgba(255,255,255,0.2)'; g.stroke();
  g.translate(-2.8, -2.8); tracePiece(g, p, x, y); g.strokeStyle = loose ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.38)'; g.stroke();
  g.restore();
  tracePiece(g, p, x, y);
  g.lineJoin = 'round';
  if (loose) {
    g.strokeStyle = P.accent;
    g.globalAlpha = 0.25; g.lineWidth = 4; g.stroke();
    g.globalAlpha = 0.85; g.lineWidth = 1.2; g.stroke();
    g.globalAlpha = 1;
  } else { g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1; g.stroke(); }
}

// Each loose piece is drawn once into its own small canvas (shadow, picture, bevel, glow)
function renderSprite(P, p) {
  const pad = P.pad, { c, g } = layer(P.cw + pad * 2, P.ch + pad * 2);
  if (!LOW_RES) {
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 7 * rs; g.shadowOffsetX = 2 * rs; g.shadowOffsetY = 3.5 * rs;
    tracePiece(g, p, pad, pad); g.fillStyle = '#04060d'; g.fill();
    g.restore();
  }
  drawPieceBody(g, P, p, pad, pad, true);
  return c;
}

// The board layer: panel, ghost picture and every locked piece. Each frame draws it once, then the loose pieces.
function bakeBoard(P) {
  const { c, g } = layer(BW + 40, BH + 40);
  g.translate(20, 20);
  rr(g, -8, -8, BW + 16, BH + 16, 14); g.fillStyle = 'rgba(8,11,26,0.92)'; g.fill();
  g.fillStyle = 'rgba(120,150,255,0.05)'; g.fillRect(0, 0, BW, BH);
  if (P.complete && G.baked) g.drawImage(P.picture, 0, 0, BW, BH);
  else {
    if (ghost) { g.globalAlpha = CFG.ghost[ghost]; g.drawImage(P.picture, 0, 0, BW, BH); g.globalAlpha = 1; }
    for (const p of P.pieces) if (p.locked && !P.settling.includes(p)) drawPieceBody(g, P, p, p.c * P.cw, p.r * P.ch, false);
  }

}
function bakePiece(P, p) { drawPieceBody(P.boardG, P, p, p.c * P.cw, p.r * P.ch, false); }

// After a resize the render scale may change: repaint at the new resolution
function rebuildPuzzleArt(P) {
  P.picture = getPicture(P.theme, P.seed);
  for (const p of P.pieces) p.sprite = p.locked && !P.settling.includes(p) ? null : renderSprite(P, p);
  bakeBoard(P);
}

// Spreads the loose pieces around the board: inside the screen, below the HUD, each centre off the board,
// picking (from a few random tries) the spot furthest from the pieces already placed.
function scatter(P) {
  const list = P.pieces.filter(p => !p.locked);
  for (let i = list.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = list[i]; list[i] = list[j]; list[j] = t; }
  const done = [], bx0 = BX - 2, by0 = BY - 2, bx1 = BX + BW + 2, by1 = BY + BH + 2;
  const onBoard = (cx, cy) => cx > bx0 && cx < bx1 && cy > by0 && cy < by1;
  for (const p of list) {
    const xmin = 4 - p.bx0, xmax = W - 4 - p.bx1, ymin = TOP + 4 - p.by0, ymax = H - 4 - p.by1;
    let best = null, bestD = -1;
    for (let k = 0; k < 28; k++) {
      let x = 0, y = 0, tries = 0;
      do { x = rand(xmin, xmax); y = rand(ymin, ymax); } while (tries++ < 100 && onBoard(x + P.cw / 2, y + P.ch / 2));
      if (onBoard(x + P.cw / 2, y + P.ch / 2)) continue;
      let d = 1e9;
      for (const q of done) { const dx = (q.x - x) / P.cw, dy = (q.y - y) / P.ch; d = Math.min(d, dx * dx + dy * dy); }
      if (d > bestD) { bestD = d; best = [x, y]; }
    }
    if (!best) best = [xmin, ymax];
    p.x = best[0]; p.y = best[1]; p.ox = 0; p.oy = 0;
    done.push(p);
  }
  P.order = list;
}

// ============================================================
// Sound: tiny WebAudio synth, no audio files. Soft sine bells only.
// ============================================================
const Sfx = {
  ctx: null, master: null, noiseBuf: null, muted: false, last: {},
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.3;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.6);
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (e) { /* no audio: game still works */ }
  },
  ok(key, gap) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return false;
    if (key) {
      const now = this.ctx.currentTime;
      if (now - (this.last[key] || 0) < gap) return false;
      this.last[key] = now;
    }
    return true;
  },
  // A note with a soft attack and a gentle fade (no clicks)
  tone(f1, f2, dur, type, vol, delay = 0, attack = 0.012) {
    const c = this.ctx, t = c.currentTime + delay;

    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, delay = 0) { // a soft airy swell
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  bell(f, vol, delay = 0, dur = 0.5) {
    this.tone(f, f, dur, 'sine', vol, delay);
    this.tone(f * 2, f * 2, dur * 0.45, 'sine', vol * 0.22, delay);
  },
  grab()  { if (this.ok('grab', 0.04)) this.tone(520, 640, 0.09, 'sine', 0.045); },
  drop()  { if (this.ok('grab', 0.04)) this.tone(560, 460, 0.1, 'sine', 0.04); },
  // A soft click, a gentle thump, and a bell that rises as the picture fills in
  snap(f) {
    if (!this.ok('snap', 0.03)) return;
    this.tone(1500, 1000, 0.035, 'triangle', 0.03);
    this.tone(220, 180, 0.09, 'sine', 0.05);
    this.bell(NOTES[clamp(Math.floor(f * NOTES.length), 0, NOTES.length - 1)], 0.07, 0.04, 0.7);
  },
  edges() { if (this.ok('edges', 0.2)) { this.tone(392, 587.33, 0.3, 'sine', 0.04); this.bell(783.99, 0.035, 0.14, 0.5); } },
  jump()  { if (this.ok('jump', 0.04)) this.tone(740, 880, 0.07, 'sine', 0.03); },
  nope()  { if (this.ok('nope', 0.12)) this.tone(330, 294, 0.14, 'sine', 0.035); },
  complete() {
    if (!this.ok()) return;
    [261.63, 329.63, 392, 493.88, 523.25, 659.25].forEach((f, i) => this.bell(f, 0.055, i * 0.12, 1.8));
    this.noise(1.8, 0.02, 900, 0.1);
  },
  tick()   { if (this.ok('tick', 0.03)) this.tone(880, 880, 0.05, 'sine', 0.03); },
  select() { if (this.ok()) { this.tone(660, 660, 0.09, 'sine', 0.05); this.tone(990, 990, 0.13, 'sine', 0.045, 0.06); } },
  blip()   { if (this.ok()) this.tone(600, 600, 0.08, 'sine', 0.04); },
  toggle() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.3;
  },
};

// ============================================================
// Input: gamepad + keyboard + mouse/touch merged into one state
// ============================================================
const NAV_CODES = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);

  keys: new Set(), pressed: new Set(), navKeys: new Set(),
  // One pointer (mouse, pen or finger) in world coordinates
  mouse: { x: W / 2, y: H / 2, clicked: false, released: false, moved: false, down: false, id: null, type: 'mouse' },
  pad: null, padIndex: null, prev: [], stickDir: 0, stickHold: 0,
  device: 'kb',     // 'kb', 'pad', 'mouse' or 'touch': whatever was used last
  ls: { x: 0, y: 0, m: 0 },
  act: false, pause: false, mute: false, select: false, back: false,
  navUp: false, navDown: false, navLeft: false, navRight: false,
  cycle: 0, edges: false, digX: 0, digY: 0,   // next/previous piece, edges to the front, held D-pad / arrows

  init() {
    addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
      if (!e.repeat) this.pressed.add(e.code === 'Tab' && e.shiftKey ? 'ShiftTab' : e.code);
      if (NAV_CODES.has(e.code)) this.navKeys.add(e.code);
      this.keys.add(e.code);
      this.device = 'kb';
      Sfx.init();
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.down = false; this.mouse.id = null; });
    canvas.addEventListener('pointerdown', e => {
      const m = this.mouse;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (m.down && m.id !== e.pointerId) return; // ignore a second finger
      e.preventDefault();
      this.toWorld(e);
      m.down = true; m.id = e.pointerId; m.clicked = true; m.moved = true;
      m.type = e.pointerType === 'mouse' ? 'mouse' : 'touch';
      this.device = m.type;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture not supported */ }
      Sfx.init();
    });
    canvas.addEventListener('pointermove', e => {
      const m = this.mouse;
      if (m.down && m.id !== e.pointerId) return;
      this.toWorld(e); m.moved = true;

      this.padIndex = e.gamepad.index; this.prev.length = 0; this.device = 'pad';
      showToast('Controller connected');
    });
    addEventListener('gamepaddisconnected', e => {

  },

  // Map a pointer event to the 960x540 world
  toWorld(e) {
    const r = canvas.getBoundingClientRect();

  },

  getPad() {

  poll(dt) {

    let mute = P.has('KeyM');
    let select = P.has('Enter') || P.has('Space');
    let back = P.has('Escape') || P.has('Backspace');
    let up = K.has('ArrowUp') || K.has('KeyW'), down = K.has('ArrowDown') || K.has('KeyS');

      const fresh = !prev.length;
      if (fresh) for (let i = 0; i < btns.length; i++) prev[i] = on(i);
      const tap = i => on(i) && !prev[i];
      radial(pad.axes[0] || 0, pad.axes[1] || 0, 0.2, this.ls);
      if (tap(0)) act = true;
      if (tap(9)) pause = true;
      if (tap(8)) mute = true;
      if (tap(0) || tap(9)) select = true;
      if (tap(1)) back = true;
      if (tap(5)) cycle = 1; else if (tap(4)) cycle = -1;   // RB / LB

      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;

      if (on(12)) dir = 1; else if (on(13)) dir = 2; else if (on(14)) dir = 3; else if (on(15)) dir = 4;
      else if (Math.abs(ay) > 0.6 && Math.abs(ay) >= Math.abs(ax)) dir = ay < 0 ? 1 : 2;
      else if (Math.abs(ax) > 0.6) dir = ax < 0 ? 3 : 4;
      let step = 0;
      if (fresh) { this.stickDir = dir; this.stickHold = 0; }
      else if (dir !== this.stickDir) { this.stickDir = dir; this.stickHold = 0; step = dir; }
      else if (dir) { this.stickHold += dt; if (this.stickHold > 0.35) { this.stickHold = 0.22; step = dir; } }

      if (any) Sfx.init();
    } else { this.ls.x = 0; this.ls.y = 0; this.ls.m = 0; }
    this.act = act; this.pause = pause; this.mute = mute; this.select = select; this.back = back;
    this.navUp = up; this.navDown = down; this.navLeft = left; this.navRight = right;
    this.cycle = cycle; this.edges = edges; this.digX = dx; this.digY = dy;
  },

  endFrame() {
    this.pressed.clear(); this.navKeys.clear();

  },

    ? { a: '✕', b: '○', y: '△', lb: 'L1', rb: 'R1', start: 'Options', select: 'Create' }
    : { a: 'A', b: 'B', y: 'Y', lb: 'LB', rb: 'RB', start: 'Start', select: 'Back' };
}
function shortId(id) {
  const s = String(id || '').replace(/\(.*$/, '').replace(/^[0-9a-f]{4}-[0-9a-f]{4}-/i, '').trim();

// ============================================================
// Game state
// ============================================================
let state = 'title', stateT = 0, time = 0;
let pausedFrom = 'play';
let themeIdx = clamp(Math.floor(Number(load('neonJigsaw.theme', 0))) || 0, 0, THEMES.length - 1);
let sizeIdx = SIZES.findIndex(s => s.n === Number(load('neonJigsaw.size', 24)));
if (sizeIdx < 0) sizeIdx = 1;
let ghost = Number(load('neonJigsaw.ghost', 1));
if (!(ghost === 0 || ghost === 1 || ghost === 2)) ghost = 1;
let solved = { 12: 0, 24: 0, 48: 0, 70: 0 };
try { const s = JSON.parse(load('neonJigsaw.solved', '{}')); for (const z of SIZES) solved[z.n] = Math.max(0, Math.floor(Number(s[z.n]) || 0)); } catch (e) { /* ignore */ }
let previewSeed = newSeed(0);
Sfx.muted = load('neonJigsaw.muted', '0') === '1';
const toast = { text: '', t: 0 };
let confirmId = '', confirmSel = -1;   // "press again" for actions that would lose progress

function showToast(text) { toast.text = text; toast.t = 2.2; }

let menuSel = 0;
const menuRects = [];
function setState(s) { state = s; stateT = 0; menuSel = 0; menuRects.length = 0; confirmId = ''; canvas.style.cursor = 'default'; }
function pauseGame() {
  releaseHeld();
  pausedFrom = state; setState('paused'); saveGame(); Sfx.blip();
}
function resumeGame() { state = pausedFrom; stateT = 0; Sfx.blip(); }
function toTitle() { saveGame(); releaseHeld(); clearFx(); setState('title'); }
function toggleSound() {
  Sfx.toggle();
  save('neonJigsaw.muted', Sfx.muted ? 1 : 0);
  showToast(Sfx.muted ? 'Sound off' : 'Sound on');
}
function cycleTheme(d) { themeIdx = (themeIdx + d + THEMES.length) % THEMES.length; save('neonJigsaw.theme', themeIdx); }
function cycleSize(d) { sizeIdx = (sizeIdx + d + SIZES.length) % SIZES.length; save('neonJigsaw.size', SIZES[sizeIdx].n); }
function cycleGhost(d) {
  ghost = (ghost + d + 3) % 3;
  save('neonJigsaw.ghost', ghost);
  if (puz && !puz.complete) bakeBoard(puz);
}
function askConfirm(id, msg) { confirmId = id; confirmSel = menuSel; showToast(msg); }

// ---- saving: the puzzle in progress is kept in one small JSON record ----
let savedInfo = null;   // { theme, seed, n, placed } of the saved puzzle, for the title screen
function readSave() {
  try {
    const d = JSON.parse(load(SAVE_KEY, 'null'));
    if (!d || d.v !== 1 || !THEMES[d.theme] || !SIZES.some(s => s.n === d.n) || !Number.isFinite(d.seed)) return null;
    if (!Array.isArray(d.p) || d.p.length !== d.n) return null;
    if (!d.p.every(a => Array.isArray(a) && Number.isFinite(a[0]) && Number.isFinite(a[1]))) return null;
    return d;
  } catch (e) { return null; }
}
function refreshSavedInfo() {
  const d = readSave();
  savedInfo = d ? { theme: d.theme, seed: d.seed, n: d.n, placed: d.p.filter(a => a[2]).length } : null;
}
function saveGame() {
  if (!puz || puz.complete) return;
  const data = {
    v: 1, theme: puz.theme, seed: puz.seed, n: puz.n,
    p: puz.pieces.map(p => [p.x, p.y, p.locked ? 1 : 0]),
    o: puz.order.map(p => p.id),
  };
  save(SAVE_KEY, JSON.stringify(data));
  savedInfo = { theme: puz.theme, seed: puz.seed, n: puz.n, placed: puz.placed };
}
function applySave(P, d) {
  P.placed = 0;
  P.pieces.forEach((p, i) => {
    const [x, y, l] = d.p[i];
    if (l) { p.locked = true; p.x = p.tx; p.y = p.ty; p.sprite = null; P.placed++; }
    else { p.x = x; p.y = y; clampPiece(P, p); }

// ============================================================
// 5. Play
// ============================================================
const G = {
  held: null,          // { p, offX, offY, fromX, fromY, via, tapHold, liftY, liftTarget }
  ptr: null,           // the current mouse / touch press: { x0, y0, moved, grabbed, p }
  hover: null, cycleId: -1, edgePulse: 0, finT: 0, baked: false, admire: false, doneK: 0,
  flashes: [], cur: { x: W / 2, y: H / 2 }, curOx: 0, curOy: 0, keyHold: 0,
};

function startPuzzle(themeI, seed, n, restore, picture) {
  Sfx.init();
  clearFx();
  Object.assign(G, {
    held: null, ptr: null, hover: null, cycleId: -1, edgePulse: 0, finT: 0, baked: false, admire: false, doneK: 0,
    flashes: [], cur: { x: BX + BW / 2, y: BY + BH / 2 }, curOx: 0, curOy: 0, keyHold: 0,
  });
  const P = buildPuzzle(themeI, seed, n, picture);
  puz = P;
  if (restore) applySave(P, restore); else scatter(P);
  bakeBoard(P);
  setState('play');
  saveGame();
}
function newPuzzle() {
  startPuzzle(themeIdx, previewSeed, SIZES[sizeIdx].n);
  previewSeed = newSeed(previewSeed);
}
function continueGame() {
  const d = readSave();
  if (!d) { savedInfo = null; showToast('No saved puzzle'); return; }
  startPuzzle(d.theme, d.seed, d.n, d);
}

const liftAmount = () => Math.min(48, puz.ch * 0.45 + 16);

function grab(p, x, y, via) {
  G.held = { p, offX: x - p.x, offY: y - p.y, fromX: p.x, fromY: p.y, via, tapHold: false, liftY: 0, liftTarget: 0 };
  G.cycleId = p.id;
  toTop(p);
  Sfx.grab();
}
function placeHeld(x, y) {
  const h = G.held, p = h.p;
  p.x = x - h.offX; p.y = y - h.offY;
  clampPiece(puz, p);
}
// Put the held piece down where it is; it locks if it is close enough to its spot
function dropHeld() {
  const h = G.held;
  if (!h) return;
  G.held = null;
  if (!trySnap(h.p)) Sfx.drop();
  saveGame();
}
// Put the held piece back where it was picked up
function cancelHeld() {
  const h = G.held;
  if (!h) return;
  G.held = null; G.ptr = null;
  const p = h.p;
  p.ox += p.x - h.fromX; p.oy += p.y - h.fromY; p.x = h.fromX; p.y = h.fromY;
  Sfx.drop();
}
function releaseHeld() { G.held = null; G.ptr = null; }   // let go without any checks (pause, quit)
// Tap-to-move: the held piece glides so its centre lands on the tapped point
function moveHeldTo(x, y) {
  const P = puz, p = G.held.p, ox = p.x, oy = p.y;
  p.x = x - P.cw / 2; p.y = y - P.ch / 2;
  clampPiece(P, p);
  p.ox += ox - p.x; p.oy += oy - p.y;
  dropHeld();
}

function trySnap(p) {
  const P = puz;
  if (Math.hypot(p.x - p.tx, p.y - p.ty) > P.tol) return false;
  lockPiece(p);
  return true;
}
function lockPiece(p) {
  const P = puz;
  p.locked = true;
  p.ox += p.x - p.tx; p.oy += p.y - p.ty;
  p.x = p.tx; p.y = p.ty;
  const i = P.order.indexOf(p);
  if (i >= 0) P.order.splice(i, 1);
  P.settling.push(p);
  P.placed++;
  if (G.cycleId === p.id) G.cycleId = -1;
  Sfx.snap(P.placed / P.n);

  const cx = p.tx + P.cw / 2, cy = p.ty + P.ch / 2;
  burst(cx, cy, 5, LOW_RES ? 5 : 10, 110, 0.7, 7);
  for (let k = 0; k < (LOW_RES ? 4 : 10); k++) {
    const j = (Math.random() * (p.poly.length / 2)) | 0;
    burst(p.tx + p.poly[j * 2], p.ty + p.poly[j * 2 + 1], 6, 1, 50, 0.6, 8);

}

// Every loose edge piece comes to the top of the pile and glows for a moment
function edgesFirst() {
  const P = puz;
  if (!P || P.complete) return;
  const edges = P.order.filter(p => p.edge);
  if (!edges.length) { showToast('All the edge pieces are in place'); Sfx.nope(); return; }
  P.order = P.order.filter(p => !p.edge).concat(edges);
  G.edgePulse = 1.6;
  Sfx.edges();
  showToast(edges.length === 1 ? 'The last edge piece is on top' : `${edges.length} edge pieces brought to the front`);
}

// LB / RB / Tab: the cursor glides to the next loose piece, going round the board clockwise
function cyclePieces(d) {
  const P = puz, list = P.order.slice();
  if (!list.length) return;
  const cx0 = BX + BW / 2, cy0 = BY + BH / 2;
  const ang = p => Math.atan2(p.y + P.ch / 2 - cy0, p.x + P.cw / 2 - cx0);
  list.sort((a, b) => ang(a) - ang(b) || a.id - b.id);
  let i = list.findIndex(p => p.id === G.cycleId), next;
  if (i >= 0) next = (i + d + list.length) % list.length;
  else {
    const a0 = Math.atan2(G.cur.y - cy0, G.cur.x - cx0);
    if (d > 0) { next = list.findIndex(p => ang(p) > a0); if (next < 0) next = 0; }
    else { next = list.length - 1; for (let k = list.length - 1; k >= 0; k--) if (ang(list[k]) < a0) { next = k; break; } }
  }
  const p = list[next];
  G.cycleId = p.id;
  toTop(p);
  const nx = p.x + P.cw / 2, ny = p.y + P.ch / 2;
  G.curOx += G.cur.x - nx; G.curOy += G.cur.y - ny;
  G.cur.x = nx; G.cur.y = ny;
  Sfx.jump();
}

// Controller stick, D-pad or arrow keys move a smooth cursor
function moveCursor(dt) {
  const I = Input;
  let vx = 0, vy = 0;
  if (I.ls.m > 0) { const f = CFG.cursor.stick * Math.pow(I.ls.m, 1.7) / I.ls.m; vx = I.ls.x * f; vy = I.ls.y * f; }
  if (I.digX || I.digY) {
    G.keyHold += dt;
    const sp = CFG.cursor.keys + (CFG.cursor.keysMax - CFG.cursor.keys) * clamp(G.keyHold / CFG.cursor.ramp, 0, 1);
    const n = Math.hypot(I.digX, I.digY);
    vx += (I.digX / n) * sp; vy += (I.digY / n) * sp;
  } else G.keyHold = 0;
  if (!vx && !vy) return false;
  G.cur.x = clamp(G.cur.x + vx * dt, 4, W - 4);
  G.cur.y = clamp(G.cur.y + vy * dt, 4, H - 4);
  return true;
}

const SOUND_BTN = { x: W - 108, y: 6, w: 44, h: 44 };
const PAUSE_BTN = { x: W - 56, y: 6, w: 44, h: 44 };
const EDGE_BTN = { x: W - 232, y: 6, w: 112, h: 44 };

// Mouse / touch: press and drag a piece, or tap it and then tap where it should go
function pointerDown(x, y, type) {
  G.ptr = { x0: x, y0: y, moved: false, grabbed: false, p: null };
  const h = G.held;
  if (h) {
    if (h.tapHold) {
      const hit = pieceAt(x, y, false);
      if (hit === h.p) { dropHeld(); G.ptr = null; return; }     // tap it again: put it down
      if (!hit) { moveHeldTo(x, y); G.ptr = null; return; }      // tap a spot: it glides there
      dropHeld();                                                // tap another piece: pick that one instead
    } else dropHeld();                                           // held by the controller: put it down first
  }
  const p = pieceAt(x, y, type === 'touch');
  if (p) { grab(p, x, y, type); G.ptr.grabbed = true; G.ptr.p = p; }
}
function pointerDrag(x, y, dt) {
  const h = G.held, pt = G.ptr;
  if (!pt.moved && Math.hypot(x - pt.x0, y - pt.y0) > 6) {
    pt.moved = true;
    if (h.via === 'touch') h.liftTarget = liftAmount();   // lift the piece above the finger
  }
  if (!pt.moved) return;
  if (h.liftY < h.liftTarget) h.liftY = Math.min(h.liftTarget, h.liftY + (h.liftTarget * dt) / CFG.lift);
  placeHeld(x, y - h.liftY);
}
function pointerUp() {
  const pt = G.ptr;
  G.ptr = null;
  if (!pt || !pt.grabbed || !G.held || G.held.p !== pt.p) return;
  if (pt.moved) dropHeld();
  else G.held.tapHold = true;   // a tap: the piece stays picked up until the next tap
}

function updatePlay(dt) {
  const P = puz, I = Input, m = I.mouse;
  let click = m.clicked;
  if (click && inRect(m, PAUSE_BTN)) { pauseGame(); return; }
  if (click && inRect(m, SOUND_BTN)) { toggleSound(); click = false; }
  if (click && inRect(m, EDGE_BTN)) { edgesFirst(); click = false; }
  stepPieces(dt);
  if (P.complete) { stepFinale(dt); return; }

  if (click) pointerDown(m.x, m.y, m.type);
  if (G.ptr && G.ptr.grabbed && G.held && m.down) pointerDrag(m.x, m.y, dt);
  if (m.released) pointerUp();
  if (m.moved && (I.device === 'mouse' || I.device === 'touch')) { G.cur.x = m.x; G.cur.y = m.y; G.curOx = G.curOy = 0; }

  moveCursor(dt);
  const h = G.held;
  if (h && !h.tapHold && (h.via === 'pad' || h.via === 'kb')) placeHeld(G.cur.x, G.cur.y);
  if (I.act) {
    if (G.held) dropHeld();
    else {
      const p = pieceAt(G.cur.x, G.cur.y, true);
      if (p) grab(p, G.cur.x, G.cur.y, I.device === 'pad' ? 'pad' : 'kb');
      else Sfx.nope();
    }
  }
  if (I.back && G.held) cancelHeld();
  if (I.cycle) { if (G.held) Sfx.nope(); else cyclePieces(I.cycle); }
  if (I.edges) edgesFirst();

  G.hover = null;
  if (!G.held) {
    if (I.device === 'mouse') G.hover = pieceAt(m.x, m.y, false);
    else if (I.device === 'pad' || I.device === 'kb') G.hover = pieceAt(G.cur.x, G.cur.y, true);
  }
  const cur = G.held ? 'grabbing' : G.hover ? 'grab' : 'default';
  if (canvas.style.cursor !== cur) canvas.style.cursor = cur;
  if (P.placed === P.n && !P.settling.length) startFinale();
}

// Glides, locked pieces settling into the board, and outline flashes
function stepPieces(dt) {
  const P = puz, k = Math.exp(-dt * CFG.glide);
  for (const p of P.pieces) {
    if (!p.ox && !p.oy) continue;
    p.ox *= k; p.oy *= k;
    if (Math.abs(p.ox) < 0.25 && Math.abs(p.oy) < 0.25) { p.ox = 0; p.oy = 0; }
  }
  for (let i = P.settling.length - 1; i >= 0; i--) {
    const p = P.settling[i];
    if (p.ox || p.oy) continue;
    P.settling.splice(i, 1);
    bakePiece(P, p);
    p.sprite = null;
    G.flashes.push({ p, t: 0.8 });
  }
  for (let i = G.flashes.length - 1; i >= 0; i--) { G.flashes[i].t -= dt; if (G.flashes[i].t <= 0) G.flashes.splice(i, 1); }
  G.curOx *= k; G.curOy *= k;
  if (Math.abs(G.curOx) < 0.25 && Math.abs(G.curOy) < 0.25) { G.curOx = 0; G.curOy = 0; }
  if (G.edgePulse > 0) G.edgePulse = Math.max(0, G.edgePulse - dt);
}

// The last piece is in: the seams fade, light sweeps across, then a gentle card
function startFinale() {
  const P = puz;
  P.complete = true; G.finT = 0; G.baked = false;
  G.held = null; G.ptr = null; G.hover = null;
  solved[P.n] = (solved[P.n] || 0) + 1;
  save('neonJigsaw.solved', JSON.stringify(solved));
  forget(SAVE_KEY);
  savedInfo = null;
  previewSeed = newSeed(previewSeed);
  canvas.style.cursor = 'default';
  Sfx.complete();
}
function stepFinale(dt) {
  const F = CFG.finale;
  G.finT += dt;
  if (!G.baked && G.finT >= F.fade) { G.baked = true; bakeBoard(puz); }
  if (G.finT > 0.4 && G.finT < 2.4 && Math.random() < dt * (LOW_RES ? 14 : 34)) {
    const t = Math.random() * 2 * (BW + BH);
    const x = t < BW ? BX + t : t < BW + BH ? BX + BW : t < 2 * BW + BH ? BX + (2 * BW + BH - t) : BX;
    const y = t < BW ? BY : t < BW + BH ? BY + (t - BW) : t < 2 * BW + BH ? BY + BH : BY + (2 * BW + 2 * BH - t);
    burst(x, y, (Math.random() * 7) | 0, 1, 40, 1.1, 9);
  }
  if (state === 'play' && G.finT >= F.card) setState('done');
}

// ============================================================
// Effects
// ============================================================
const parts = new Pool(LOW_RES ? 160 : 360, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, ci: 0, size: 6 }));
const rings = new Pool(32, () => ({ x: 0, y: 0, r0: 0, r1: 0, life: 0, max: 1, color: '#fff', w: 2 }));
const motes = [];
for (let i = 0; i < (LOW_RES ? 10 : 24); i++) {
  motes.push({ x: Math.random() * W, y: Math.random() * H, vx: rand(-6, 6), vy: rand(-12, -4), s: rand(6, 16), ph: Math.random() * TAU, ci: i % 6 });
}

function burst(x, y, ci, n, speed, life = 0.7, size = 7) {
  for (let i = 0; i < n; i++) {
    const p = parts.get();
    if (!p) return;
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.max = p.life = life * (0.5 + Math.random() * 0.5);
    p.ci = ci; p.size = size * (0.6 + Math.random() * 0.8);
  }
}
function ring(x, y, r0, r1, life, color, w = 2) {
  const o = rings.get();
  if (!o) return;
  o.x = x; o.y = y; o.r0 = r0; o.r1 = r1; o.life = o.max = life; o.color = color; o.w = w;
}
function clearFx() { parts.clear(); rings.clear(); }

function updateFx(dt) {
  const drag = Math.pow(0.08, dt);
  for (const p of parts.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.vx *= drag; p.vy = p.vy * drag + 20 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (const o of rings.items) {
    if (!o.active) continue;
    o.life -= dt;
    if (o.life <= 0) o.active = false;
  }
  for (const m of motes) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; }
    if (m.x < -20) m.x = W + 20; else if (m.x > W + 20) m.x = -20;
  }
}

// ============================================================
// Menus
// ============================================================
function soundItem() {
  return { id: 'sound', label: 'Sound', value: Sfx.muted ? 'Off' : 'On', cycle: () => toggleSound(), hint: 'Soft chimes on or off.' };
}
function ghostItem() {
  return { id: 'ghost', label: 'Ghost', value: GHOST_LABEL[ghost], cycle: d => cycleGhost(d), hint: 'A faint copy of the picture on the board, to guide you.' };
}
function titleItems() {
  const items = [];
  const replacing = savedInfo && savedInfo.placed > 0;
  if (savedInfo) {
    items.push({ id: 'continue', label: 'Continue', hint: 'Carry on where you left off.' });
  }
  items.push({ id: 'new', label: confirmId === 'new' ? 'New puzzle: press again' : 'New puzzle', hint: replacing ? 'Start the picture shown. It replaces your saved puzzle.' : 'Start a puzzle of the picture shown.' });
  items.push({ id: 'picture', label: 'Picture', value: THEMES[themeIdx].name, cycle: d => cycleTheme(d), hint: 'Choose the kind of picture.' });
  items.push({ id: 'reroll', label: 'New picture', hint: 'Paint a different picture of the same kind.' });
  items.push({ id: 'pieces', label: 'Pieces', value: String(SIZES[sizeIdx].n), cycle: d => cycleSize(d), hint: `How many pieces. Solved at ${SIZES[sizeIdx].n}: ${solved[SIZES[sizeIdx].n]}.` });
  items.push(ghostItem());
  items.push(soundItem());
  items.push({ id: 'howto', label: 'How to Play', hint: 'Controls and tips.' });
  items.push({ id: 'games', label: 'All Games', hint: 'Back to the game picker.' });
  return items;
}
function pauseItems() {
  return [
    { id: 'resume', label: 'Resume' },
    { id: 'restart', label: confirmId === 'restart' ? 'Restart: press again' : 'Restart' },
    { id: 'new', label: confirmId === 'new' ? 'New puzzle: press again' : 'New puzzle' },
    ghostItem(), soundItem(),
    { id: 'quit', label: 'Quit to menu' },
  ];
}
function doneItems() { return [{ id: 'next', label: 'New picture' }, { id: 'admire', label: 'Admire it' }, { id: 'menu', label: 'Main menu' }]; }

function menuInput(items) {
  const I = Input, m = I.mouse, n = items.length;
  if (menuSel >= n) menuSel = 0;
  if (I.navUp) { menuSel = (menuSel + n - 1) % n; Sfx.tick(); }
  if (I.navDown) { menuSel = (menuSel + 1) % n; Sfx.tick(); }
  if (m.moved || m.clicked) {
    for (let i = 0; i < n; i++) {
      const r = menuRects[i];
      if (r && inRect(m, r) && menuSel !== i) { menuSel = i; if (!m.clicked) Sfx.tick(); }
    }
  }
  const it = items[menuSel], r = menuRects[menuSel];
  const clickedItem = m.clicked && r && inRect(m, r);
  if (it.value !== undefined) {
    const d = (I.navRight ? 1 : 0) - (I.navLeft ? 1 : 0) || (I.select || clickedItem ? 1 : 0);
    if (d) { it.cycle(d); Sfx.tick(); return null; }
  }
  if (I.select || clickedItem) { Sfx.select(); return it.id; }
  return null;
}

// ============================================================
// Main update
// ============================================================
function update(dt) {
  time += dt; stateT += dt;
  if (toast.t > 0) toast.t -= dt;
  if (Input.mute) toggleSound();
  updateFx(dt);

  switch (state) {
    case 'title': {
      if (menuSel !== confirmSel) confirmId = '';
      const id = menuInput(titleItems());
      if (id === 'continue') continueGame();
      else if (id === 'new') {
        if (savedInfo && savedInfo.placed > 0 && confirmId !== 'new') askConfirm('new', 'Press again to replace your saved puzzle');
        else newPuzzle();
      } else if (id === 'reroll') previewSeed = newSeed(previewSeed);
      else if (id === 'howto') setState('howto');
      else if (id === 'games') location.href = '../index.html';
      break;
    }
    case 'howto':
      if (Input.back || Input.select || Input.mouse.clicked) {
        setState('title');
        menuSel = titleItems().findIndex(it => it.id === 'howto');
        Sfx.blip();
      }
      break;
    case 'play':
      // Esc puts back a held piece first; a second Esc pauses
      if (Input.pause && !(Input.back && G.held)) { pauseGame(); break; }
      updatePlay(dt);
      break;
    case 'paused': {
      if (Input.pause || Input.back) { resumeGame(); break; }
      if (menuSel !== confirmSel) confirmId = '';
      const id = menuInput(pauseItems());
      if (id === 'resume') resumeGame();
      else if (id === 'restart' || id === 'new') {
        if (puz.placed > 0 && confirmId !== id) askConfirm(id, id === 'restart' ? 'Press again to scatter every piece' : 'Press again for a new picture');
        else if (id === 'restart') startPuzzle(puz.theme, puz.seed, puz.n, null, puz.picture);
        else startPuzzle(puz.theme, newSeed(puz.seed), puz.n);
      } else if (id === 'quit') toTitle();
      break;
    }
    case 'done':
      stepPieces(dt);
      stepFinale(dt);
      G.doneK += ((G.admire ? 0 : 1) - G.doneK) * Math.min(1, dt * 6);
      if (G.admire) {
        if (Input.act || Input.back || Input.pause || Input.mouse.clicked) { G.admire = false; stateT = 0.6; Sfx.blip(); }
        break;
      }
      if (stateT > 0.6) {
        const id = menuInput(doneItems());
        if (id === 'next') startPuzzle(puz.theme, newSeed(puz.seed), puz.n);
        else if (id === 'admire') { G.admire = true; menuRects.length = 0; }
        else if (id === 'menu' || Input.back) toTitle();
      }
      break;
  }
}

// ============================================================
// Rendering
// ============================================================
function rrPath(x, y, w, h, r) { rr(ctx, x, y, w, h, r); }
function glowStroke(color, w) {
  const a = ctx.globalAlpha;
  ctx.strokeStyle = color;
  ctx.globalAlpha = a * 0.22; ctx.lineWidth = w * 3.5; ctx.stroke();
  ctx.globalAlpha = a; ctx.lineWidth = w; ctx.stroke();
}
function text(s, x, y, font, color) { ctx.font = font; ctx.fillStyle = color; ctx.fillText(s, x, y); }
function glowText(s, x, y, font, color) {
  const a = ctx.globalAlpha;
  ctx.font = font; ctx.lineJoin = 'round';
  ctx.globalAlpha = a * 0.22; ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.strokeText(s, x, y);
  ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrapText(s, x, y, maxW, lh, font, color) {
  ctx.font = font;
  let line = '', n = 0;
  for (const word of s.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (line && ctx.measureText(t).width > maxW) { text(line, x, y + n * lh, font, color); n++; line = word; } else line = t;
  }
  if (line) text(line, x, y + n * lh, font, color);
  return n + 1;
}
function overlay(alpha) { ctx.fillStyle = `rgba(3,5,10,${alpha})`; ctx.fillRect(0, 0, W, H); }

function drawMotes() {
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    ctx.globalAlpha = 0.13 + 0.1 * Math.sin(time * 0.9 + m.ph);
    ctx.drawImage(dotSprites[m.ci], m.x - m.s / 2, m.y - m.s / 2, m.s, m.s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function outline(p, x, y, color, w, a) {
  tracePiece(ctx, p, x, y);
  ctx.lineJoin = 'round';
  ctx.globalAlpha = a; glowStroke(color, w); ctx.globalAlpha = 1;
}

function renderBoard() {
  const P = puz, F = CFG.finale;
  ctx.drawImage(P.board, BX - 20, BY - 20, BW + 40, BH + 40);
  // the finished picture: the seams fade away, then a band of light sweeps across
  if (P.complete && !G.baked) {
    ctx.globalAlpha = ease(clamp(G.finT / F.fade, 0, 1));
    ctx.drawImage(P.picture, BX, BY, BW, BH);
    ctx.globalAlpha = 1;
  }
  if (P.complete && G.finT > 0.5 && G.finT < 2.1) {
    const t = (G.finT - 0.5) / 1.6;
    ctx.save();
    ctx.beginPath(); ctx.rect(BX, BY, BW, BH); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 * Math.sin(Math.PI * t);
    ctx.drawImage(sweepSprite, BX - 160 + (BW + 320) * t - 70, BY, 140, BH);
    ctx.restore();
  }
  const glowUp = P.complete ? clamp(G.finT / F.fade, 0, 1) : 0;
  rrPath(BX - 8, BY - 8, BW + 16, BH + 16, 14);
  ctx.globalAlpha = 0.45 + 0.1 * Math.sin(time * 0.8) + glowUp * (0.35 + 0.15 * Math.sin(time * 2));
  glowStroke(P.complete ? C.warn : C.title, 1.4 + glowUp * 1.4);
  ctx.globalAlpha = 1;
}

function drawSprite(P, p, s = 1) {
  const pad = P.pad, w = P.cw + pad * 2, h = P.ch + pad * 2;
  const x = p.x + p.ox - pad, y = p.y + p.oy - pad;
  if (s === 1) ctx.drawImage(p.sprite, x, y, w, h);
  else ctx.drawImage(p.sprite, x - (w * (s - 1)) / 2, y - (h * (s - 1)) / 2, w * s, h * s);
}

function renderPieces() {
  const P = puz, held = G.held ? G.held.p : null;
  for (const p of P.settling) drawSprite(P, p);
  for (const f of G.flashes) outline(f.p, f.p.tx, f.p.ty, P.accent, 1.8, f.t / 0.8);
  // a held piece close to its spot: the spot glows softly
  if (held) {
    const d = Math.hypot(held.x - held.tx, held.y - held.ty), near = CFG.near * P.tol;
    if (d < near) outline(held, held.tx, held.ty, C.warn, 1.4, 0.2 + 0.6 * (1 - d / near));
  }
  for (const p of P.order) if (p !== held) drawSprite(P, p);
  if (G.edgePulse > 0) {
    const a = Math.min(1, G.edgePulse) * (0.75 + 0.25 * Math.sin(time * 8));
    for (const p of P.order) if (p.edge && p !== held) outline(p, p.x + p.ox, p.y + p.oy, C.warn, 2.4, a);
  }
  if (G.hover && G.hover !== held && !P.complete) outline(G.hover, G.hover.x + G.hover.ox, G.hover.y + G.hover.oy, '#ffffff', 1.4, 0.6);
  if (held) {
    drawSprite(P, held, 1.04);
    const s = 1.04, cx = held.x + held.ox + P.cw / 2, cy = held.y + held.oy + P.ch / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
    outline(held, -P.cw / 2, -P.ch / 2, G.held.tapHold ? C.warn : '#ffffff', 1.3, 0.75 + 0.2 * Math.sin(time * 5));
    ctx.restore();
  }
}

function drawFx() {
  ctx.globalCompositeOperation = 'lighter';
  for (const o of rings.items) {
    if (!o.active) continue;
    const p = 1 - o.life / o.max;
    ctx.globalAlpha = (1 - p) * 0.85;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r0 + (o.r1 - o.r0) * easeOut(p), 0, TAU);
    glowStroke(o.color, o.w);
  }
  for (const p of parts.items) {
    if (!p.active) continue;
    ctx.globalAlpha = p.life / p.max;
    ctx.drawImage(dotSprites[p.ci] || dotSprites[5], p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawButton(r, icon) {
  const hover = Input.device === 'mouse' && inRect(Input.mouse, r);
  rrPath(r.x, r.y, r.w, r.h, 12);
  ctx.fillStyle = hover ? hexA(C.title, 0.16) : 'rgba(20,26,52,0.72)'; ctx.fill();
  ctx.globalAlpha = hover ? 1 : 0.55; glowStroke(C.title, 1.2); ctx.globalAlpha = 1;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.fillStyle = C.text; ctx.strokeStyle = C.text;
  if (icon === 'pause') { ctx.fillRect(cx - 7, cy - 9, 5, 18); ctx.fillRect(cx + 2, cy - 9, 5, 18); return; }
  if (icon !== 'sound') { // a text button
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    text(icon, cx, cy + 1, `700 15px ${SANS}`, C.text);
    return;
  }
  ctx.beginPath(); // speaker
  ctx.moveTo(cx - 11, cy - 4); ctx.lineTo(cx - 6, cy - 4); ctx.lineTo(cx, cy - 10);
  ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 6, cy + 4); ctx.lineTo(cx - 11, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
  if (Sfx.muted) { ctx.moveTo(cx + 4, cy - 5); ctx.lineTo(cx + 12, cy + 5); ctx.moveTo(cx + 12, cy - 5); ctx.lineTo(cx + 4, cy + 5); ctx.stroke(); }
  else { ctx.arc(cx + 2, cy, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 2, cy, 11, -0.9, 0.9); ctx.stroke(); }
  ctx.lineCap = 'butt';
}

function controlLines() {
  const NN = padNames();
  switch (Input.device) {
    case 'pad': return [`Stick: move  ·  ${NN.a}: pick up / put down  ·  ${NN.lb} ${NN.rb}: next piece`, `${NN.y}: edge pieces  ·  ${NN.b}: put it back  ·  ${NN.start}: pause`];
    case 'mouse': return ['Drag a piece to its spot on the board,', 'or click a piece, then click where it goes'];
    case 'touch': return ['Drag a piece to its spot on the board,', 'or tap a piece, then tap where it goes'];
    default: return ['Arrows: move  ·  Space: pick up / put down  ·  Tab: next piece', 'E: edge pieces  ·  Esc: put it back, or pause'];
  }
}
function edgeLabel() {
  const d = Input.device;
  return d === 'pad' ? `${padNames().y}: Edges` : d === 'kb' ? 'E: Edges' : 'Edges';
}

function drawHUD(buttons) {
  const P = puz;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  text(`${THEMES[P.theme].name}  ·  ${P.n} pieces`, 20, 19, `700 16px ${SANS}`, C.text);
  const f = P.placed / P.n;
  rrPath(20, 36, 150, 8, 4); ctx.fillStyle = 'rgba(131,144,189,0.2)'; ctx.fill();
  if (f > 0) { rrPath(20, 36, Math.max(8, 150 * f), 8, 4); ctx.fillStyle = C.title; ctx.fill(); }
  text(`${P.placed} / ${P.n}`, 180, 40, `700 14px ${MONO}`, C.dim);
  if (!buttons) return;
  ctx.textAlign = 'center';
  if (state === 'play') controlLines().forEach((s, i) => text(s, W / 2 + 4, 17 + i * 21, `500 13px ${SANS}`, i ? C.faint : C.dim));
  drawButton(EDGE_BTN, edgeLabel());
  drawButton(SOUND_BTN, 'sound');
  drawButton(PAUSE_BTN, 'pause');
}

function drawCursor() {
  const d = Input.device;
  if (d !== 'pad' && d !== 'kb') return;
  const x = G.cur.x + G.curOx, y = G.cur.y + G.curOy, held = !!G.held, col = held ? C.warn : '#ffffff';
  ctx.beginPath(); ctx.arc(x, y, held ? 8 : 13, 0, TAU);
  ctx.globalAlpha = 0.85 + 0.15 * Math.sin(time * 5); glowStroke(col, 2); ctx.globalAlpha = 1;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 2.5, 0, TAU); ctx.fill();
}

function renderPlay() {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawMotes();
  const k = state === 'done' ? clamp(G.doneK, 0, 1) : 0;   // the finished picture moves up into a frame above the card
  if (k > 0) {
    const s = 1 - 0.32 * k, cy = BY + BH / 2;
    ctx.save(); ctx.translate(W / 2, cy - 120 * k); ctx.scale(s, s); ctx.translate(-W / 2, -cy);
  }
  renderBoard();
  renderPieces();
  if (k > 0) ctx.restore();
  drawFx();
  drawHUD(state !== 'done');
  if (state === 'play' && !puz.complete) drawCursor();
}

function drawMenu(items, y0, enabled = true, gap = 52, cx = W / 2, w = 330) {
  menuRects.length = 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const h = 38;
  items.forEach((it, i) => {
    const y = y0 + i * gap, x = cx - w / 2, sel = enabled && i === menuSel;
    menuRects.push({ x, y: y - h / 2, w, h });
    if (sel) {
      rrPath(x, y - h / 2, w, h, h / 2);
      ctx.fillStyle = hexA(C.title, 0.1); ctx.fill();
      glowStroke(C.title, 1.5);
    }
    ctx.globalAlpha = enabled ? 1 : 0.4;
    const col = sel ? C.text : C.dim;
    if (it.value !== undefined) {
      text(it.label, cx - 52, y, `700 20px ${SANS}`, col);
      text(sel ? `‹ ${it.value} ›` : it.value, cx + 88, y, `700 16px ${SANS}`, sel ? C.warn : C.faint);
    } else {
      text(it.label, cx, y, `700 20px ${SANS}`, col);
    }

  });
}

function drawTitle() {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawMotes();
  // glowing piece outlines drifting slowly behind the menu
  for (let i = 0; i < 9; i++) {
    const x = ((i * 137 + time * (8 + (i % 3) * 4)) % (W + 200)) - 100;
    const y = 50 + ((i * 197) % 440) + Math.sin(time * 0.5 + i) * 14;
    const s = 84 + (i % 3) * 20;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(time * 0.2 + i * 2) * 0.4);
    ctx.globalAlpha = 0.2 + (i % 3) * 0.05;
    ctx.drawImage(decorSprites[i % decorSprites.length], -s / 2, -s / 2, s, s);
    ctx.restore();
  }

  const shade = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, 470);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('NEON JIGSAW', W / 2, 60, `800 58px ${SANS}`, C.title);

  const items = titleItems(), mcx = 262;

  const it = items[menuSel] || items[0];

  // the picture you'll get (or your saved one, while Continue is chosen)

  const pic = getPicture(th, sd);
  rrPath(PREV.x - 6, PREV.y - 6, PREV.w + 12, PREV.h + 12, 12);
  ctx.fillStyle = 'rgba(7,10,24,0.9)'; ctx.fill();
  ctx.globalAlpha = 0.7; glowStroke(cont ? C.warn : C.title, 1.4); ctx.globalAlpha = 1;

  text(cont ? `${savedInfo.placed} of ${savedInfo.n} pieces placed` : `${SIZES[sizeIdx].n} pieces  ·  solved at this size: ${solved[SIZES[sizeIdx].n]}`,
    pcx, PREV.y + PREV.h + 48, `500 14px ${SANS}`, C.dim);
  const lines = wrapText(it.hint, pcx, PREV.y + PREV.h + 82, 380, 20, `500 14px ${SANS}`, C.dim);
  const NN = padNames(), side = it.value !== undefined ? '   ·   ← → change' : '';
  const keys = Input.device === 'touch' ? 'Tap to choose'

    : usingPad() || Input.pad ? `↑ ↓ choose   ·   ${NN.a} select${side}` : `↑ ↓ choose   ·   Enter select${side}`;
  text(keys, pcx, PREV.y + PREV.h + 86 + lines * 20, `500 13px ${SANS}`, C.faint);

  const yb = H - 22, pad = Input.pad;
  ctx.beginPath(); ctx.arc(30, yb, 4, 0, TAU); ctx.fillStyle = pad ? C.good : C.warn; ctx.fill();
  ctx.textAlign = 'left';
  text(!navigator.getGamepads ? 'Controllers unavailable here' : pad ? shortId(pad.id) : 'Connect a controller, press any button',
    42, yb, `600 12px ${SANS}`, C.dim);
  ctx.textAlign = 'center';
  drawCreditsLink(text, yb, `500 12px ${SANS}`, C.dim);
  text(`Made with ♥ for ${CREDITS.dedication}`, W / 2, yb - 19, `600 12px ${SANS}`, '#ff9ee0');
  ctx.textAlign = 'right';
  text(`Solved  12·${solved[12]}  24·${solved[24]}  48·${solved[48]}  70·${solved[70]}`, W - 24, yb, `600 12px ${MONO}`, C.dim);
  if (!Sfx.muted && (!Sfx.ctx || Sfx.ctx.state !== 'running')) {
    text(Input.device === 'touch' ? 'tap for sound' : 'click for sound', W - 24, 22, `500 12px ${SANS}`, C.faint);
  }
}

  col('THE PUZZLE', 70, [

  ]);
  col('TIPS', 370, [

  col('PICTURES', 670, [

  ctx.textAlign = 'center';

// A calm card behind a menu so it never competes with the picture
function card(x, y, w, h) {
  rrPath(x, y, w, h, 24);
  ctx.fillStyle = 'rgba(7,10,24,0.94)'; ctx.fill();
  const a = ctx.globalAlpha;
  ctx.globalAlpha = a * 0.6; glowStroke(C.title, 1.2); ctx.globalAlpha = a;
}

function drawPause() {
  overlay(0.55);
  card(W / 2 - 240, 44, 480, 452);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  glowText('PAUSED', W / 2, 94, `800 44px ${SANS}`, C.text);
  text('Take your time. Your puzzle is saved.', W / 2, 134, `500 15px ${SANS}`, C.dim);
  drawMenu(pauseItems(), 184, true, 46);
  const NN = padNames();
  text(usingPad() ? `${NN.start}: resume   ·   ${NN.select}: sound` : Input.device === 'touch' ? 'Tap an option' : 'Esc: resume   ·   M: sound',
    W / 2, 466, `500 13px ${SANS}`, C.faint);
}

function drawDone() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (G.admire) {
    ctx.font = `600 14px ${SANS}`;
    const s = usingPad() ? `Press ${padNames().a} to continue` : Input.device === 'touch' ? 'Tap to continue' : 'Click or press Space to continue';
    const w = ctx.measureText(s).width + 36;
    rrPath(W / 2 - w / 2, H - 40, w, 28, 14); ctx.fillStyle = 'rgba(10,14,32,0.85)'; ctx.fill();
    text(s, W / 2, H - 26, `600 14px ${SANS}`, C.dim);
    return;
  }
  const P = puz, a = clamp(stateT * 3, 0, 1), off = (1 - easeOut(a)) * 40;
  ctx.globalAlpha = a;
  card(W / 2 - 230, 298 + off, 460, 232);
  glowText('Puzzle complete', W / 2, 332 + off, `800 34px ${SANS}`, C.title);
  text(`${THEMES[P.theme].name}  ·  ${P.n} pieces  ·  picture ${P.seed}`, W / 2, 366 + off, `500 15px ${SANS}`, C.dim);
  const k = solved[P.n];
  text(`You've finished ${k} ${k === 1 ? 'puzzle' : 'puzzles'} of ${P.n} pieces`, W / 2, 389 + off, `500 14px ${SANS}`, C.dim);
  drawMenu(doneItems(), 424 + off, stateT > 0.6, 36, W / 2, 300);
  ctx.globalAlpha = 1;
}

function drawToast() {
  if (toast.t <= 0) return;
  ctx.globalAlpha = Math.min(1, toast.t * 3);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `600 14px ${SANS}`;
  const y = state === 'play' ? H - 22 : H - 52, w = ctx.measureText(toast.text).width + 32;
  rrPath(W / 2 - w / 2, y - 14, w, 28, 14);
  ctx.fillStyle = 'rgba(10,14,32,0.92)'; ctx.fill();
  text(toast.text, W / 2, y, `600 14px ${SANS}`, C.text);
  ctx.globalAlpha = 1;
}

let fps = 60;
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(rs, 0, 0, rs, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'howto') drawHowTo();
  else if (puz) {
    renderPlay();
    if (state === 'paused') drawPause();
    if (state === 'done') drawDone();
  }
  drawToast();
  if (SHOW_FPS) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    text(`${Math.round(fps)} fps`, W - 12, H - 6, `600 12px ${MONO}`, C.good);
  }
}

// ============================================================
// Main loop
// ============================================================
let last = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (SHOW_FPS && dt > 0) fps += (1 / dt - fps) * 0.05;
  if (dt > 0.05) dt = 0.05;
  Input.poll(dt);
  update(dt);
  render();
  Input.endFrame();
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (state === 'play') pauseGame(); else saveGame();
});
addEventListener('pagehide', () => saveGame());
addEventListener('resize', resize);
refreshSavedInfo();
Input.init();
resize();
requestAnimationFrame(t => { last = t; frame(t); });

// Keep the screen on while someone is playing. The operating system only counts
// keyboard and mouse as activity, so during controller play it would switch the
// display off. After 5 minutes with no input at all the lock is let go, so a
// forgotten tab still lets the screen sleep.
(function () {
  if (typeof navigator === 'undefined' || !navigator.wakeLock) return;
  var IDLE_MS = 5 * 60 * 1000;
  var lock = null, asking = false, last = Date.now(), axes = [];
  function hold() {
    if (lock || asking || document.visibilityState !== 'visible') return;
    asking = true;
    navigator.wakeLock.request('screen').then(function (l) {
      asking = false;
      lock = l;
      l.addEventListener('release', function () { if (lock === l) lock = null; });
    }, function () { asking = false; });
  }
  function active() { last = Date.now(); hold(); }
  ['keydown', 'pointerdown', 'pointermove', 'wheel'].forEach(function (t) {
    addEventListener(t, active, { passive: true });
  });
  // The system drops the lock when the tab is hidden; take it again on return.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') active();
  });
  // Controllers fire no events for buttons or sticks, so look at them directly.
  setInterval(function () {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      if (!p) continue;
      var a = axes[i] || (axes[i] = []);
      for (var b = 0; b < p.buttons.length; b++) if (p.buttons[b].pressed) { active(); break; }
      for (var k = 0; k < p.axes.length; k++) {
        if (Math.abs(p.axes[k] - (a[k] || 0)) > 0.25) active();
        a[k] = p.axes[k];
      }
    }
    if (lock && Date.now() - last > IDLE_MS) {
      var l = lock;
      lock = null;
      l.release().catch(function () {});
    }
  }, 250);
  active();
})();

// The credits link to the developer's LinkedIn profile: "Akash" is underlined with a small "in"
// badge, and a click or tap on the credits line on the title screen opens the profile in a new tab.
let creditsHit = null;
function drawCreditsLink(draw, y, font, color) {
  const LINK = '#7cc4ff', a = 'Developer: ', b = CREDITS.developer, c = `  ·  Co-developer: ${CREDITS.coDeveloper}`;
  ctx.font = font;
  const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, wc = ctx.measureText(c).width;
  const badge = 14, gap = 5, total = wa + wb + gap + badge + wc, x0 = W / 2 - total / 2, align = ctx.textAlign;
  ctx.textAlign = 'left';
  draw(a, x0, y, font, color);
  draw(b, x0 + wa, y, font, LINK);
  ctx.fillStyle = LINK; ctx.fillRect(x0 + wa, y + 7, wb, 1);
  const bx = x0 + wa + wb + gap;
  ctx.fillStyle = '#0a66c2';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, y - badge / 2, badge, badge, 3); ctx.fill(); } else ctx.fillRect(bx, y - badge / 2, badge, badge);
  ctx.font = `800 10px ${SANS}`; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.fillText('in', bx + badge / 2, y + 0.5);
  ctx.textAlign = 'left';
  draw(c, bx + badge, y, font, color);
  ctx.textAlign = align;
  creditsHit = { x: x0 - 8, y: y - 13, w: total + 16, h: 26, t: Date.now() };
}
(function () {
  var cv = typeof document !== 'undefined' && document.getElementById('game');
  if (!cv || !cv.getBoundingClientRect || typeof addEventListener === 'undefined') return;
  function over(e) { // on the credits line, while the title screen is showing
    var h = creditsHit;
    if (!h || Date.now() - h.t > 300) return false;
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    var x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
    return x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h;
  }
  addEventListener('pointerup', function (e) {
    if (e.button > 0 || !over(e)) return;
    try { window.open(CREDITS.profile, '_blank', 'noopener'); } catch (err) { /* pop-ups blocked */ }
  });
  var hovering = false, saved = '';
  addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var on = over(e);
    if (on === hovering) return;
    hovering = on;
    if (on) { saved = cv.style.cursor; cv.style.cursor = 'pointer'; } else cv.style.cursor = saved;
  }, { passive: true });
})();

// Full screen on phones and tablets. Browsers only allow it after a tap, so the first tap in the
// game hides the address bar and the system bars, and turns the game sideways where the phone
// allows it. Swiping back leaves full screen; the next tap returns to it. Mouse players keep their window.
(function () {
  var el = typeof document !== 'undefined' && document.documentElement;
  if (!el || typeof addEventListener === 'undefined') return;
  var request = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!request) return;
  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement) ||
      !!(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
  }
  addEventListener('pointerup', function (e) {
    if (e.pointerType === 'mouse' || isFull()) return;
    try {
      var p = request.call(el, { navigationUI: 'hide' });
      if (p && p.then) {
        p.then(function () {
          var o = screen.orientation;
          if (o && o.lock) o.lock('landscape').catch(function () {});
        }, function () {});
      }
    } catch (err) { /* not allowed here: the game still works in the window */ }
  }, { passive: true });
})();

// Offline play: Zuzu's service worker saves every game. It needs http(s), so it is skipped
// when the file is opened straight from disk.
if (typeof navigator !== 'undefined' && navigator.serviceWorker && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
}
